# Weekly dependency updates, each as a pull request through the same checks as any other change.
# The cooldown waits a few days after a release before proposing it: most malicious releases are pulled within hours.
version: 2

# Playwright's library (npm) and its browsers' image (docker, apps/factory/Dockerfile.browser) are one release, so they
# move in one pull request. An ecosystem entry in a multi-ecosystem group updates only the group's patterns, so each
# ecosystem has a second entry, for everything else, which ignores Playwright. A group opens its pull request with the
# ecosystems that have an update, and opens another, beside it, when the rest have theirs: it does not add them to the
# first. Dependabot cannot tell when Microsoft's registry published an image, so the image has no cooldown, and the
# library's is a day, pnpm's own minimum release age, so that both are usually ready on the same daily run. When they
# are not, each half fails scripts/image-pins.test.ts: the image's pin goes onto the library's pull request, by hand,
# and Dependabot closes the image's.
multi-ecosystem-groups:
  playwright:
    schedule:
      interval: daily
    commit-message:
      prefix: chore
      include: scope

updates:
  - package-ecosystem: npm
    directory: /
    schedule:
      interval: weekly
    # A day, not three: see the playwright group, above.
    cooldown:
      default-days: 1
    multi-ecosystem-group: playwright
    patterns: ['playwright', 'playwright-core', '@playwright/test']

  - package-ecosystem: npm
    directory: /
    schedule:
      interval: weekly
    ignore:
      # In the playwright group, above.
      - dependency-name: playwright
      - dependency-name: playwright-core
      - dependency-name: '@playwright/test'
      # Node's own types follow the Node version in mise.toml, which moves by hand.
      - dependency-name: '@types/node'
        update-types: [version-update:semver-major]
      # 2.1.15 was published without provenance (2.1.14 and 2.1.16 have it), so pnpm's trust policy refuses it and
      # fails the whole update. Remove once lefthook 2.1.16 or later is merged.
      - dependency-name: lefthook
        versions: ['2.1.15']
    # A week for a major: postgres.js 4.0.0 lost LISTEN after a failed reconnect and leaked cached rows, and 4.1.0 fixed
    # both a week later. The first release of a major is the one most often followed by a fix.
    cooldown:
      default-days: 3
      semver-major-days: 7
    commit-message:
      prefix: chore
      include: scope
    # A dependency goes to the first group it matches, and the last two take what the first two leave, so a week's updates
    # arrive as a few pull requests rather than one each, and fewer are left to bring up to date after each merge. A
    # major of a production dependency comes alone, but for OpenTelemetry's, whose packages move together whatever the
    # update: sdk-node's minor pins sdk-metrics's major.
    groups:
      opentelemetry:
        patterns: ['@opentelemetry/*']
      fonts:
        patterns: ['@fontsource/*', '@fontsource-variable/*']
      tooling:
        dependency-type: development
        # A development dependency of OpenTelemetry's moves with the SDK it tests, which needs the same API.
        exclude-patterns: ['@opentelemetry/*']
      production:
        dependency-type: production
        update-types: [minor, patch]

  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: weekly
    cooldown:
      default-days: 3
    commit-message:
      prefix: ci
    groups:
      actions:
        patterns: ['*']

  # CI pulls these images from its own copy in GHCR (scripts/ci-images.sh), but every pin names its upstream, which is
  # what Dependabot reads. Docker's official images are named on Docker Hub, as `node` and `postgres`: Amazon's copy
  # of it (public.ecr.aws) refuses Dependabot partway through listing Node's thousands of tags. Postgres has one pin, its
  # StatefulSet's, which everything else that runs it reads. The Postgres exporter, which CI never runs, is named on
  # Quay, where its maintainers publish it, and has one pin too, its Deployment's.
  #
  # A docker cooldown holds only where the registry gives Dependabot the image's publication date. Where it gives none,
  # the pull request opens with Dependabot's warning that no publication date was available, and the image arrives at
  # the first weekly run after its release, held by its digest and review alone. By registry, from each one's bumps:
  #   Docker Hub (node, postgres, nginxinc/nginx-unprivileged)       no date
  #   gcr.io (distroless/nodejs24-debian13)                          no date
  #   Microsoft's, mcr.microsoft.com (playwright, devcontainers)     no date
  #   GHCR (open-feature/flagd, below)                               no date
  #   GHCR (aquasecurity/trivy)                                      unknown until its first bump: taken to give none
  #   Quay (prometheuscommunity/postgres-exporter)                   unknown until its first bump
  # Trivy is the scanner every workflow runs, pinned once, in deploy/images/trivy/Dockerfile, which nothing builds, and
  # outside .github/, which Dependabot may not write. The cooldown is kept for it so that it holds if GHCR gives a date,
  # and a bump waits for Martin, as deploy/ is his.
  - package-ecosystem: docker
    directory: /apps/factory
    schedule:
      interval: weekly
    multi-ecosystem-group: playwright
    patterns: [playwright]

  - package-ecosystem: docker
    directories:
      - /apps/console
      - /apps/factory
      - /apps/runner
      - /.devcontainer
      - /deploy/base/postgres
      - /deploy/base/postgres-exporter
      # The read-only proxy's nginx (query.yaml).
      - /deploy/base/telemetry
      - /deploy/images/trivy
    schedule:
      interval: weekly
    ignore:
      # The build image's Node matches mise.toml's; a new major is a deliberate change, not a weekly bump.
      - dependency-name: node
        update-types: [version-update:semver-major]
      # A new major of Postgres needs its data directory upgraded, which is a change of its own.
      - dependency-name: postgres
        update-types: [version-update:semver-major]
      # In the playwright group, above.
      - dependency-name: playwright
    cooldown:
      default-days: 3
    commit-message:
      prefix: chore
      include: scope
    # Node and the distroless runtime move together: the runtime's digest carries its own Node, which no tag names, so
    # a bump of one alone leaves the build's Node and the runtime's apart, and passes every check while it does
    # (scripts/image-pins.test.ts reads the tag, not the binary). Their pull request then waits for mise.toml, which
    # follows by hand. Dependabot names an image without its registry (`distroless/nodejs24-debian13`, as its pull
    # requests say), so the pattern leaves `gcr.io/` out. Every other image pinned in several directories moves in all
    # of them in one pull request, an image to a pull request: without `group-by`, a group here would make a pull
    # request per directory instead; nothing makes one for every image.
    groups:
      node:
        patterns: ['node', 'distroless/nodejs*']
      images:
        patterns: ['*']
        group-by: dependency-name

  # flagd (deploy/base/flagd), from OpenFeature's GHCR. The cooldown below does not apply: GHCR gives Dependabot no
  # publication date for flagd's image (its pull request says so), so Martin holds a bump until its release is two weeks
  # old. It is kept so that it applies if GHCR ever gives one. Its pin is its Deployment's alone,
  # which `flagd-images` admits (deploy/base/admission/flagd). The FeatureFlag kind's definition beside it is vendored
  # at the version of OpenFeature's operator API that flagd builds against, so a release that moves that moves the
  # definition too, by hand.
  - package-ecosystem: docker
    directory: /deploy/base/flagd
    schedule:
      interval: weekly
    cooldown:
      default-days: 14
    commit-message:
      prefix: chore
      include: scope

  - package-ecosystem: devcontainers
    directory: /
    schedule:
      interval: weekly
    commit-message:
      prefix: chore
      include: scope
