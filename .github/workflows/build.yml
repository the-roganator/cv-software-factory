# Builds the console image and the factory's three images on main and pushes them to GHCR, each tagged and labelled
# with the commit it was built from, then signs each by digest and attests its SBOM. It opens nothing.
#
# Signing is keyless: cosign proves this workflow's identity with the job's OIDC token, Sigstore's Fulcio certifies it
# for ten minutes, and the signature goes into Sigstore's public log, Rekor. There is no key to keep or steal. The
# signature says which workflow, in which repository, on which ref made the image: only `build.yml` on main is
# trusted, by the deploy watch and the deploy pull requests' checks alike.
#
# Argo CD deploys only what is in git, so a new image reaches the local cluster through a pull request that pins its
# digest in deploy/overlays/local. The factory's GitHub worker sees the new image in GHCR and opens that pull request
# as the factory's App (ADR 0005): one pull request, which moves the console's pin, the pin of the factory images
# (built together), or both, each to its own newest build.
name: build

on:
  push:
    branches: [main]
    # Only what goes into an image. Merging a deploy pull request must not build again, and nor must a release:
    # it changes only the root package.json's version. The images' dependencies come from the lockfile. The
    # `changes` job below says which images a push changes.
    paths:
      - apps/console/**
      - apps/factory/**
      - apps/runner/**
      - packages/events/**
      - packages/store/**
      - packages/triage/**
      - policy/**
      - docs/design/system/properties.css
      - docs/design/system/station.ts
      - docs/design/system/mark/**
      - pnpm-lock.yaml
      - pnpm-workspace.yaml
      # The runner image's pnpm.
      - mise.lock
      - .github/workflows/build.yml
  workflow_dispatch:

permissions: {}

concurrency:
  group: build
  cancel-in-progress: false

jobs:
  # Which images to build: each one whose inputs changed since the commit its last deploy pull request pinned. Not
  # since the previous push: the build group keeps one run waiting and cancels it when a newer one queues, and a run
  # can fail, so a change seen only by a run that never finished would never be built. A change built but not yet
  # deployed is built again with the next one, and its deploy pull request moves to the newer digest.
  changes:
    name: which images changed
    runs-on: ubuntu-24.04
    timeout-minutes: 3
    permissions:
      contents: read
    outputs:
      console: ${{ steps.which.outputs.console }}
      factory: ${{ steps.which.outputs.factory }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
          fetch-depth: 0
      - id: which
        run: |
          # What each image copies in (the Dockerfiles and their .dockerignore files say the same), and what they share.
          shared='^(packages/events/|packages/store/|pnpm-lock\.yaml|pnpm-workspace\.yaml|\.github/workflows/build\.yml)'
          console="$shared|^(apps/console/|docs/design/system/(properties\.css|station\.ts|mark/))"
          factory="$shared|^(apps/factory/|apps/runner/|packages/triage/|policy/|mise\.lock)"
          # $1: the output, $2: what the deploy commits' subject calls the image, $3: the image's inputs.
          decide() {
            # The squash-merged deploy pull request's subject names the commit it deployed, alone or after another:
            # "run console 1f14f44 on the local cluster", "run console 1f14f44 and the factory 9e0b2d1 on the local cluster".
            deployed=$(git log --format=%s -1 -E --grep "^chore\(deploy\): run (.+ and )?$2 [0-9a-f]{7,40} " | sed -E "s/^chore\(deploy\): run (.+ and )?$2 ([0-9a-f]+) .*/\2/")
            if [ "$GITHUB_EVENT_NAME" = workflow_dispatch ] || [ -z "$deployed" ] || ! git cat-file -e "$deployed^{commit}" 2>/dev/null; then
              echo "$1=true" >> "$GITHUB_OUTPUT"
            elif git diff --name-only "$deployed" "$GITHUB_SHA" | grep -Eq "$3"; then
              echo "$1=true" >> "$GITHUB_OUTPUT"
            else
              echo "$1=false" >> "$GITHUB_OUTPUT"
            fi
          }
          decide console 'console' "$console"
          decide factory 'the factory' "$factory"

  # Each image is built for each platform on a runner of that platform, side by side, and pushed by digest alone. A
  # job for each pair of builds then makes the image the cluster pins: an index of the two, tagged with the commit.
  # Laptops are arm64; cloud nodes are amd64. Each platform's layers are cached apart, and only here: check.yml's
  # builds read them and write none, so the repository's 10 GB of cache holds main's.
  console:
    name: console
    needs: changes
    if: needs.changes.outputs.console == 'true'
    runs-on: ${{ matrix.arch == 'arm64' && 'ubuntu-24.04-arm' || 'ubuntu-24.04' }}
    timeout-minutes: 15
    permissions:
      contents: read
      packages: write
    strategy:
      matrix:
        arch: [amd64, arm64]
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: docker/setup-buildx-action@f87e5991a6d7451dcb8d9637bfbc97413f497069 # v4.4.1
      - uses: docker/login-action@81c6f93d4bc991e510b342a00b419b3bb4efc5c6 # v4.7.0
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ github.token }}
      # Each base image a Dockerfile pins, from CI's copy of it (scripts/ci-images.sh): the same digest, so the same image.
      - id: bases
        run: scripts/ci-images.sh contexts console
      - id: build
        uses: docker/build-push-action@c3c9e263c25d99ce0380d002d59b67737d91b0dc # v7.4.0
        with:
          context: .
          file: apps/console/Dockerfile
          platforms: linux/${{ matrix.arch }}
          build-contexts: ${{ steps.bases.outputs.console }}
          outputs: type=image,name=ghcr.io/${{ github.repository }}/console,push-by-digest=true,name-canonical=true,push=true
          build-args: GIT_COMMIT=${{ github.sha }}
          labels: |
            org.opencontainers.image.source=${{ github.server_url }}/${{ github.repository }}
            org.opencontainers.image.revision=${{ github.sha }}
            org.opencontainers.image.title=Software Factory console
            org.opencontainers.image.licenses=MIT
          cache-from: type=gha,scope=console-${{ matrix.arch }}
          cache-to: type=gha,mode=max,scope=console-${{ matrix.arch }}
      - env:
          DIGEST: ${{ steps.build.outputs.digest }}
          ARCH: ${{ matrix.arch }}
        run: mkdir digests && echo "$DIGEST" > "digests/console-$ARCH"
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: digest-console-${{ matrix.arch }}
          path: digests
          retention-days: 1

  # The factory's three images, each for each platform, all from one commit: the runners' image moves with the factory's.
  factory:
    name: factory
    needs: changes
    if: needs.changes.outputs.factory == 'true'
    runs-on: ${{ matrix.arch == 'arm64' && 'ubuntu-24.04-arm' || 'ubuntu-24.04' }}
    timeout-minutes: 20
    permissions:
      contents: read
      packages: write
    strategy:
      matrix:
        # A short base key, so GitHub names each build "factory (browser, arm64)", whole in a run's graph; include gives
        # each part its image's full name.
        part: [factory, browser, runner]
        arch: [amd64, arm64]
        include:
          - part: factory
            image: factory
            file: apps/factory/Dockerfile
            bases: factory
            title: Software Factory workers
          - part: browser
            image: factory-browser
            file: apps/factory/Dockerfile.browser
            bases: browser
            title: Software Factory browser workers
          - part: runner
            image: factory-runner
            file: apps/runner/Dockerfile
            bases: runner
            title: Software Factory runner
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: docker/setup-buildx-action@f87e5991a6d7451dcb8d9637bfbc97413f497069 # v4.4.1
      - uses: docker/login-action@81c6f93d4bc991e510b342a00b419b3bb4efc5c6 # v4.7.0
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ github.token }}
      # Each base image a Dockerfile pins, from CI's copy of it (scripts/ci-images.sh): the same digest, so the same image.
      - id: bases
        env:
          BASES: ${{ matrix.bases }}
        run: scripts/ci-images.sh contexts "$BASES"
      - id: build
        uses: docker/build-push-action@c3c9e263c25d99ce0380d002d59b67737d91b0dc # v7.4.0
        with:
          context: .
          file: ${{ matrix.file }}
          platforms: linux/${{ matrix.arch }}
          build-contexts: ${{ steps.bases.outputs[matrix.bases] }}
          outputs: type=image,name=ghcr.io/${{ github.repository }}/${{ matrix.image }},push-by-digest=true,name-canonical=true,push=true
          labels: |
            org.opencontainers.image.source=${{ github.server_url }}/${{ github.repository }}
            org.opencontainers.image.revision=${{ github.sha }}
            org.opencontainers.image.title=${{ matrix.title }}
            org.opencontainers.image.licenses=MIT
          cache-from: type=gha,scope=${{ matrix.image }}-${{ matrix.arch }}
          cache-to: type=gha,mode=max,scope=${{ matrix.image }}-${{ matrix.arch }}
      - env:
          DIGEST: ${{ steps.build.outputs.digest }}
          NAME: ${{ matrix.image }}-${{ matrix.arch }}
        run: mkdir digests && echo "$DIGEST" > "digests/$NAME"
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: digest-${{ matrix.image }}-${{ matrix.arch }}
          path: digests
          retention-days: 1

  # Each image the cluster pins: an index of its two platforms' builds, tagged with the commit, made only when every
  # build of its group finished (scripts/image-index.sh). A job for each group, so that one failing cannot keep the
  # other's digests from the signing.
  push-console:
    name: push console
    needs: console
    if: needs.console.result == 'success'
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    permissions:
      contents: read
      packages: write
    outputs:
      console: ${{ steps.push.outputs.console }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: docker/setup-buildx-action@f87e5991a6d7451dcb8d9637bfbc97413f497069 # v4.4.1
      - uses: docker/login-action@81c6f93d4bc991e510b342a00b419b3bb4efc5c6 # v4.7.0
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ github.token }}
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          pattern: digest-console-*
          merge-multiple: true
          path: digests
      - id: push
        run: scripts/image-index.sh console

  push-factory:
    name: push factory
    needs: factory
    if: needs.factory.result == 'success'
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    permissions:
      contents: read
      packages: write
    outputs:
      factory: ${{ steps.push.outputs.factory }}
      factory-browser: ${{ steps.push.outputs.factory-browser }}
      factory-runner: ${{ steps.push.outputs.factory-runner }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: docker/setup-buildx-action@f87e5991a6d7451dcb8d9637bfbc97413f497069 # v4.4.1
      - uses: docker/login-action@81c6f93d4bc991e510b342a00b419b3bb4efc5c6 # v4.7.0
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ github.token }}
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          pattern: digest-factory*
          merge-multiple: true
          path: digests
      - id: push
        run: scripts/image-index.sh factory factory-browser factory-runner

  # Signs each image the jobs above pushed, by digest, and attests an SBOM of each of its platforms, made by Syft. Jobs
  # of their own, so that only they can ask for the workflow's OIDC token, and nothing an image's build runs ever can:
  # one for each image, side by side. If one fails, its image is in GHCR unsigned, and the deploy watch will not propose
  # it until it is run again.
  sign:
    name: sign
    needs: [push-console, push-factory]
    if: ${{ !cancelled() && (needs.push-console.result == 'success' || needs.push-factory.result == 'success') }}
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    permissions:
      packages: write # cosign keeps the signatures and attestations beside the images
      id-token: write # the workflow's identity, which Fulcio certifies
    strategy:
      fail-fast: false
      matrix:
        image: [console, factory, factory-browser, factory-runner]
        include:
          - image: console
            push: push-console
          - image: factory
            push: push-factory
          - image: factory-browser
            push: push-factory
          - image: factory-runner
            push: push-factory
    env:
      # Only what its group's push job output, when it finished: every index of the group made, from builds that all
      # finished. An image it did not make has none, and its job does nothing.
      DIGEST: ${{ needs[matrix.push].result == 'success' && needs[matrix.push].outputs[matrix.image] || '' }}
    steps:
      - if: env.DIGEST != ''
        uses: sigstore/cosign-installer@6f9f17788090df1f26f669e9d70d6ae9567deba6 # v4.1.2
        with:
          cosign-release: v3.1.3
      - id: syft
        if: env.DIGEST != ''
        uses: anchore/sbom-action/download-syft@66cbf4bc1f1c0d2edc94016e65bc221b6bb0ad6c # v0.24.3
        with:
          syft-version: v1.54.0
      - if: env.DIGEST != ''
        uses: docker/login-action@81c6f93d4bc991e510b342a00b419b3bb4efc5c6 # v4.7.0
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ github.token }}
      - if: env.DIGEST != ''
        env:
          NAME: ${{ matrix.image }}
          SYFT: ${{ steps.syft.outputs.cmd }}
        run: |
          set -euo pipefail
          [[ "$DIGEST" =~ ^sha256:[0-9a-f]{64}$ ]] || { echo "::error::$NAME has no digest: $DIGEST"; exit 1; }
          ref="ghcr.io/$GITHUB_REPOSITORY/$NAME@$DIGEST"
          # One SBOM for each platform, made side by side: Syft pulls each platform's layers, which is most of the time.
          scans=()
          for arch in amd64 arm64; do
            "$SYFT" scan --quiet --platform "linux/$arch" "registry:$ref" --output "spdx-json=sbom-$arch.spdx.json" &
            scans+=("$!")
          done
          # Every scan is waited for, so a failure of each is reported, and nothing is attested unless both finished.
          failed=0
          for scan in "${scans[@]}"; do wait "$scan" || failed=1; done
          [ "$failed" = 0 ] || exit 1
          # Each attested on the image index that the cluster pins. The signature comes last, so an image that carries
          # one has its SBOMs too: the deploy watch looks for the signature alone.
          for arch in amd64 arm64; do
            cosign attest --yes --type spdxjson --predicate "sbom-$arch.spdx.json" "$ref"
          done
          cosign sign --yes "$ref"
          echo "$ref: signed, with an SBOM of each platform attested"
