# The required checks on every pull request.
name: check

# Pull requests the factory's App opens (deploy, release) run these too, at once: no workflow opens pull requests.
# Some are lighter (the `kind` job): the App's release and deploy pull requests, and anyone's that changes only
# manifests, run no browser tests, and a deploy or manifests pull request's images are checked rather than built. They
# also run on the merge queue's commit for a pull request, which holds the change on main as it will merge, and is the
# very commit main moves to. Everything runs there but for the App's deploy, which is told apart there as on its pull
# request and runs as light, its tests standing on the queue's run of the commit it is made on; a release or manifests
# pull request runs everything there. That run is main's test, so nothing runs again on main after a merge. The
# README's badge reports the queue's latest run, which may be of a pull request the queue turned away rather than of
# main.
on:
  pull_request:
  merge_group:
    types: [checks_requested]

permissions:
  contents: read

# A pull request's newer push cancels its older run. Each of the queue's commits has a branch of its own, so no run
# there cancels another.
concurrency:
  group: check-${{ github.head_ref || github.ref }}
  cancel-in-progress: true

jobs:
  # Which checks can see what a change makes (scripts/check-kind.sh). A skipped job counts as passed for the ruleset, so
  # only these skip any, each tested on the exact files and lines that change:
  # - `release` and `deploy`: the factory's App opened it, into main, so the test is the author too, and the lines that
  #   change: for a release, only the changelog, the release manifest and package.json's version; for a deploy, only
  #   the digests of the images the local profile's two pin files pin. Neither runs the tests: nothing they read
  #   changes (scripts/release-files.test.ts, scripts/deploy-files.test.ts), so the commit it is made on passing them
  #   in the merge queue stands for it.
  # - `manifests`: anyone's, changing only files under deploy/. No image copies anything from there
  #   (scripts/dockerfiles.test.ts), and nothing the browser tests run reads it (scripts/browser-tests.test.ts), but
  #   for the Postgres the console's run beside: a change to its pin is `code`.
  # In the merge queue, whose event names no pull request, only `deploy` is told, by the same test on the change from
  # the commit the queue's entry is made on, with the author and base of the pull request its branch names, read from
  # the API. Anything else, or this job failing, is `code` and runs everything: the job writes the kind last, once it
  # has it, so a job that fails has none.
  kind:
    name: which checks apply
    runs-on: ubuntu-24.04
    timeout-minutes: 3
    permissions:
      contents: read
      # The queue's pull request, for its author and base.
      pull-requests: read
    outputs:
      kind: ${{ steps.which.outputs.kind }}
      base: ${{ steps.which.outputs.base }}
      postgres: ${{ steps.postgres.outputs.image }}
      playwright: ${{ steps.playwright.outputs.image }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
          # The merge commit and its parents, or the queue's commit and the one it is made on: the first parent is the
          # base, so the diff between them is what would merge.
          fetch-depth: 2
      # The Postgres the console's browser tests run beside, the cluster's, from CI's copy of it (scripts/ci-images.sh).
      # First, so that the output is set even when the step below fails.
      - id: postgres
        run: echo "image=$(scripts/ci-images.sh postgres)" >> "$GITHUB_OUTPUT"
      # The Playwright image the browser tests run in, from CI's copy of it (scripts/ci-images.sh). Its one pin is
      # Dockerfile.browser's, which Dependabot moves with the library.
      - id: playwright
        run: echo "image=$(scripts/ci-images.sh resolve "$(grep -oE 'mcr\.microsoft\.com/playwright:\S+' apps/factory/Dockerfile.browser)")" >> "$GITHUB_OUTPUT"
      - id: which
        env:
          AUTHOR: ${{ github.event.pull_request.user.login }}
          QUEUE_BRANCH: ${{ github.event.merge_group.head_ref }}
          GH_TOKEN: ${{ github.token }}
        run: |
          base=$(git rev-parse HEAD^1)
          kind=$(scripts/check-kind.sh)
          echo "$kind"
          printf 'kind=%s\nbase=%s\n' "$kind" "$base" >> "$GITHUB_OUTPUT"

  # `make check` in two halves side by side, the tests in three parts, each on a runner of its own. A part that fails
  # stops none of the others, so a run shows every failure.
  static:
    name: static checks
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      # mise itself at one named release in every workflow (scripts/toolchain.test.ts). With mise.lock beside mise.toml,
      # the action installs with `--locked`: the versions and checksums the lock holds, and it fails when the lock has
      # none for a request, rather than resolve that day's release.
      - uses: jdx/mise-action@6be3c7ed4c21d4f76b208d351d95aac273ebb76d # v5.2.4
        with:
          version: 2026.10.17
          install_args: node pnpm kustomize
      - run: pnpm install --frozen-lockfile
      - run: make check-static

  tests:
    name: tests
    needs: kind
    # Skipped only for a release or a deploy: the required check below stands on its base's tests instead.
    if: ${{ !cancelled() && !contains(fromJSON('["release", "deploy"]'), needs.kind.outputs.kind) }}
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    strategy:
      fail-fast: false
      matrix:
        shard: [1/3, 2/3, 3/3]
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      # The store's tests start their own Postgres, the image the cluster runs, from CI's copy of it
      # (scripts/ci-images.sh).
      - run: echo "TEST_POSTGRES_IMAGE=$(scripts/ci-images.sh postgres)" >> "$GITHUB_ENV"
      - uses: jdx/mise-action@6be3c7ed4c21d4f76b208d351d95aac273ebb76d # v5.2.4
        with:
          version: 2026.10.17
          # kustomize, step and promtool for the tests that render the manifests, make a local certificate authority
          # and run the alerts on the flags (scripts/image-pins.test.ts, scripts/local-ca.test.ts,
          # apps/factory/test/flag-alerts.test.ts).
          install_args: node pnpm kustomize step promtool
      - run: pnpm install --frozen-lockfile
      - run: make check-tests SHARD="$SHARD"
        env:
          SHARD: ${{ matrix.shard }}

  # The one check the ruleset requires of `make check` (scripts/github-settings.ts), so that it need not change when it
  # is split differently. It passes when both halves passed, every part of the tests included; for a release or a
  # deploy, when the static half passed and the commit it is made on passed this check in the merge queue: main's
  # commit, which passed before it landed, or, for a deploy in the queue, that or the queue's entry ahead of it. A
  # deploy's run in the queue passes only so, so each pass stands on a run of the tests, back along its bases. It runs
  # whatever they did, a cancelled run included, since a skipped job counts as passed.
  check:
    name: lint, types, tests
    needs: [kind, static, tests]
    if: ${{ always() }}
    runs-on: ubuntu-24.04
    # Long enough for a release or a deploy to wait out a re-run of the queue's run of this check on its base, or the
    # run of the entry ahead of it in the queue, which may run everything: a chain of its jobs takes about forty
    # minutes at most (scripts/github-settings.ts).
    timeout-minutes: 45
    permissions:
      actions: read
    steps:
      - env:
          KIND: ${{ needs.kind.result == 'success' && needs.kind.outputs.kind || 'code' }}
          BASE: ${{ needs.kind.outputs.base }}
          STATIC: ${{ needs.static.result }}
          TESTS: ${{ needs.tests.result }}
          GH_TOKEN: ${{ github.token }}
        run: |
          echo "kind: $KIND, static: $STATIC, tests: $TESTS"
          [ "$STATIC" = success ] || exit 1
          case "$KIND" in
            release | deploy) ;;
            *) [ "$TESTS" = success ]; exit ;;
          esac
          [ -n "$BASE" ] || exit 1
          # This check in this workflow's latest run on the base in the merge queue. On main, the queue's commit is the
          # one main moved to, so the run finished before the commit landed and is found at once; the entry ahead of a
          # deploy in the queue has its run under way, and it is waited for, as is a run re-run, its latest attempt
          # read. A call that fails is tried again. A base the queue never ran on reached main some other way: GitHub's
          # list can lag a moment behind a run, so it fails once a minute's asking finds none.
          runs="repos/$GITHUB_REPOSITORY/actions/workflows/check.yml/runs?event=merge_group&head_sha=$BASE"
          missing=0
          for _ in $(seq 168); do
            state=""
            if run=$(gh api "$runs" --jq '.workflow_runs[0].id // empty'); then
              if [ -n "$run" ]; then
                state=$(gh api "repos/$GITHUB_REPOSITORY/actions/runs/$run/jobs?per_page=100" \
                  --jq '.jobs[] | select(.name == "lint, types, tests") | "\(.status) \(.conclusion)"' || true)
              else
                missing=$((missing + 1))
                [ "$missing" -lt 5 ] || { echo "$BASE has no run in the merge queue"; exit 1; }
              fi
            fi
            echo "$BASE in the merge queue: ${state:-not found yet}"
            case "$state" in
              'completed success') exit 0 ;;
              completed*) exit 1 ;;
            esac
            sleep 15
          done
          exit 1

  # The browser tests run side by side: the console's, in parts, and the factory's senses (the crawler and the probes).
  # Each needs the pinned Playwright image, on arm64 like the laptops the snapshots are made on, so they match.
  console-browser:
    name: console browser
    needs: kind
    # Skipped only for a release, deploy or manifests pull request, and a deploy in the merge queue: they change nothing
    # a browser test could see.
    if: ${{ !cancelled() && !contains(fromJSON('["release", "deploy", "manifests"]'), needs.kind.outputs.kind) }}
    runs-on: ubuntu-24.04-arm
    timeout-minutes: 15
    # The console's tests in three shards, each on a runner of its own, and the speed test on another: it is timed, so
    # it runs alone, with no other test's browser on its CPU. A part that fails stops none of the others, so a run
    # shows every failure.
    strategy:
      fail-fast: false
      matrix:
        part: [1/3, 2/3, 3/3, speed]
        include:
          - part: 1/3
            tests: --project console --project live --shard 1/3
          - part: 2/3
            tests: --project console --project live --shard 2/3
          - part: 3/3
            tests: --project console --project live --shard 3/3
          - part: speed
            tests: --project speed --no-deps
    container:
      image: ${{ needs.kind.outputs.playwright }}
      options: --ipc=host
    services:
      postgres:
        image: ${{ needs.kind.outputs.postgres }}
        env:
          POSTGRES_USER: factory
          POSTGRES_PASSWORD: test
        options: --health-cmd "pg_isready -U factory" --health-interval 2s --health-retries 30
    env:
      SF_PINNED_BROWSER: '1'
      TEST_DATABASE_URL: postgres://factory:test@postgres:5432/postgres
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - run: corepack enable && pnpm install --frozen-lockfile --ignore-scripts
      - run: pnpm --filter @software-factory/console build
      - run: pnpm exec playwright test $TESTS
        working-directory: apps/console
        env:
          TESTS: ${{ matrix.tests }}
      - if: failure()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          # One for each part, numbered from 0 in the order above.
          name: browser-test-report-${{ strategy.job-index }}
          path: |
            apps/console/e2e-report
            apps/console/e2e-results
          retention-days: 7

  senses-browser:
    name: senses browser
    needs: kind
    if: ${{ !cancelled() && !contains(fromJSON('["release", "deploy", "manifests"]'), needs.kind.outputs.kind) }}
    runs-on: ubuntu-24.04-arm
    timeout-minutes: 15
    container:
      image: ${{ needs.kind.outputs.playwright }}
      options: --ipc=host
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - run: corepack enable && pnpm install --frozen-lockfile --ignore-scripts
      - run: pnpm exec vitest run --project browser

  # ZAP's baseline scan of the console with Martin's session (apps/console/zap/scan.ts, ADR 0012): the console's server
  # and the admin service on one origin, on a throwaway store, with a browser signed in through the enrolment page by a
  # virtual passkey. A finding fails it unless apps/console/zap/rules.tsv keeps a reason for it. It runs on the runner
  # itself, not in the Playwright image, because ZAP runs in Docker beside it.
  zap:
    name: ZAP scan
    needs: kind
    if: ${{ !cancelled() && !contains(fromJSON('["release", "deploy", "manifests"]'), needs.kind.outputs.kind) }}
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    services:
      postgres:
        image: ${{ needs.kind.outputs.postgres }}
        env:
          POSTGRES_USER: factory
          POSTGRES_PASSWORD: test
        ports:
          - 127.0.0.1:5432:5432
        options: --health-cmd "pg_isready -U factory" --health-interval 2s --health-retries 30
    env:
      TEST_DATABASE_URL: postgres://factory:test@127.0.0.1:5432/postgres
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: jdx/mise-action@6be3c7ed4c21d4f76b208d351d95aac273ebb76d # v5.2.4
        with:
          version: 2026.10.17
          install_args: node pnpm
      - run: pnpm install --frozen-lockfile --ignore-scripts
      - run: pnpm --filter @software-factory/console build
      # The browser that signs in: Playwright's own headless build of Chromium, the version the lockfile pins, from its
      # CDN. Not --with-deps: the runner's image already has the libraries it needs (it ships Chrome), and installing
      # Chromium's fonts and packages from Ubuntu's mirror took minutes on a bad day for nothing the scan reads.
      - run: pnpm --filter @software-factory/console exec playwright install --only-shell chromium
        timeout-minutes: 3
      - run: node apps/console/zap/scan.ts
      - if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: zap-report
          path: apps/console/zap-report
          retention-days: 7

  # The one check the ruleset requires of the browser tests (scripts/github-settings.ts), so that it need not change
  # when they are split differently. It passes when every job passed, every part of the console's and ZAP's scan
  # included, and is skipped, as they are, for a release, deploy or manifests pull request, and a deploy in the queue.
  browser:
    name: browser tests
    needs: [kind, console-browser, senses-browser, zap]
    if: ${{ !cancelled() && !contains(fromJSON('["release", "deploy", "manifests"]'), needs.kind.outputs.kind) }}
    runs-on: ubuntu-24.04
    timeout-minutes: 3
    steps:
      - env:
          CONSOLE: ${{ needs.console-browser.result }}
          SENSES: ${{ needs.senses-browser.result }}
          ZAP: ${{ needs.zap.result }}
        run: |
          echo "console: $CONSOLE, senses: $SENSES, ZAP: $ZAP"
          [ "$CONSOLE" = success ] && [ "$SENSES" = success ] && [ "$ZAP" = success ]

  # A deploy or manifests pull request builds nothing, since no image holds what it changes: it checks that each image it
  # pins was built from main, and so does a deploy in the merge queue. Any change that moves a pin checks that the
  # images it moves to were signed there. A release pull request changes nothing an image holds or pins, so it skips
  # this.
  image:
    name: image builds
    needs: kind
    if: ${{ !cancelled() && needs.kind.outputs.kind != 'release' }}
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    env:
      BUILD: ${{ !contains(fromJSON('["deploy", "manifests"]'), needs.kind.outputs.kind) }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
          # The commit and its parent (a pull request's base), so the signature check can tell which pins it moves.
          fetch-depth: 2
      # build.yml pushes each image tagged and labelled with the commit it was built from, and only on main does it
      # run with the right to push. A digest from a run on another branch, or one that is not in GHCR, fails here.
      - name: Check the pinned images were built from main
        if: env.BUILD != 'true'
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          for file in deploy/overlays/local/*-image/kustomization.yaml; do
            for ref in $(yq '.images[] | .newName + "@" + .digest' "$file"); do
              case "$ref" in
                "ghcr.io/$GITHUB_REPOSITORY/"*@sha256:*) ;;
                *) echo "::error file=$file::$ref is not one of this repository's images, pinned by digest"; exit 1 ;;
              esac
              revisions=$(docker buildx imagetools inspect "$ref" --format '{{ json .Image }}' \
                | jq -r '[.. | objects | .config?.Labels?["org.opencontainers.image.revision"]? // empty] | unique | .[]')
              if [ "$(wc -w <<< "$revisions")" -ne 1 ]; then
                echo "::error file=$file::$ref does not name the one commit it was built from (found: ${revisions:-none})"; exit 1
              fi
              # "ahead" or "identical": main contains the commit.
              status=$(gh api "repos/$GITHUB_REPOSITORY/compare/$revisions...main" --jq .status)
              if [ "$status" != ahead ] && [ "$status" != identical ]; then
                echo "::error file=$file::$ref was built from $revisions, which is not on main"; exit 1
              fi
              echo "$ref: built from $revisions, on main"
            done
          done
      - uses: sigstore/cosign-installer@6f9f17788090df1f26f669e9d70d6ae9567deba6 # v4.1.2
        with:
          cosign-release: v3.1.3
      # Each image carries the signature of build.yml on this repository's main, made with the workflow's own identity,
      # and an SBOM it attested. Every change to a pin file, the App's or anyone's, and only the pins it moves: one
      # made before images were signed stays as it is until its own deploy moves it. HEAD^1 is the base a pull request
      # merges into, or, in the merge queue, the commit the queue's own is made on.
      - name: Check the images it moves to were signed by build.yml on main
        run: |
          identity="https://github.com/$GITHUB_REPOSITORY/.github/workflows/build.yml@refs/heads/main"
          trust=(--certificate-identity "$identity" --certificate-oidc-issuer https://token.actions.githubusercontent.com)
          # A pin is the image an entry names, so two entries that swap digests both move.
          pins='.images[] | .name + "=" + .newName + "@" + .digest'
          # Each read is its own assignment, so one that fails fails the step rather than checking nothing.
          files=$(git diff --name-only HEAD^1 HEAD -- 'deploy/overlays/local/*-image/kustomization.yaml')
          for file in $files; do
            refs=$(yq "$pins" "$file")
            [ -n "$refs" ] || { echo "::error file=$file::$file pins no image"; exit 1; }
            # A pin file new in this change moves every pin in it.
            before=""
            if git cat-file -e "HEAD^1:$file" 2> /dev/null; then
              base=$(git show "HEAD^1:$file")
              before=$(yq "$pins" <<< "$base")
            fi
            moved=$(comm -13 <(sort -u <<< "$before") <(sort -u <<< "$refs"))
            [ -n "$moved" ] || echo "$file: moves no pin, nothing to check"
            for pin in $moved; do
              ref=${pin#*=}
              if ! cosign verify "${trust[@]}" "$ref" > /dev/null; then
                echo "::error file=$file::$ref is not signed by $identity"; exit 1
              fi
              if ! cosign verify-attestation --type spdxjson "${trust[@]}" "$ref" > /dev/null; then
                echo "::error file=$file::$ref has no SBOM attested by $identity"; exit 1
              fi
              echo "$ref: signed by $identity, with its SBOM attested"
            done
          done
      # Reads main's cache of each image's amd64 layers, which build.yml writes, and writes none of its own: a pull
      # request's cache serves only its own runs, and would crowd main's out of the repository's 10 GB.
      - if: env.BUILD == 'true'
        uses: docker/setup-buildx-action@f87e5991a6d7451dcb8d9637bfbc97413f497069 # v4.4.1
      # Each base image a Dockerfile pins, from CI's copy of it (scripts/ci-images.sh).
      - if: env.BUILD == 'true'
        id: bases
        run: scripts/ci-images.sh contexts console factory browser runner
      - if: env.BUILD == 'true'
        uses: docker/build-push-action@c3c9e263c25d99ce0380d002d59b67737d91b0dc # v7.4.0
        with:
          context: .
          file: apps/console/Dockerfile
          build-contexts: ${{ steps.bases.outputs.console }}
          push: false
          cache-from: type=gha,scope=console-amd64
      - if: env.BUILD == 'true'
        uses: docker/build-push-action@c3c9e263c25d99ce0380d002d59b67737d91b0dc # v7.4.0
        with:
          context: .
          file: apps/factory/Dockerfile
          build-contexts: ${{ steps.bases.outputs.factory }}
          push: false
          cache-from: type=gha,scope=factory-amd64
      - if: env.BUILD == 'true'
        uses: docker/build-push-action@c3c9e263c25d99ce0380d002d59b67737d91b0dc # v7.4.0
        with:
          context: .
          file: apps/factory/Dockerfile.browser
          build-contexts: ${{ steps.bases.outputs.browser }}
          push: false
          cache-from: type=gha,scope=factory-browser-amd64
      # The runner image is kept, to run below.
      - if: env.BUILD == 'true'
        uses: docker/build-push-action@c3c9e263c25d99ce0380d002d59b67737d91b0dc # v7.4.0
        with:
          context: .
          file: apps/runner/Dockerfile
          build-contexts: ${{ steps.bases.outputs.runner }}
          push: false
          load: true
          tags: factory-runner:check
          cache-from: type=gha,scope=factory-runner-amd64
      # A runner's prepare step, in that image, as the line's prepare pod runs it but with no network, on a checkout
      # made here: a broken image fails here rather than at the line's next step, once it is pinned.
      - name: Run the prepare step in the runner image
        if: env.BUILD == 'true'
        run: apps/runner/scripts/image-check.sh factory-runner:check
