# Static analysis of the TypeScript and of the workflows themselves.
#
# Shared: cv-worlds-worst-website calls this workflow at a pinned commit, and it analyses the repository that calls it.
# The calling job grants `contents: read` and `security-events: write`.
#
# The `main` ruleset's code scanning rule (scripts/github-settings.ts) holds a pull request for its own analysis's
# alerts. It does not apply to the merge queue's groups, and the queue does not wait for CodeQL, so it does not run
# there: a run on the queue's commit fails its upload whenever the queue merges and deletes the branch first. Push to
# main analyses each merged commit. Each run keeps its language's category.
name: codeql

on:
  pull_request:
  push:
    branches: [main]
  schedule:
    - cron: '17 5 * * 1'
  workflow_call:

permissions:
  contents: read

jobs:
  analyze:
    name: codeql
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    permissions:
      contents: read
      security-events: write
    strategy:
      fail-fast: false
      matrix:
        language: [javascript-typescript, actions]
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: github/codeql-action/init@9b3254085494b55a0f7c4c2b3d2d52cc712ce370 # v4.39.1
        with:
          languages: ${{ matrix.language }}
          build-mode: none
          queries: security-and-quality
      - uses: github/codeql-action/analyze@9b3254085494b55a0f7c4c2b3d2d52cc712ce370 # v4.39.1
        with:
          category: /language:${{ matrix.language }}
