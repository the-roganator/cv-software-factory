# Static analysis of the TypeScript and of the workflows themselves.
#
# Shared: cv-worlds-worst-website calls this workflow at a pinned commit, and it analyses the repository that calls it.
# The calling job grants `contents: read` and `security-events: write`, and the caller's triggers start it: the app's
# runs it on its merge queue's commits by naming `merge_group` among its own.
#
# The `main` ruleset's code scanning rule (scripts/github-settings.ts) holds a merge for CodeQL's results, so it runs on
# the merge queue's commit too, as GitHub asks of a repository with a merge queue: with no analysis there, the queue
# could wait for one that never comes. Each run keeps its language's category, so the queue's analysis is compared
# with the same ones as a pull request's.
name: codeql

on:
  pull_request:
  merge_group:
    types: [checks_requested]
  push:
    branches: [main]
  schedule:
    - cron: '17 5 * * 1'
  workflow_call:

permissions:
  contents: read

jobs:
  analyze:
    name: codeql
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    permissions:
      contents: read
      security-events: write
    strategy:
      fail-fast: false
      matrix:
        language: [javascript-typescript, actions]
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: github/codeql-action/init@9b3254085494b55a0f7c4c2b3d2d52cc712ce370 # v4.39.1
        with:
          languages: ${{ matrix.language }}
          build-mode: none
          queries: security-and-quality
      - uses: github/codeql-action/analyze@9b3254085494b55a0f7c4c2b3d2d52cc712ce370 # v4.39.1
        with:
          category: /language:${{ matrix.language }}
