# Static analysis of the TypeScript and of the workflows themselves.
#
# Shared: cv-worlds-worst-website calls this workflow at a pinned commit, and it analyses the repository that calls it.
# The calling job grants `contents: read` and `security-events: write`. A called workflow runs only for its caller's
# events, so a caller names `merge_group` among its own triggers for CodeQL to analyse its merge queue's commits.
#
# The `main` ruleset's code scanning rule (scripts/github-settings.ts) holds a pull request for its own analysis's
# alerts. GitHub says that rule does not apply to the merge queue's groups, and also asks a repository with a merge
# queue to run code scanning on the queue's commit, so it runs there too: should the queue wait for results, they come.
# An alert found only on the queue's commit, where pull requests meet, is raised there and on main, and holds nothing.
# Each run keeps its language's category.
name: codeql

on:
  pull_request:
  merge_group:
    types: [checks_requested]
  push:
    branches: [main]
  schedule:
    - cron: '17 5 * * 1'
  workflow_call:

permissions:
  contents: read

jobs:
  analyze:
    name: codeql
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    permissions:
      contents: read
      security-events: write
    strategy:
      fail-fast: false
      matrix:
        language: [javascript-typescript, actions]
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: github/codeql-action/init@9b3254085494b55a0f7c4c2b3d2d52cc712ce370 # v4.39.1
        with:
          languages: ${{ matrix.language }}
          build-mode: none
          queries: security-and-quality
      - uses: github/codeql-action/analyze@9b3254085494b55a0f7c4c2b3d2d52cc712ce370 # v4.39.1
        with:
          category: /language:${{ matrix.language }}
