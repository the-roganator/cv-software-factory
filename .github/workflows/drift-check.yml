# The settings' drift check: weekly, and by hand, `scripts/github-settings.ts --check` reads both public repositories'
# rulesets, key environments and fork-run approval and fails if anything it can see differs from what the script makes them, or a ruleset
# was added beside them. A failed run reaches Martin as any failed scheduled run does, by GitHub's email.
#
# Rulesets, the fork-run approval, environments' branch policies and the names of their secrets need an admin's read, which no workflow token
# has. The job reads them as the drift check App, installed on both repositories, which may read administration,
# environments and Actions and nothing else (APPS.driftCheck in scripts/github-settings.ts), so it can change nothing
# it checks. Its key is the secret DRIFT_CHECK_APP_PRIVATE_KEY and its Client ID the variable DRIFT_CHECK_APP_CLIENT_ID,
# both in the `drift-check` environment, which only main may use. Until both are there, the run fails, saying so.
# GitHub shows who may bypass a ruleset only to a reader who may change it, which the App may not, so the check warns
# (an annotation on the run) that it did not compare that list, and passes on the rest; an admin's `--check`, as
# `make guardrails` (milestone 7 task 21) is to run, compares it.
#
# The workflow's own token may only read this repository's contents, for the checkout.
#
# Only `schedule` and `workflow_dispatch` start it, so it never runs for a pull request, and a dispatch from any other
# branch is refused the environment. It checks out main's copy of the script and the toolchain's pins, and nothing
# else.
name: drift check

on:
  schedule:
    - cron: '17 6 * * 1'
  workflow_dispatch:

permissions: {}

concurrency:
  group: drift-check
  cancel-in-progress: false

jobs:
  drift-check:
    name: drift check
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    environment: drift-check
    # Only to check out main's copy of the script: the reads it checks are the App's.
    permissions:
      contents: read
    env:
      # Whether the App's key and Client ID are here: a step's condition cannot read a secret, only this.
      HAS_APP: ${{ secrets.DRIFT_CHECK_APP_PRIVATE_KEY != '' && vars.DRIFT_CHECK_APP_CLIENT_ID != '' }}
    steps:
      - name: Refuse to pass without the App
        if: env.HAS_APP != 'true'
        run: |
          echo "::error::The drift-check environment needs the drift check App's key (DRIFT_CHECK_APP_PRIVATE_KEY) and Client ID (DRIFT_CHECK_APP_CLIENT_ID): without them nothing can read the settings, so nothing was checked."
          exit 1
      # This workflow's own commit, main's: the script and the toolchain's pins, nothing else.
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ job.workflow_sha }}
          sparse-checkout: |
            mise.toml
            mise.lock
            scripts/github-settings.ts
          sparse-checkout-cone-mode: false
          persist-credentials: false
      - uses: jdx/mise-action@b44d12e7d0d8ee7461bb893e1b1993500433185b # v5.2.7
        with:
          version: 2026.10.17
          cache_save: ${{ github.ref == 'refs/heads/main' }}
          install_args: node
      # One token for both repositories, with only the reads the check makes.
      - id: app
        uses: actions/create-github-app-token@64ab729a6294000f5aa4a4bc0b73d1f32bc45510 # v3.3.0
        with:
          client-id: ${{ vars.DRIFT_CHECK_APP_CLIENT_ID }}
          private-key: ${{ secrets.DRIFT_CHECK_APP_PRIVATE_KEY }}
          owner: the-roganator
          repositories: cv-software-factory,cv-worlds-worst-website
          permission-actions: read
          permission-administration: read
          permission-environments: read
      - name: Compare the live settings with the script's
        env:
          GH_TOKEN: ${{ steps.app.outputs.token }}
        run: node scripts/github-settings.ts --check
