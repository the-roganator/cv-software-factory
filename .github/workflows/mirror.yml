# Copies the third-party images the repository pins into its GHCR, where CI pulls them (scripts/ci-images.sh): Docker's
# official images, since hosted runners share addresses and Docker Hub limits anonymous pulls by address, and
# Playwright's from Microsoft's registry, which is now and then slow. Then every third-party image the cluster runs,
# for the platform check's cluster (deploy/k3d/ci-registries.yaml), whose registries limit by address too: ECR Public
# refused Argo CD's Redis once, and the check failed.
#
# Every day, so that a new version of Docker's images is copied before Dependabot, which waits three days, proposes it
# (Playwright's image has no wait, so its pull request may come first, and take it from Microsoft's registry until the
# next copy); after each merge, for any pin it brings; and by hand. Only from main, so no branch can publish a package. A pin it has not copied yet
# still works: CI pulls it from its own registry, with a warning.
name: mirror

on:
  schedule:
    - cron: '17 4 * * *'
  push:
    branches: [main]
  workflow_dispatch:

permissions: {}

jobs:
  mirror:
    name: copy images to GHCR
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-24.04
    # Playwright's image is two gigabytes for each platform, and each new release is copied whole; the cluster's images
    # are copied whole once, and after that only those whose tag or pin moved.
    timeout-minutes: 90
    permissions:
      contents: read
      packages: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      # The cluster's images are the list's (scripts/cluster-images.ts), its charts rendered; crane reads each image and
      # makes the copies, byte for byte, an index whose entries carry an artifactType among them, so each copy's digest
      # is its source's. Its cache main keeps (toolchain-cache.yml).
      - uses: jdx/mise-action@236a21c3b91f5db6d4e174b348674a0f0caac06d # v5.2.9
        with:
          version: 2026.10.17
          cache_save: ${{ github.ref == 'refs/heads/main' }}
          install_args: node kustomize helm yq crane
      - env:
          TOKEN: ${{ github.token }}
        run: |
          crane auth login ghcr.io --username "$GITHUB_ACTOR" --password-stdin <<< "$TOKEN"
          scripts/ci-images.sh sync
