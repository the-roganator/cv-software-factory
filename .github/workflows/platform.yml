# The `platform` check: a change to what the cluster runs is run on a cluster made from the change, before it merges.
# A chart, a value, a third-party image, k3s, k3d or Argo CD's pin can be proved only by a cluster, so this makes one,
# as `make up` makes the local one, from the change's own files: k3d from its deploy/k3d/cluster.yaml, at the k3d its
# mise.toml pins; Argo CD by the Makefile's own line; root, and every chart's values, at its commit. It passes when
# every Application is Synced and Healthy, every image policy enforces, and `make admission-ready` passes. Then it
# takes each refusal record with its script, and uploads them, for the record a change stales to be taken from the
# change's own cluster rather than edited.
#
# It runs the change's own scripts and manifests, so it holds nothing worth taking: its token reads the contents and
# nothing else, no job names a secret, and the Keychain's keys `make up` would give the cluster are stand-ins made in
# the job, which open nothing. It runs on a pull request and on the merge queue's commit, as check.yml's jobs do, and
# refuses any other event. Which changes run it is scripts/check-kind.sh's to say (`platform`): one that changes
# deploy/, the Makefile, mise's pins or what it runs, but never the factory's App's deploy pin of our own images, which
# were built from commits already merged (ADR 0017). Otherwise the job is skipped, which the ruleset counts as passed.
name: platform

on:
  pull_request:
  merge_group:
    types: [checks_requested]
  # The measurement runs on the branch that builds this check; taken out before its pull request opens.
  push:
    branches: [ci/platform-check]

permissions: {}

concurrency:
  group: platform-${{ github.head_ref || github.ref }}
  cancel-in-progress: true

jobs:
  # Whether the change is one a cluster alone can prove (scripts/check-kind.sh platform). In the merge queue, whose
  # event names no pull request, it reads the author and base of the one the queue's branch names, to tell the App's
  # deploy pin apart: that read, of a public pull request, is all its token can do.
  which:
    name: whether a cluster runs
    runs-on: ubuntu-24.04
    timeout-minutes: 3
    permissions:
      contents: read
      pull-requests: read
    outputs:
      platform: ${{ steps.which.outputs.platform }}
    steps:
      - name: Refuse a privileged context
        run: |
          case "$GITHUB_EVENT_NAME" in
            pull_request | merge_group | push) ;;
            *) echo "::error::The platform check runs on a pull request or the merge queue's commit, not $GITHUB_EVENT_NAME."; exit 1 ;;
          esac
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
          fetch-depth: 2
      - id: which
        env:
          AUTHOR: ${{ github.event.pull_request.user.login }}
          QUEUE_BRANCH: ${{ github.event.merge_group.head_ref }}
          GH_TOKEN: ${{ github.token }}
        run: |
          platform=$(scripts/check-kind.sh platform)
          if [ "$GITHUB_EVENT_NAME" = push ]; then platform=cluster; fi
          echo "$platform"
          echo "platform=$platform" >> "$GITHUB_OUTPUT"

  platform:
    name: platform
    needs: which
    if: ${{ needs.which.outputs.platform == 'cluster' }}
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    permissions:
      contents: read
    steps:
      - name: Refuse a privileged context
        run: |
          case "$GITHUB_EVENT_NAME" in
            pull_request | merge_group | push) ;;
            *) echo "::error::The platform check runs on a pull request or the merge queue's commit, not $GITHUB_EVENT_NAME."; exit 1 ;;
          esac
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      # The measurement: the runner's memory in use every five seconds, for the peak, and its disk at the end.
      - name: Measure
        run: |
          mkdir -p "$RUNNER_TEMP/measure"
          nohup bash -c 'while true; do free -m | awk "/^Mem:/ { print \$3 }"; sleep 5; done' \
            > "$RUNNER_TEMP/measure/memory" 2>/dev/null &
          df -h / | tail -1
          nproc; free -m
      # The toolchain the change pins, k3d's among them, from main's cache (toolchain-cache.yml): saved on main alone,
      # where this never runs, so no run here saves one.
      - uses: jdx/mise-action@b44d12e7d0d8ee7461bb893e1b1993500433185b # v5.2.7
        with:
          version: 2026.10.17
          cache_save: ${{ github.ref == 'refs/heads/main' }}
          install_args: node pnpm kubectl k3d helm kustomize cosign step yq
      - run: pnpm install --frozen-lockfile
      # `make up`, at the change's commit, with a stand-in for each key it would take from the Keychain: made here, of
      # the shape the cluster needs, and opening nothing. The App's is a key GitHub has never seen; the others say so.
      - name: Make the cluster
        env:
          REVISION: ${{ github.sha }}
        run: |
          GITHUB_APP_PRIVATE_KEY=$(openssl genpkey -algorithm RSA -pkeyopt rsa_keygen_bits:2048 2>/dev/null)
          export GITHUB_APP_PRIVATE_KEY
          export TYPESAFE_API_KEY=stand-in-not-a-key ANTHROPIC_API_KEY=stand-in-not-a-key
          export PUSHOVER_APP_TOKEN=stand-in-not-a-token PUSHOVER_USER_KEY=stand-in-not-a-key
          time make up REVISION="$REVISION" SYNC_TIMEOUT=15m TIMEOUT=900
      - name: Every Application Synced and Healthy
        run: |
          kubectl --context k3d-software-factory -n argocd get applications \
            -o custom-columns='APPLICATION:.metadata.name,SYNC:.status.sync.status,HEALTH:.status.health.status,REVISION:.status.sync.revision'
          unready=$(kubectl --context k3d-software-factory -n argocd get applications -o json |
            jq -r '.items[] | select(.status.sync.status != "Synced" or .status.health.status != "Healthy") | .metadata.name')
          if [ -n "$unready" ]; then echo "::error::Not Synced and Healthy: $(echo $unready)"; exit 1; fi
      - name: Every image policy enforcing, and admission ready
        run: |
          for policy in factory-images website-images scoreboard-images flagd-images; do
            actions=$(kubectl --context k3d-software-factory get imagevalidatingpolicy "$policy" -o jsonpath='{.spec.validationActions}')
            echo "$policy: $actions"
            [ "$actions" = '["Deny"]' ] || { echo "::error::$policy does not enforce: $actions"; exit 1; }
          done
          make admission-ready
      - name: Take the refusal records
        if: ${{ !cancelled() }}
        run: |
          mkdir -p "$RUNNER_TEMP/records"
          failed=0
          for script in admission flags mark rollout route share-key; do
            REFUSALS_OUT="$RUNNER_TEMP/records/$script-refusals.json" "scripts/$script-refusals.sh" || { echo "::error::$script-refusals failed"; failed=1; }
          done
          REFUSALS_OUT="$RUNNER_TEMP/records/flag-stages-refusals.json" node scripts/flag-stages-refusals.ts || { echo "::error::flag-stages-refusals failed"; failed=1; }
          exit "$failed"
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        if: ${{ !cancelled() }}
        with:
          name: refusal-records
          path: ${{ runner.temp }}/records
          if-no-files-found: warn
      - name: What the cluster shows
        if: ${{ always() }}
        run: |
          echo "Peak memory in use: $(sort -n "$RUNNER_TEMP/measure/memory" | tail -1) MiB"
          df -h / | tail -1
          docker system df || true
          kubectl --context k3d-software-factory -n argocd get applications \
            -o custom-columns='APPLICATION:.metadata.name,SYNC:.status.sync.status,HEALTH:.status.health.status,PHASE:.status.operationState.phase,MESSAGE:.status.operationState.message' || true
          kubectl --context k3d-software-factory -n argocd get applications -o json | jq -r '.items[] | .metadata.name as $app |
            (.status.conditions[]? | "\($app) condition \(.type): \(.message)"),
            (.status.resources[]? | select(.status != "Synced" or (.health.status // "Healthy") != "Healthy") |
              "\($app) \(.kind)/\(.namespace // "")/\(.name) \(.status) \(.health.status // "") \(.health.message // "")")' || true
          kubectl --context k3d-software-factory get pods -A -o wide || true
          kubectl --context k3d-software-factory get events -A --field-selector type=Warning --sort-by=.lastTimestamp | tail -40 || true
