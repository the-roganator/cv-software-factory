# Pull requests are squash-merged, so the title becomes the commit on main: it must be a Conventional Commit.
#
# Shared: cv-worlds-worst-website calls this workflow at a pinned commit, so both repositories keep one rule,
# and the rule stays out of reach of anything that can write to the app's repository.
name: pr title

on:
  pull_request:
    types: [opened, edited, reopened, synchronize]
  # The merge queue's commit needs the required checks too: the title is read again from the pull request it was made
  # for, which the queue names in its branch.
  merge_group:
    types: [checks_requested]
  workflow_call:

permissions:
  contents: read

jobs:
  title:
    name: pull request title
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    permissions:
      contents: read
      pull-requests: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          # This workflow's own repository and commit, which is not the caller's when it is called from elsewhere.
          repository: ${{ job.workflow_repository }}
          ref: ${{ job.workflow_sha }}
          sparse-checkout: |
            mise.toml
            mise.lock
            scripts/commit-msg.ts
          sparse-checkout-cone-mode: false
          persist-credentials: false
      - uses: jdx/mise-action@b44d12e7d0d8ee7461bb893e1b1993500433185b # v5.2.7
        with:
          version: 2026.10.17
          cache_save: ${{ github.ref == 'refs/heads/main' }}
          install_args: node
      # Dependabot writes its own titles, and a long image tag takes them past the length (commit-msg.ts); the rest of
      # the rule still holds for them. It goes by who opened the pull request, so a title edited by hand on one of
      # Dependabot's is let run long too.
      - name: Check the title
        env:
          TITLE: ${{ github.event.pull_request.title }}
          AUTHOR: ${{ github.event.pull_request.user.login }}
          QUEUE_BRANCH: ${{ github.event.merge_group.head_ref }}
          GH_TOKEN: ${{ github.token }}
        run: |
          if [ "$GITHUB_EVENT_NAME" = merge_group ]; then
            [[ "$QUEUE_BRANCH" =~ ^(refs/heads/)?gh-readonly-queue/main/pr-([0-9]+)-[0-9a-f]{7,40}$ ]] \
              || { echo "::error::$QUEUE_BRANCH is not a merge queue branch of main"; exit 1; }
            pr=$(gh api "repos/$GITHUB_REPOSITORY/pulls/${BASH_REMATCH[2]}")
            TITLE=$(jq -r .title <<< "$pr")
            AUTHOR=$(jq -r '.user.login // ""' <<< "$pr")
          fi
          any_length=()
          if [ "$AUTHOR" = 'dependabot[bot]' ]; then any_length=(--any-length); fi
          node scripts/commit-msg.ts --title "$TITLE" "${any_length[@]}"
