# Asks main's review gate (review.yml) to judge a pull request, into any branch: when it opens, its head moves, it is
# reopened, made ready or edited (its base changed, as when the pull request below it in a stack merges), when a label
# is removed from it (a risk label removed by anyone but Martin holds it), when someone reviews it, and when the merge
# queue tests it, whose commit needs the `review` check too. A stacked pull request, into the branch of the one below
# it, is held to main's required checks, `review` among them, so it asks too.
#
# It runs as the pull request or the queue's commit has it, so it holds no token that can write and no secret, and does
# nothing but finish: its run is what starts review.yml, from main, through `workflow_run`. A copy changed by a pull
# request, or another workflow given its name, can only make the honest gate look again, or leave the check missing,
# which holds the pull request as a failing check does.
name: review requested
# A run on the merge queue's commit is named by the queue's branch, which names its pull request; on a pull request,
# an empty name leaves GitHub's own, the pull request's title.
run-name: ${{ github.event_name == 'merge_group' && format('queue · {0}', github.event.merge_group.head_ref) || '' }}

on:
  pull_request:
    types: [opened, reopened, synchronize, ready_for_review, edited, unlabeled]
  pull_request_review:
    types: [submitted, dismissed]
  merge_group:
    types: [checks_requested]

permissions: {}

jobs:
  requested:
    name: review requested
    runs-on: ubuntu-24.04
    timeout-minutes: 2
    steps:
      - run: echo "review.yml on main judges this $GITHUB_EVENT_NAME next."
