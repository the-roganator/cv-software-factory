# The review gate (ADR 0014), which is the approval-routing check (spec 4.3): posts the `review` check, as the review
# App, on a pull request's head and on the merge queue's commit for it (scripts/review-gate.ts). It passes, by the
# first rule that holds (scripts/review-routing.ts): when Martin opened the pull request, or approved its head after the
# last push; an exact pin of the factory's App's, every changed line a digest of an image build.yml signed on main,
# from a commit that descends from the one it replaces; here, the App's pin move, one pin of the vulnerability scan's
# list moved forward, proved from its two commits (below); and, in the app's repository alone, the App's pull request with
# no risk tags, which the gate works out from the diff and test integrity's run, or, while the caller's AUTONOMY
# variable is `lights-out`, one whose tags are not a release, an improvement or a path CODEOWNERS on main gives Martin.
# Anything else is held for Martin. Its summary names the rule and the tags in a block the line reads
# (policy/review-verdict.ts). This applies whatever the pull request's base: a stacked one, into the branch below it, is
# held to main's required checks. A check on a commit is every open pull request's whose head it is, so the head is
# judged on all of them, and passes only when each does, whichever pull request asked. A pull request it finds open
# always gets a verdict. The queue's commit is judged on the pull request its branch names, down to main: a queued
# stack has an entry for each pull request, with a branch of the ordinary name, built on the entry below it, so the
# commit for one into another branch carries the changes below it, and is judged on it and every pull request below
# it, each afresh at its own head, passing only when each does. A merge queue branch it cannot read, or a stack it
# cannot follow down to main, fails the queue's commit, saying why. The ruleset requires the check from the review App
# alone, so no workflow, this one's own job included, can stand in for it.
#
# AUTONOMY is the caller's repository variable, `vars.AUTONOMY`: GitHub gives a called workflow its caller's variables,
# and only an admin of that repository (Martin) can set one; neither the factory's App nor any worker's credential may
# write variables. It is read here, in main's copy, never from an input, so neither a pull request nor the caller's
# own file can say Lights-out. The gate heeds it in the app's repository alone: in this one, the App's pull requests
# pass only as exact pins, or as pin moves.
#
# A pin move (scripts/pin-move.ts, ADR 0019) is one pin of the vulnerability scan's list moved forward by the App here,
# proved from its two commits: the list at each, the registries, the charts' renderings, the refusal records' hashes,
# Trivy on the image before and after, and the checks that ran it, each counted only from the workflow that has its
# job: platform.yml's cluster, made from the change, for a chart, a value or a third-party image in deploy/. Working that
# out reads the pull request's head, as data, which the job holding the App's key never does: the `pin move` job below does it, with no secret and read-only
# permissions, from main's whole checkout and its locked dependencies, and hands the gate one answer for each pull
# request it would judge, `<number>@<head>`, which the gate takes only for a pull request of the App's here that is no
# exact pin. A missing or unreadable answer holds it. The gate runs again when check.yml or platform.yml finishes, as a
# pin move waits for the job that runs what it pins.
#
# Only main's copy runs with the App's key. `workflow_run` runs the workflow as main has it, with GITHUB_REF main, and
# the key is in the `review` environment, which only main may use: a run on any other ref, a pull request's merge ref
# included, is refused it. It reads the pull request's metadata through the API and never checks out, builds or runs
# its code: the diff, the files an exact pin changes and CODEOWNERS come through the API, the images' signatures from
# GHCR through cosign. The pin move job, which holds no secret, fetches the pull request's two commits as data, and
# runs none of them. A pull request opened, pushed to, edited or unlabelled, and a review each run
# review-requested.yml, which runs on `pull_request` or `pull_request_review` as the change has it and holds nothing;
# its run starts this one, here, from main. The merge queue's commit is asked for by check.yml's run there, which runs
# on every entry and starts this one too (scripts/review-gate.ts reads the queue's branch whichever run it follows).
# Nothing here runs on `pull_request_target`, which GitHub's default event policy blocks in public repositories.
#
# The review App is the-roganator's, App ID 5470762, installed on every repository there. Until its key is in the
# `review` environment, as the secret REVIEW_APP_PRIVATE_KEY, the gate says its verdict and posts nothing.
#
# Shared: cv-worlds-worst-website calls this workflow at a pinned commit from its own review.yml, with a `review`
# environment of its own, so both repositories keep one rule. A caller pinned here does as this repository does: its
# review-requested.yml runs on `pull_request` and `pull_request_review`, and on `merge_group` unless a workflow its
# review.yml follows runs on every queue entry, as check.yml does here, and holds nothing, and its review.yml runs on
# `workflow_run` after it, with `workflow_call` to this file. This copy judges
# only a `workflow_run`, so a caller moves its pin and its triggers in the same change: pinned here and still started by
# `pull_request_target`, it would judge nothing. The app is such a caller: its pin carries the gate's judging of a
# stacked pull request and of a queued stack down to `main`, and its review-requested.yml has no base filter, so its
# stacks are judged as this repository's are. A caller passes REVIEW_APP_PRIVATE_KEY by name, or with
# `secrets: inherit`: GitHub's docs say a called job with `environment:` uses the caller's environment of that name, but
# resolves a secret to empty unless the caller passes it, and a secret held only in the environment may be passed by
# name. Unpassed, the gate says its verdict and posts nothing, as before the key exists. A caller grants the job
# `checks: read` too, for test integrity's run, and `actions: read`, which the pin move job asks for even where it does
# not run, as GitHub refuses a called job more than its caller grants; and it lists its gates' workflow beside review
# requested in its `workflow_run`, so the gate judges again when they finish: low-risk waits for test integrity's run at
# the head.
#
# When the check is missing, the pull request waits, as it does for a failing one: the queue takes it only once every
# required check has passed. That is how each of these ends:
#
# - A review by Copilot that leaves comments, which GitHub treats as an outside contributor's: its run of
#   review-requested.yml is held for a maintainer's approval, and when its pull request closes, the run that one starts
#   here. GitHub holds them before it reads any job, so no condition here can stop them. Only Martin's reviews count,
#   so neither has anything to judge, and nothing waits on them; a re-run keeps Copilot as the actor, so its run here is
#   held in turn. copilot-held-runs.yml deletes both every half hour, so neither leaves a red cross for long.
# - A pull request from an outside contributor's fork: its runs of review-requested.yml are held for approval, and
#   the run each starts here may be held too, as Copilot's is. It has no `review` check until Martin approves them, and
#   his approval of the pull request reaches the gate once he approves that review's runs too, or re-runs this
#   workflow's last run for the pull request, which reads his reviews afresh.
# - Dependabot's: GitHub gives a run Dependabot starts no Actions secrets, and its docs disagree on whether a
#   `workflow_run` after one counts as Dependabot's. If it does, the gate says its verdict on Dependabot's opening and
#   pushes and posts nothing. Its pull requests wait for Martin's approval either way, and his review's run is his, so
#   the check posts then.
# - A pull request with a merge conflict: GitHub runs no `pull_request` workflow on it until the conflict is resolved,
#   which is a push, and that run asks the gate.
name: review
# Named by the run that asked: its title (a pull request's, or the queue's branch) and its workflow. A caller's run is
# named by the caller.
run-name: ${{ format('review · {0} · after {1}', github.event.workflow_run.display_title, github.event.workflow_run.name) }}

on:
  workflow_run:
    # check.yml and platform.yml too, so a pin move held only because the job that runs its pin had not finished is
    # judged again. Only the factory's App opens a pin move, so a platform run of anyone else's asks for nothing.
    workflows: [review requested, check, platform]
    types: [completed]
  workflow_call:
    secrets:
      REVIEW_APP_PRIVATE_KEY:
        description: The review App's key, from the caller's `review` environment.
        required: false

permissions: {}

# One verdict at a time for a branch, each read afresh, so an older one is never posted after a newer one. By the
# branch of the run that asked, which every run names, a fork's included; the merge queue's runs each have a branch of
# their own. A deleted fork names no repository, and its run, which then finds no pull request to judge, goes by its own
# id, so none shares a group with another branch's. A run GitHub leaves `waiting` with nothing to approve, and refuses
# to cancel, holds its group for 30 days, and every run after it in that group never starts: the number in the name
# retires the groups such a run holds, and goes up when one holds a group again.
concurrency:
  group: >-
    review-2-${{ github.event.workflow_run.head_repository.full_name || format('gone-{0}', github.run_id) }}:${{
    github.event.workflow_run.head_branch }}

jobs:
  # The pin moves the gate would judge, worked out with no secret: main's code on the pull request's two commits.
  # Nothing here can post a check; its one output is the answers.
  pin-move:
    name: pin move
    # The app's line moves its own pins: its pull requests are never pin moves.
    if: >-
      ${{ github.repository != 'the-roganator/cv-worlds-worst-website' && (github.event.workflow_run.name != 'platform' ||
      github.event.workflow_run.actor.login == 'mrogan-software-factory[bot]') }}
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    permissions:
      contents: read
      pull-requests: read
      checks: read
      # To read which workflow made each check run at the head: a job of the same name elsewhere proves nothing.
      actions: read
    outputs:
      answers: ${{ steps.moves.outputs.answers }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          repository: ${{ job.workflow_repository }}
          ref: ${{ job.workflow_sha }}
          persist-credentials: false
      - uses: jdx/mise-action@b44d12e7d0d8ee7461bb893e1b1993500433185b # v5.2.7
        with:
          version: 2026.10.17
          # Its own set of tools, so its own cache key, which toolchain-cache.yml warms on main: never the gate's.
          cache_save: ${{ github.ref == 'refs/heads/main' }}
          # kustomize and yq for the list, helm for the charts, pnpm for policy-hash.ts's one dependency; Trivy runs in
          # its pinned image through Docker.
          install_args: node pnpm kustomize yq helm
      - run: pnpm install --frozen-lockfile --ignore-scripts
      - id: moves
        name: Work out the pin moves
        env:
          GH_TOKEN: ${{ github.token }}
          AUTONOMY: ${{ vars.AUTONOMY }}
        run: node scripts/pin-moves.ts --pin-moves

  review:
    name: review gate
    needs: pin-move
    # Whatever the pin move job did: the gate always gives a verdict, and holds a pin move it has no answer for. A
    # platform run judges again only for the App, whose pin moves alone wait for it.
    if: >-
      ${{ !cancelled() && (github.event.workflow_run.name != 'platform' ||
      github.event.workflow_run.actor.login == 'mrogan-software-factory[bot]') }}
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    environment: review
    permissions:
      contents: read
      pull-requests: read
      checks: read
    env:
      # Whether the App's key is here, from the environment or a caller: a step's condition cannot read a secret, only
      # this.
      HAS_KEY: ${{ secrets.REVIEW_APP_PRIVATE_KEY != '' }}
    steps:
      # This workflow's own repository and commit, main's, which is not the caller's when it is called from elsewhere.
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          repository: ${{ job.workflow_repository }}
          ref: ${{ job.workflow_sha }}
          sparse-checkout: |
            mise.toml
            mise.lock
            scripts/review-gate.ts
            scripts/review-routing.ts
            policy/review-verdict.ts
          sparse-checkout-cone-mode: false
          persist-credentials: false
      - uses: jdx/mise-action@b44d12e7d0d8ee7461bb893e1b1993500433185b # v5.2.7
        with:
          version: 2026.10.17
          cache_save: ${{ github.ref == 'refs/heads/main' }}
          # cosign checks an exact pin's signatures, as scripts/admission-ready.sh does.
          install_args: node cosign
      # A token for checks alone: with it, the gate can post a check run and do nothing else.
      - id: app
        if: env.HAS_KEY == 'true'
        uses: actions/create-github-app-token@64ab729a6294000f5aa4a4bc0b73d1f32bc45510 # v3.3.0
        with:
          # The review App's Client ID, which is not a secret.
          client-id: Iv23liFNqAvApddT27zU
          private-key: ${{ secrets.REVIEW_APP_PRIVATE_KEY }}
          permission-checks: write
      - name: Judge the pull request, and post the check
        env:
          GH_TOKEN: ${{ github.token }}
          CHECKS_TOKEN: ${{ steps.app.outputs.token }}
          AUTONOMY: ${{ vars.AUTONOMY }}
          PIN_MOVES: ${{ needs.pin-move.outputs.answers }}
        run: node scripts/review-gate.ts
