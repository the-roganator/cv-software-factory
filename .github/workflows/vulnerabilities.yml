# The daily scan (docs/COMPONENTS/SECURITY-SCANNING.md): every item on the scanned repository's list
# (apps/factory/src/vulnerabilities/inventory.ts) read with Trivy against the day's advisories, each finding an alert in
# that repository's code scanning, category `vulnerabilities`, at the line that pins it.
#
# Shared: cv-worlds-worst-website calls this workflow at a pinned commit and grants `contents: read`, `packages: read`
# and `security-events: write`, and its results reach its own code scanning, since the upload names the calling
# repository. The scripts and Trivy's pin come from this repository at the workflow's own commit; the scanned
# repository's checkout is data, and nothing in it runs.
#
# - coverage: proves Trivy reads every package `pnpm list` gives of each lockfile. Its only output is whether it passed.
# - scan: needs coverage. A run that cannot read an item, or whose advisory database was built more than a day ago,
#   fails and uploads nothing, so no alert closes because its item went unread. Until task 30 the run fails only on
#   what it could not read.
# - scan (proving): on a pull request that changes the scan itself, the same scan of the base's checkout, with no
#   permission to upload: it fails as the real one would, on an unreadable item, a stale database, or the proof image
#   not showing CVE-2026-111497, and its log carries the counts. Every job that writes refuses any event but a push to
#   the default branch, the schedule or a run by hand there; this one writes nothing, and runs on a pull request alone.
name: vulnerabilities

on:
  schedule:
    - cron: '17 4 * * *'
  push:
    branches: [main]
  workflow_dispatch:
  workflow_call:
  pull_request:
    paths:
      - .github/workflows/vulnerabilities.yml
      - apps/factory/src/vulnerabilities/**
      - .github/images/trivy/**

permissions: {}

jobs:
  coverage:
    name: coverage
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    permissions:
      contents: read
    steps:
      # Writes nothing: runs where the scan does, and on a pull request for the proving run.
      - name: Refuse a privileged context
        env:
          DEFAULT_BRANCH: ${{ github.event.repository.default_branch }}
        run: |
          case "$GITHUB_EVENT_NAME" in
            schedule | pull_request) ;;
            push | workflow_dispatch)
              if [ -z "$DEFAULT_BRANCH" ] || [ "$GITHUB_REF" != "refs/heads/$DEFAULT_BRANCH" ]; then
                echo "::error::The scan runs on $GITHUB_EVENT_NAME only for the default branch, not $GITHUB_REF."
                exit 1
              fi
              ;;
            *)
              echo "::error::The scan runs only on a push to the default branch, the schedule or a run by hand, not $GITHUB_EVENT_NAME."
              exit 1
              ;;
          esac
      # The scanned repository, as data: the base of a proving run's pull request.
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ github.event.pull_request.base.sha || github.sha }}
          path: scanned
          persist-credentials: false
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          repository: ${{ job.workflow_repository }}
          ref: ${{ job.workflow_sha }}
          path: factory
          sparse-checkout: |
            mise.toml
            mise.lock
            apps/factory/src/vulnerabilities/
            .github/images/trivy/Dockerfile
          sparse-checkout-cone-mode: false
          persist-credentials: false
      - uses: jdx/mise-action@f5be966e4a917d54244728e6a5fdcd1d93a35e6c # v5.2.6
        with:
          version: 2026.10.17
          cache_save: ${{ github.ref == 'refs/heads/main' }}
          working_directory: factory
          install_args: node
      # The pnpm the scanned repository's mise pins, read as data, installed by this repository's mise.
      - name: Compare pnpm's list with Trivy's SBOM
        run: |
          version=$(node factory/apps/factory/src/vulnerabilities/coverage.ts --pnpm-version scanned)
          cd factory
          mise exec "pnpm@$version" -- node "$GITHUB_WORKSPACE/factory/apps/factory/src/vulnerabilities/coverage.ts" \
            "$GITHUB_WORKSPACE/scanned" --trivy-pin "$GITHUB_WORKSPACE/factory/.github/images/trivy/Dockerfile" \
            --out "$RUNNER_TEMP"

  scan:
    name: scan
    needs: coverage
    if: ${{ github.event_name != 'pull_request' }}
    runs-on: ubuntu-24.04
    timeout-minutes: 120
    permissions:
      contents: read
      packages: read # the advisory database and the images in GHCR, with the job's token
      security-events: write # upload the results to code scanning
    steps:
      - name: Refuse a privileged context
        env:
          DEFAULT_BRANCH: ${{ github.event.repository.default_branch }}
        run: |
          case "$GITHUB_EVENT_NAME" in
            schedule) ;;
            push | workflow_dispatch)
              if [ -z "$DEFAULT_BRANCH" ] || [ "$GITHUB_REF" != "refs/heads/$DEFAULT_BRANCH" ]; then
                echo "::error::The scan runs on $GITHUB_EVENT_NAME only for the default branch, not $GITHUB_REF."
                exit 1
              fi
              ;;
            *)
              echo "::error::The scan runs only on a push to the default branch, the schedule or a run by hand, not $GITHUB_EVENT_NAME."
              exit 1
              ;;
          esac
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          path: scanned
          persist-credentials: false
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          repository: ${{ job.workflow_repository }}
          ref: ${{ job.workflow_sha }}
          path: factory
          sparse-checkout: |
            mise.toml
            mise.lock
            apps/factory/src/vulnerabilities/
            .github/images/trivy/Dockerfile
          sparse-checkout-cone-mode: false
          persist-credentials: false
      # kustomize and yq for the list, helm to render its charts, cosign to verify the SBOMs of ours: each at the
      # version this repository's mise.lock holds.
      - uses: jdx/mise-action@f5be966e4a917d54244728e6a5fdcd1d93a35e6c # v5.2.6
        with:
          version: 2026.10.17
          cache_save: ${{ github.ref == 'refs/heads/main' }}
          working_directory: factory
          install_args: node kustomize helm yq cosign
      # GHCR with the job's token, read-only, for Trivy, its database and cosign: any other registry anonymously.
      - name: Sign in to GHCR
        env:
          TOKEN: ${{ github.token }}
        run: docker login ghcr.io --username "$GITHUB_ACTOR" --password-stdin <<< "$TOKEN"
      - name: Scan
        id: scan
        run: |
          node factory/apps/factory/src/vulnerabilities/scan.ts scanned \
            --trivy-pin factory/.github/images/trivy/Dockerfile --out "$RUNNER_TEMP/scan" --upload
      # The scan writes the file only when every item was read and it is within code scanning's limits.
      - name: Refuse to upload from anything but the default branch's push, the schedule or a run by hand
        if: ${{ steps.scan.outputs.sarif == 'true' }}
        env:
          DEFAULT_BRANCH: ${{ github.event.repository.default_branch }}
        run: |
          case "$GITHUB_EVENT_NAME" in
            schedule) ;;
            push | workflow_dispatch) [ -n "$DEFAULT_BRANCH" ] && [ "$GITHUB_REF" = "refs/heads/$DEFAULT_BRANCH" ] || exit 1 ;;
            *) exit 1 ;;
          esac
      - uses: github/codeql-action/upload-sarif@33d7b85da1a04171e211befe2c739303b9a4c066 # v4.39.3
        if: ${{ steps.scan.outputs.sarif == 'true' && github.event_name != 'pull_request' }}
        with:
          sarif_file: ${{ runner.temp }}/scan/vulnerabilities.sarif
          category: vulnerabilities
          checkout_path: ${{ github.workspace }}/scanned

  # The same scan, of the pull request's base, with no permission to write anything: a pull request proves a change to
  # the scan by its own run, and nothing it does reaches code scanning.
  prove:
    name: scan (proving)
    needs: coverage
    if: ${{ github.event_name == 'pull_request' }}
    runs-on: ubuntu-24.04
    timeout-minutes: 120
    permissions:
      contents: read
      packages: read # the advisory database and the images in GHCR, with the job's token
    steps:
      - name: Refuse a privileged context
        run: |
          if [ "$GITHUB_EVENT_NAME" != pull_request ]; then
            echo "::error::The proving run runs only on a pull request, not $GITHUB_EVENT_NAME."
            exit 1
          fi
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ github.event.pull_request.base.sha }}
          path: scanned
          persist-credentials: false
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          repository: ${{ job.workflow_repository }}
          ref: ${{ job.workflow_sha }}
          path: factory
          sparse-checkout: |
            mise.toml
            mise.lock
            apps/factory/src/vulnerabilities/
            .github/images/trivy/Dockerfile
          sparse-checkout-cone-mode: false
          persist-credentials: false
      - uses: jdx/mise-action@f5be966e4a917d54244728e6a5fdcd1d93a35e6c # v5.2.6
        with:
          version: 2026.10.17
          cache_save: ${{ github.ref == 'refs/heads/main' }}
          working_directory: factory
          install_args: node kustomize helm yq cosign
      - name: Sign in to GHCR
        env:
          TOKEN: ${{ github.token }}
        run: docker login ghcr.io --username "$GITHUB_ACTOR" --password-stdin <<< "$TOKEN"
      - name: Scan, uploading nothing
        run: |
          node factory/apps/factory/src/vulnerabilities/scan.ts scanned \
            --trivy-pin factory/.github/images/trivy/Dockerfile --out "$RUNNER_TEMP/scan"
