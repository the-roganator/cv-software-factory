# The daily scan (docs/COMPONENTS/SECURITY-SCANNING.md), and the dependency graph
# (docs/COMPONENTS/SECURITY-SCANNING.md#the-dependency-graph), both read from the scanned repository's list.
#
# The scan: every item on the scanned repository's list
# (apps/factory/src/vulnerabilities/inventory.ts) read with Trivy against the day's advisories, each finding an alert in
# that repository's code scanning, at the line that pins it, in one of the categories `vulnerabilities/01` to
# `vulnerabilities/20`: the file has a run for each, no run over the 5,000 results code scanning keeps of one.
#
# Shared: cv-worlds-worst-website calls this workflow at a pinned commit, grants `actions: read`, `contents: write`,
# `packages: read` and `security-events: write`, and passes SCAN_STATE_KEY by name; each job takes only what it names
# below of that. Its results reach its own code scanning and its snapshot its own graph, since the upload and the
# submission name the calling repository. The scripts (the lockfile gate's reading of a lockfile
# among them, which the scan shares) and Trivy's and Syft's pins come from this repository at the workflow's own commit, and the
# exceptions (policy/vulnerabilities.ts) from its main alone; the scanned repository's checkout is data, and nothing in
# it runs.
#
# - coverage: proves Trivy reads every package `pnpm list` gives of each lockfile. Its only output is whether it passed.
# - scan: needs coverage. A run that cannot read an item, or whose advisory database was built more than a day ago,
#   fails and uploads nothing, so no alert closes because its item went unread. Before the upload, deadlines.ts finds
#   what fixes each finding and since when, reading the state the last run kept for each finding's days (state.ts, ADR
#   0021: the artifact `state` of the newest earlier run on the default branch, sealed with the key in the environment
#   `scan-state`, which only main may use), or the alerts where there is none it can open, ends each result's message
#   with its fix (`Fixed by <target>, first seen <day>.`), judges each deadline and groups the results into moves:
#   their table is in the log and the step summary, and `moves.json`, the artifact `moves`, holds the same. It seals
#   the state the next run reads, uploaded before the results, so every upload has its state. A source
#   it cannot read fails the run before the upload, so no message loses its day. After the upload it holds its
#   categories' alerts to policy/vulnerabilities.ts, read from this repository's main alone: each excepted result's
#   alert dismissed as won't fix, and any dismissed with no exception in force reopened (alerts.ts). Then the run
#   fails on a new High or Critical with a fix, one due within a day, or one past its deadline, its last lines naming
#   the moves that hold them. One scan at a time uploads, so no two uploads' alerts interleave.
# - pins: needs scan. The moves no pin's line writes (a lockfile's package, what mise pins, an image that brings another
#   pin with it), made by the pin step on the commit the scan read and sealed with the scan's key, the artifact `pins`
#   (scripts/pins.ts): here for the GitHub worker's pin watch to commit, in the app for its line's pin step to make
#   again with the same time and the same registries' answers. It commits nothing; the review gate makes them again on
#   main from what it sealed.
# - scan proof: on a pull request that changes the scan or the graph, the same scan of the base's checkout, with no
#   permission to upload: it fails as the real one would, on an unreadable item, a stale database, or the proof image
#   not showing CVE-2026-111497, and its log carries the counts, the deadlines' and the moves' too, read against the
#   repository's alerts, as a scan with no state reads them (it holds no key), and failing on none of them; its `moves.json` is uploaded as the artifact `moves`. Every job
#   that writes refuses any event but a push to the default branch, the schedule or a run by hand there; this one writes
#   nothing, and runs on a pull request alone, from a branch of this repository: its first step refuses a fork's, whose
#   token would read the alerts, which are not public. A fork supplies its own copy of this file, so the step binds a
#   fork that keeps it; the repository's approval of fork runs, which no fork can change, binds one that does not.
# - graph: on a push to the default branch alone, with `contents: write` and nothing else: every package each lockfile
#   on the list resolves, indirect ones included, submitted to GitHub's dependency submission API, so the graph and
#   Dependabot's alerts hold the whole lockfile and not only what a manifest names. Each lockfile is copied alone into
#   an empty directory, which Syft's image reads, read-only and with no network (apps/factory/src/vulnerabilities/graph.ts).
#   Each snapshot names the commit, the ref and the graph's correlator, so it replaces the one before it.
# - graph proof: on a pull request that changes the scan or the graph, with `contents: read` alone. It makes the same
#   snapshot of the base's checkout and submits nothing, then installs each lockfile as coverage does, and fails if the
#   snapshot lacks a package `pnpm list --depth Infinity` names, calls one direct or indirect where pnpm lists it the
#   other way, or names no indirect package. Its log carries the counts.
#
# Neither graph job names the scan's key or its environment, or shares its concurrency group.
#
# Kept between runs, by the default branch's runs alone (a pull request's restores): Trivy's analysis of each layer,
# keyed by Trivy's pin, and the day's lookups of registries and releases (memo.ts). Neither is what a verdict depends
# on: the advisory databases are pulled afresh every run, and the exceptions are read every run. The state is no cache:
# it is an artifact of its run, sealed, which only a run on the default branch reads or writes.
name: vulnerabilities

on:
  schedule:
    - cron: '17 4 * * *'
  push:
    branches: [main]
  workflow_dispatch:
  # A caller passes SCAN_STATE_KEY by name, from its own `scan-state` environment: the scan's job names that
  # environment, the caller's, but GitHub resolves a called job's secret to empty unless the caller passes it, even one
  # held in the environment alone (review.yml's key is passed the same way). Unpassed, the scan fails before it reads
  # anything, as with no key.
  workflow_call:
    secrets:
      SCAN_STATE_KEY:
        description: The key the scan's state is sealed with, from the caller's `scan-state` environment.
        required: false
  pull_request:
    paths:
      - .github/workflows/vulnerabilities.yml
      - apps/factory/src/repositories.ts
      - apps/factory/src/vulnerabilities/**
      - apps/factory/src/gates/**
      - deploy/images/syft/**
      - deploy/images/trivy/**
      - mise.toml
      - mise.lock
      - policy/repositories.ts

permissions: {}

jobs:
  coverage:
    name: coverage
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    permissions:
      contents: read
    outputs:
      # The commit read, which the proving run reads too, so both see the same base whatever merges between them.
      base: ${{ steps.read.outputs.base }}
    steps:
      # Writes nothing: runs where the scan does, and on a pull request for the proving run.
      - name: Refuse a privileged context
        env:
          DEFAULT_BRANCH: ${{ github.event.repository.default_branch }}
        run: |
          case "$GITHUB_EVENT_NAME" in
            schedule | pull_request) ;;
            push | workflow_dispatch)
              if [ -z "$DEFAULT_BRANCH" ] || [ "$GITHUB_REF" != "refs/heads/$DEFAULT_BRANCH" ]; then
                echo "::error::The scan runs on $GITHUB_EVENT_NAME only for the default branch, not $GITHUB_REF."
                exit 1
              fi
              ;;
            *)
              echo "::error::The scan runs only on a push to the default branch, the schedule or a run by hand, not $GITHUB_EVENT_NAME."
              exit 1
              ;;
          esac
      # The scanned repository, as data: for a proving run, its base branch as it is now, not as it was when the pull
      # request was last pushed, which can be several merges behind.
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ github.event.pull_request.base.ref || github.sha }}
          path: scanned
          persist-credentials: false
      - id: read
        run: |
          base=$(git -C scanned rev-parse HEAD)
          echo "The checkout read: $base."
          echo "base=$base" >> "$GITHUB_OUTPUT"
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          repository: ${{ job.workflow_repository }}
          ref: ${{ job.workflow_sha }}
          path: factory
          sparse-checkout: |
            mise.toml
            mise.lock
            apps/factory/src/repositories.ts
            apps/factory/src/vulnerabilities/
            deploy/images/trivy/Dockerfile
            policy/repositories.ts
          sparse-checkout-cone-mode: false
          persist-credentials: false
      - uses: jdx/mise-action@b44d12e7d0d8ee7461bb893e1b1993500433185b # v5.2.7
        with:
          version: 2026.10.17
          cache_save: ${{ github.ref == 'refs/heads/main' }}
          working_directory: factory
          install_args: node
      # The pnpm the scanned repository's mise pins, read as data, installed by this repository's mise.
      - name: Compare pnpm's list with Trivy's SBOM
        env:
          FACTORY_REPOSITORY: ${{ vars.FACTORY_REPOSITORY }}
          APP_REPOSITORY: ${{ vars.APP_REPOSITORY }}
        run: |
          version=$(node factory/apps/factory/src/vulnerabilities/coverage.ts --pnpm-version scanned)
          cd factory
          mise exec "pnpm@$version" -- node "$GITHUB_WORKSPACE/factory/apps/factory/src/vulnerabilities/coverage.ts" \
            "$GITHUB_WORKSPACE/scanned" --trivy-pin "$GITHUB_WORKSPACE/factory/deploy/images/trivy/Dockerfile" \
            --out "$RUNNER_TEMP"

  scan:
    name: scan
    needs: coverage
    if: ${{ github.event_name != 'pull_request' }}
    # One upload at a time, so an alert one closes and the next opens are never two uploads' interleaved (deadlines.ts
    # reads an alert closed within minutes of the next one's making as one upload's split). A run waits; none is
    # cancelled.
    concurrency:
      group: vulnerabilities-scan-${{ github.repository }}
      cancel-in-progress: false
    runs-on: ubuntu-24.04
    timeout-minutes: 120
    # The key the state is sealed with, which only a run on main may use (scripts/github-settings.ts). One step reads
    # it, and nothing of a pull request's runs in this job.
    environment: scan-state
    permissions:
      actions: read # the last run's state, an artifact of that run
      contents: read
      packages: read # the advisory database and the images in GHCR, with the job's token
      security-events: write # upload the results to code scanning
    outputs:
      # Whether it kept the day's moves and its state, which the pins job makes the moves from.
      kept: ${{ steps.kept.outputs.kept }}
    steps:
      - name: Refuse a privileged context
        env:
          DEFAULT_BRANCH: ${{ github.event.repository.default_branch }}
        run: |
          case "$GITHUB_EVENT_NAME" in
            schedule) ;;
            push | workflow_dispatch)
              if [ -z "$DEFAULT_BRANCH" ] || [ "$GITHUB_REF" != "refs/heads/$DEFAULT_BRANCH" ]; then
                echo "::error::The scan runs on $GITHUB_EVENT_NAME only for the default branch, not $GITHUB_REF."
                exit 1
              fi
              ;;
            *)
              echo "::error::The scan runs only on a push to the default branch, the schedule or a run by hand, not $GITHUB_EVENT_NAME."
              exit 1
              ;;
          esac
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          path: scanned
          persist-credentials: false
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          repository: ${{ job.workflow_repository }}
          ref: ${{ job.workflow_sha }}
          path: factory
          sparse-checkout: |
            mise.toml
            mise.lock
            apps/factory/src/repositories.ts
            apps/factory/src/vulnerabilities/
            apps/factory/src/gates/
            deploy/images/trivy/Dockerfile
            policy/repositories.ts
            policy/vulnerabilities.ts
          sparse-checkout-cone-mode: false
          persist-credentials: false
      # The exceptions, from this repository's main alone, whatever commit the caller pins: main's
      # policy/vulnerabilities.ts, which imports nothing, in place of the pinned commit's (the scripts import it).
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          repository: ${{ job.workflow_repository }}
          ref: main
          path: policy-main
          sparse-checkout: policy/vulnerabilities.ts
          sparse-checkout-cone-mode: false
          persist-credentials: false
      - name: Take the exceptions from main
        run: |
          if [ -f policy-main/policy/vulnerabilities.ts ]; then
            mkdir -p factory/policy
            cp policy-main/policy/vulnerabilities.ts factory/policy/vulnerabilities.ts
          else
            echo "::warning::main holds no policy/vulnerabilities.ts yet: the exceptions are this commit's."
          fi
      # kustomize and yq for the list, helm to render its charts, cosign to verify the SBOMs of ours, crane to read the
      # registries' tags and manifests: each at the version this repository's mise.lock holds.
      - uses: jdx/mise-action@b44d12e7d0d8ee7461bb893e1b1993500433185b # v5.2.7
        with:
          version: 2026.10.17
          cache_save: ${{ github.ref == 'refs/heads/main' }}
          working_directory: factory
          install_args: node kustomize helm yq cosign crane
      # What the scan derived, kept between runs, never what its verdicts depend on (the advisory databases, the alerts,
      # the exceptions). Trivy's analysis of each layer (scan.ts --cache), which Trivy keys by the layer's digest and its
      # own analysers: this key names Trivy's pin, so a new Trivy starts afresh, and the day, so the day's first run on
      # the default branch saves what it added, from the month's latest, and each month starts afresh. And the day's
      # lookups of registries and releases (deadlines.ts --memo, memo.ts), which a run by the schedule or by hand asks
      # afresh. Only the default branch's runs save; a pull request's proving run restores and never saves, and a
      # pull request's own entries are never one the default branch reads.
      - name: The day
        id: day
        run: |
          echo "day=$(date -u +%Y-%m-%d)" >> "$GITHUB_OUTPUT"
          echo "month=$(date -u +%Y-%m)" >> "$GITHUB_OUTPUT"
      - id: layers
        uses: actions/cache/restore@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: ${{ runner.temp }}/trivy/fanal
          key: vulnerabilities-layers-${{ hashFiles('factory/deploy/images/trivy/Dockerfile') }}-${{ steps.day.outputs.day }}
          restore-keys: vulnerabilities-layers-${{ hashFiles('factory/deploy/images/trivy/Dockerfile') }}-${{ steps.day.outputs.month }}-
      - id: lookups
        if: ${{ github.event_name == 'push' || github.event_name == 'pull_request' }}
        uses: actions/cache/restore@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: ${{ runner.temp }}/lookups/deadlines.json
          key: vulnerabilities-lookups-${{ steps.day.outputs.day }}
      # GHCR with the job's token, read-only, for Trivy, its database and cosign: any other registry anonymously.
      - name: Sign in to GHCR
        env:
          TOKEN: ${{ github.token }}
        run: docker login ghcr.io --username "$GITHUB_ACTOR" --password-stdin <<< "$TOKEN"
      - name: Scan
        id: scan
        env:
          FACTORY_REPOSITORY: ${{ vars.FACTORY_REPOSITORY }}
          APP_REPOSITORY: ${{ vars.APP_REPOSITORY }}
        run: |
          node factory/apps/factory/src/vulnerabilities/scan.ts scanned \
            --trivy-pin factory/deploy/images/trivy/Dockerfile --out "$RUNNER_TEMP/scan" --upload \
            --repository "$GITHUB_REPOSITORY" --cache "$RUNNER_TEMP/trivy"
      # What fixes each finding and since when, ended into each result's message before the upload, each deadline, and the
      # moves (deadlines.ts, moves.ts). It reads the state the last run kept, with the job's token and the key, for each
      # finding's days (code scanning's alerts, where there is none it can open), and seals the next. It reads npm's registry, Node's release index, k3s's releases, the charts' repositories, the tools'
      # releases, and the newer images on each line with a fixed finding (crane for the tags and the index digests,
      # Trivy on the scan's database). It fails, and nothing is uploaded, on a source it cannot read.
      - name: Deadlines and moves
        if: ${{ steps.scan.outputs.sarif == 'true' }}
        env:
          FACTORY_REPOSITORY: ${{ vars.FACTORY_REPOSITORY }}
          APP_REPOSITORY: ${{ vars.APP_REPOSITORY }}
          GH_TOKEN: ${{ github.token }}
          LOOKUPS_DAY: ${{ steps.day.outputs.day }}
          DEFAULT_BRANCH: ${{ github.event.repository.default_branch }}
          SCAN_STATE_KEY: ${{ secrets.SCAN_STATE_KEY }}
        run: |
          node factory/apps/factory/src/vulnerabilities/deadlines.ts "$RUNNER_TEMP/scan" --checkout scanned \
            --trivy-pin factory/deploy/images/trivy/Dockerfile --write --state "$DEFAULT_BRANCH" \
            --memo "$RUNNER_TEMP/lookups/deadlines.json" --memo-day "$LOOKUPS_DAY"
      # The default branch's runs alone save, each entry once (a day's key is not saved again). Trivy writes its cache as
      # root, in its image: the runner's user is given it to read.
      - name: Give the runner Trivy's analysis to save
        if: ${{ !cancelled() && steps.layers.outputs.cache-hit != 'true' && github.ref == format('refs/heads/{0}', github.event.repository.default_branch) }}
        run: |
          if [ -d "$RUNNER_TEMP/trivy" ]; then sudo chown -R "$(id -u):$(id -g)" "$RUNNER_TEMP/trivy"; fi
      - if: ${{ !cancelled() && steps.layers.outputs.cache-hit != 'true' && github.ref == format('refs/heads/{0}', github.event.repository.default_branch) }}
        uses: actions/cache/save@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: ${{ runner.temp }}/trivy/fanal
          key: ${{ steps.layers.outputs.cache-primary-key }}
      - if: ${{ steps.scan.outputs.sarif == 'true' && steps.lookups.outputs.cache-hit != 'true' && github.ref == format('refs/heads/{0}', github.event.repository.default_branch) }}
        uses: actions/cache/save@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: ${{ runner.temp }}/lookups/deadlines.json
          key: vulnerabilities-lookups-${{ steps.day.outputs.day }}
      # The moves, as the log printed them: what the GitHub worker reads, from the default branch's last finished run.
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        timeout-minutes: 5
        if: ${{ steps.scan.outputs.sarif == 'true' }}
        with:
          name: moves
          path: ${{ runner.temp }}/scan/moves.json
          if-no-files-found: error
      # The state the next run and the GitHub worker read (state.ts), sealed: uploaded before the results, so no upload
      # is without one. Kept as long as GitHub keeps an artifact; a scan that finds none reads the alerts.
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        timeout-minutes: 5
        if: ${{ steps.scan.outputs.sarif == 'true' }}
        with:
          name: state
          path: ${{ runner.temp }}/scan/state.sealed
          if-no-files-found: error
          retention-days: 90
      - id: kept
        if: ${{ steps.scan.outputs.sarif == 'true' }}
        run: echo "kept=true" >> "$GITHUB_OUTPUT"
      # The scan writes the file only when every item was read and it is within code scanning's limits: no run over 5,000
      # results, and no more than 20 runs.
      - name: Refuse to upload from anything but the default branch's push, the schedule or a run by hand
        if: ${{ steps.scan.outputs.sarif == 'true' }}
        env:
          DEFAULT_BRANCH: ${{ github.event.repository.default_branch }}
        run: |
          case "$GITHUB_EVENT_NAME" in
            schedule) ;;
            push | workflow_dispatch) [ -n "$DEFAULT_BRANCH" ] && [ "$GITHUB_REF" = "refs/heads/$DEFAULT_BRANCH" ] || exit 1 ;;
            *) exit 1 ;;
          esac
      - uses: github/codeql-action/upload-sarif@33d7b85da1a04171e211befe2c739303b9a4c066 # v4.39.3
        timeout-minutes: 10
        if: ${{ steps.scan.outputs.sarif == 'true' && github.event_name != 'pull_request' }}
        with:
          # No `category`: each run names its own (`automationDetails.id`), which the action keeps.
          sarif_file: ${{ runner.temp }}/scan/vulnerabilities.sarif
          checkout_path: ${{ github.workspace }}/scanned
          # The alerts are held to the policy once code scanning has processed the upload.
          wait-for-processing: true
      # Each excepted result's alert dismissed, and each of the scan's categories' alerts dismissed with no exception in
      # force reopened (alerts.ts), with the job's token.
      - name: Hold the alerts to the policy
        if: ${{ steps.scan.outputs.sarif == 'true' && github.event_name != 'pull_request' }}
        env:
          GH_TOKEN: ${{ github.token }}
        run: node factory/apps/factory/src/vulnerabilities/alerts.ts "$RUNNER_TEMP/scan/exceptions.json"
      # The verdict judged before the upload, once each new finding's alert exists: fails on a new High or Critical with
      # a fix, one due within a day, or one past its deadline, naming the moves that hold them.
      - name: Deadlines
        if: ${{ steps.scan.outputs.sarif == 'true' && github.event_name != 'pull_request' }}
        env:
          FACTORY_REPOSITORY: ${{ vars.FACTORY_REPOSITORY }}
          APP_REPOSITORY: ${{ vars.APP_REPOSITORY }}
        run: node factory/apps/factory/src/vulnerabilities/deadlines.ts --verdict "$RUNNER_TEMP/scan"

  # The moves no pin's line writes (a lockfile's package, what mise pins, an image that brings another pin with it),
  # made by the pin step on the commit the scan read (scripts/pins.ts, apps/factory/src/github/made.ts): the factory's
  # for the GitHub worker's pin watch to commit, the app's for its line's pin step to make again as of the scan's time
  # and with the digest each tag was found at here. It runs whatever the scan's verdict, once the scan kept its moves and
  # its state, in either repository. It holds the scan's key, to open the state for the packages `moves.json` withholds
  # and to seal what it made, which names them, as the artifact `pins`.
  # The key goes to one step, which reads it and takes it out of the environment before pnpm or mise runs; the scanned
  # checkout is data, and pnpm runs on it with no script, no pnpmfile and no `.npmrc` of its own
  # (apps/runner/src/pins.ts). The review gate makes the same moves again on main.
  pins:
    name: pins
    needs: scan
    if: ${{ !cancelled() && github.event_name != 'pull_request' && needs.scan.outputs.kept == 'true' }}
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    environment: scan-state
    permissions:
      contents: read
    steps:
      - name: Refuse a privileged context
        env:
          DEFAULT_BRANCH: ${{ github.event.repository.default_branch }}
        run: |
          case "$GITHUB_EVENT_NAME" in
            schedule) ;;
            push | workflow_dispatch)
              if [ -z "$DEFAULT_BRANCH" ] || [ "$GITHUB_REF" != "refs/heads/$DEFAULT_BRANCH" ]; then
                echo "::error::The scan runs on $GITHUB_EVENT_NAME only for the default branch, not $GITHUB_REF."
                exit 1
              fi
              ;;
            *)
              echo "::error::The scan runs only on a push to the default branch, the schedule or a run by hand, not $GITHUB_EVENT_NAME."
              exit 1
              ;;
          esac
      # The commit the scan read, as data.
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          path: scanned
          persist-credentials: false
      # This repository's code at the workflow's commit, whole, with its locked dependencies.
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          repository: ${{ job.workflow_repository }}
          ref: ${{ job.workflow_sha }}
          path: factory
          persist-credentials: false
      - uses: jdx/mise-action@b44d12e7d0d8ee7461bb893e1b1993500433185b # v5.2.7
        with:
          version: 2026.10.17
          cache_save: ${{ github.ref == 'refs/heads/main' }}
          working_directory: factory
          install_args: node pnpm
      - run: pnpm install --frozen-lockfile --ignore-scripts
        working-directory: factory
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        timeout-minutes: 5
        with:
          name: moves
          path: ${{ runner.temp }}/moves
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        timeout-minutes: 5
        with:
          name: state
          path: ${{ runner.temp }}/state
      - name: Make the moves
        working-directory: factory
        env:
          FACTORY_REPOSITORY: ${{ vars.FACTORY_REPOSITORY }}
          APP_REPOSITORY: ${{ vars.APP_REPOSITORY }}
          # The job's read-only token, for a tool's releases on GitHub's API (scripts/derive.ts): never pnpm's or mise's.
          GH_TOKEN: ${{ github.token }}
          SCAN_STATE_KEY: ${{ secrets.SCAN_STATE_KEY }}
        run: node scripts/pins.ts "$RUNNER_TEMP/moves/moves.json" "$RUNNER_TEMP/state/state.sealed" "$GITHUB_WORKSPACE/scanned" "$RUNNER_TEMP/pins.sealed"
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        timeout-minutes: 5
        with:
          name: pins
          path: ${{ runner.temp }}/pins.sealed
          if-no-files-found: error
          retention-days: 90

  # The same scan, of the pull request's base, with no permission to write anything: a pull request proves a change to
  # the scan by its own run, and nothing it does reaches code scanning.
  prove:
    name: scan proof
    needs: coverage
    if: ${{ github.event_name == 'pull_request' }}
    runs-on: ubuntu-24.04
    timeout-minutes: 120
    permissions:
      contents: read
      packages: read # the advisory database and the images in GHCR, with the job's token
      security-events: read # when each alert was made, for the deadlines' counts
    steps:
      # A fork's pull request is refused before anything of it is checked out: its token reads this repository's alerts,
      # which are not public, and its scripts would run with it. A change to the scan from a fork is proved from a branch
      # here. A fork that removes this step from its copy is bound only by the repository's approval of fork runs.
      - name: Refuse a privileged context
        env:
          HEAD_REPOSITORY: ${{ github.event.pull_request.head.repo.full_name }}
          REPOSITORY: ${{ github.repository }}
        run: |
          if [ "$GITHUB_EVENT_NAME" != pull_request ]; then
            echo "::error::The proving run runs only on a pull request, not $GITHUB_EVENT_NAME."
            exit 1
          fi
          if [ -z "$HEAD_REPOSITORY" ] || [ "$HEAD_REPOSITORY" != "$REPOSITORY" ]; then
            echo "::error::The proving run reads this repository's alerts, so it runs only for a branch of $REPOSITORY, not one of ${HEAD_REPOSITORY:-an unknown repository}: push the change to a branch here to prove it."
            exit 1
          fi
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ needs.coverage.outputs.base }}
          path: scanned
          persist-credentials: false
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          repository: ${{ job.workflow_repository }}
          ref: ${{ job.workflow_sha }}
          path: factory
          sparse-checkout: |
            mise.toml
            mise.lock
            apps/factory/src/repositories.ts
            apps/factory/src/vulnerabilities/
            apps/factory/src/gates/
            deploy/images/trivy/Dockerfile
            policy/repositories.ts
            policy/vulnerabilities.ts
          sparse-checkout-cone-mode: false
          persist-credentials: false
      # The exceptions, from this repository's main alone, whatever commit the caller pins: main's
      # policy/vulnerabilities.ts, which imports nothing, in place of the pinned commit's (the scripts import it).
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          repository: ${{ job.workflow_repository }}
          ref: main
          path: policy-main
          sparse-checkout: policy/vulnerabilities.ts
          sparse-checkout-cone-mode: false
          persist-credentials: false
      - name: Take the exceptions from main
        run: |
          if [ -f policy-main/policy/vulnerabilities.ts ]; then
            mkdir -p factory/policy
            cp policy-main/policy/vulnerabilities.ts factory/policy/vulnerabilities.ts
          else
            echo "::warning::main holds no policy/vulnerabilities.ts yet: the exceptions are this commit's."
          fi
      - uses: jdx/mise-action@b44d12e7d0d8ee7461bb893e1b1993500433185b # v5.2.7
        with:
          version: 2026.10.17
          cache_save: ${{ github.ref == 'refs/heads/main' }}
          working_directory: factory
          install_args: node kustomize helm yq cosign crane
      # As the scan keeps them: restored, never saved.
      - name: The day
        id: day
        run: |
          echo "day=$(date -u +%Y-%m-%d)" >> "$GITHUB_OUTPUT"
          echo "month=$(date -u +%Y-%m)" >> "$GITHUB_OUTPUT"
      - id: layers
        uses: actions/cache/restore@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: ${{ runner.temp }}/trivy/fanal
          key: vulnerabilities-layers-${{ hashFiles('factory/deploy/images/trivy/Dockerfile') }}-${{ steps.day.outputs.day }}
          restore-keys: vulnerabilities-layers-${{ hashFiles('factory/deploy/images/trivy/Dockerfile') }}-${{ steps.day.outputs.month }}-
      - id: lookups
        uses: actions/cache/restore@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: ${{ runner.temp }}/lookups/deadlines.json
          key: vulnerabilities-lookups-${{ steps.day.outputs.day }}
      - name: Sign in to GHCR
        env:
          TOKEN: ${{ github.token }}
        run: docker login ghcr.io --username "$GITHUB_ACTOR" --password-stdin <<< "$TOKEN"
      - name: Scan, uploading nothing
        env:
          FACTORY_REPOSITORY: ${{ vars.FACTORY_REPOSITORY }}
          APP_REPOSITORY: ${{ vars.APP_REPOSITORY }}
        run: |
          echo "The base read: $(git -C scanned rev-parse HEAD), the tip of ${GITHUB_BASE_REF} when coverage ran."
          node factory/apps/factory/src/vulnerabilities/scan.ts scanned \
            --trivy-pin factory/deploy/images/trivy/Dockerfile --out "$RUNNER_TEMP/scan" \
            --repository "$GITHUB_REPOSITORY" --cache "$RUNNER_TEMP/trivy"
      # The deadlines' counts and the moves against the repository's alerts as they stand, failing on none of them.
      - name: Deadlines and moves, failing on none
        env:
          FACTORY_REPOSITORY: ${{ vars.FACTORY_REPOSITORY }}
          APP_REPOSITORY: ${{ vars.APP_REPOSITORY }}
          GH_TOKEN: ${{ github.token }}
          LOOKUPS_DAY: ${{ steps.day.outputs.day }}
        run: |
          node factory/apps/factory/src/vulnerabilities/deadlines.ts "$RUNNER_TEMP/scan" --checkout scanned \
            --trivy-pin factory/deploy/images/trivy/Dockerfile --prove --memo "$RUNNER_TEMP/lookups/deadlines.json" \
            --memo-day "$LOOKUPS_DAY"
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        timeout-minutes: 5
        with:
          name: moves
          path: ${{ runner.temp }}/scan/moves.json
          if-no-files-found: error

  # The graph: on a push alone. The scan's other events (the schedule, a run by hand) submit nothing new.
  graph:
    name: graph
    if: ${{ github.event_name == 'push' }}
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    # One submission at a time, the newest waiting: GitHub keeps the last snapshot of a correlator it is sent, so an
    # older run finishing last would hold the graph at its commit.
    concurrency:
      group: dependency-graph-${{ github.repository }}
      cancel-in-progress: false
    permissions:
      contents: write # the dependency submission API, with the job's token
    steps:
      - name: Refuse a privileged context
        env:
          DEFAULT_BRANCH: ${{ github.event.repository.default_branch }}
        run: |
          if [ "$GITHUB_EVENT_NAME" != push ] || [ -z "$DEFAULT_BRANCH" ] || [ "$GITHUB_REF" != "refs/heads/$DEFAULT_BRANCH" ]; then
            echo "::error::The graph is submitted only on a push to the default branch, not $GITHUB_EVENT_NAME to $GITHUB_REF."
            exit 1
          fi
      # The submitted repository, as data.
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          path: scanned
          persist-credentials: false
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          repository: ${{ job.workflow_repository }}
          ref: ${{ job.workflow_sha }}
          path: factory
          sparse-checkout: |
            mise.toml
            mise.lock
            apps/factory/src/repositories.ts
            apps/factory/src/vulnerabilities/
            deploy/images/syft/Dockerfile
            policy/repositories.ts
          sparse-checkout-cone-mode: false
          persist-credentials: false
      # Node to run the script, and yq for the list and the lockfile: each at the version this repository's mise.lock holds.
      - uses: jdx/mise-action@b44d12e7d0d8ee7461bb893e1b1993500433185b # v5.2.7
        with:
          version: 2026.10.17
          cache_save: ${{ github.ref == 'refs/heads/main' }}
          working_directory: factory
          install_args: node yq
      - name: Make the snapshot
        env:
          FACTORY_REPOSITORY: ${{ vars.FACTORY_REPOSITORY }}
          APP_REPOSITORY: ${{ vars.APP_REPOSITORY }}
        run: |
          node factory/apps/factory/src/vulnerabilities/graph.ts scanned \
            --syft-pin factory/deploy/images/syft/Dockerfile --out "$RUNNER_TEMP/graph" \
            --sha "$GITHUB_SHA" --ref "$GITHUB_REF" --run "$GITHUB_RUN_ID-$GITHUB_RUN_ATTEMPT"
      - name: Submit it
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh api --method POST "repos/$GITHUB_REPOSITORY/dependency-graph/snapshots" \
            --input "$RUNNER_TEMP/graph/snapshot.json" --jq '"Snapshot \(.id): \(.result), \(.message)"'

  # The same snapshot, of the pull request's base, with no permission to write anything: a pull request proves a change
  # to the graph by its own run, and nothing it does reaches the graph.
  graph-proof:
    name: graph proof
    if: ${{ github.event_name == 'pull_request' }}
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    permissions:
      contents: read
    steps:
      - name: Refuse a privileged context
        run: |
          if [ "$GITHUB_EVENT_NAME" != pull_request ]; then
            echo "::error::The proving run runs only on a pull request, not $GITHUB_EVENT_NAME."
            exit 1
          fi
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ github.event.pull_request.base.sha }}
          path: scanned
          persist-credentials: false
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          repository: ${{ job.workflow_repository }}
          ref: ${{ job.workflow_sha }}
          path: factory
          sparse-checkout: |
            mise.toml
            mise.lock
            apps/factory/src/repositories.ts
            apps/factory/src/vulnerabilities/
            deploy/images/syft/Dockerfile
            policy/repositories.ts
          sparse-checkout-cone-mode: false
          persist-credentials: false
      - uses: jdx/mise-action@b44d12e7d0d8ee7461bb893e1b1993500433185b # v5.2.7
        with:
          version: 2026.10.17
          cache_save: ${{ github.ref == 'refs/heads/main' }}
          working_directory: factory
          install_args: node yq
      # The pnpm the checkout's mise pins, read as data, installed by this repository's mise, as the scan's coverage does.
      - name: Make the snapshot and compare it with pnpm's list
        env:
          FACTORY_REPOSITORY: ${{ vars.FACTORY_REPOSITORY }}
          APP_REPOSITORY: ${{ vars.APP_REPOSITORY }}
          BASE_SHA: ${{ github.event.pull_request.base.sha }}
          BASE_REF: ${{ github.event.pull_request.base.ref }}
        run: |
          version=$(node factory/apps/factory/src/vulnerabilities/coverage.ts --pnpm-version scanned)
          cd factory
          mise exec "pnpm@$version" -- node "$GITHUB_WORKSPACE/factory/apps/factory/src/vulnerabilities/graph.ts" \
            "$GITHUB_WORKSPACE/scanned" --syft-pin "$GITHUB_WORKSPACE/factory/deploy/images/syft/Dockerfile" \
            --out "$RUNNER_TEMP/graph" --sha "$BASE_SHA" --ref "refs/heads/$BASE_REF" \
            --run "$GITHUB_RUN_ID-$GITHUB_RUN_ATTEMPT" --prove
