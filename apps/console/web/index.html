<title>Software Factory · Martin Rogan</title>
<meta name="description" content="A working software factory: AI agents and deterministic gates look after a deliberately broken app, live.">
<!-- Where the events come from: "live" is this server's API; "log:<url>" is an event-log folder, for the replay site. -->
<meta name="sf-events" content="live">
<!-- The profile whose policy bounds Martin's settings, and whether the gateway sends every agent to the local model:
     the console's server writes both here from FACTORY_PROFILE and ALL_LOCAL, as the gateway reads them. -->
<meta name="sf-profile" content="local">
<meta name="sf-all-local" content="false">
<!-- The app's address, which "Preview it on the app" opens with ?preview=: the server writes it here from APP_URL. -->
<meta name="sf-app" content="">
<!-- The factory's and the app's repositories, which rows are the app's and where links to GitHub go: the server writes
     them here from FACTORY_REPOSITORY and APP_REPOSITORY. Blank, as on the replay site, they are the real two. -->
<meta name="sf-factory-repository" content="">
<meta name="sf-app-repository" content="">
<!-- The events, fetched while the script loads rather than after it runs. A recording's page drops this line. -->
<link rel="preload" href="/api/events?after=0" as="fetch" crossorigin="anonymous">
<link rel="icon" href="../../../docs/design/system/mark/icon.svg" type="image/svg+xml">
<script type="module" src="./src/main.tsx"></script>
</head>

</body>
