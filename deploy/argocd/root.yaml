# The one Application `make up` applies by hand. Everything else is in deploy/overlays/local, on main.
apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: root
  namespace: argocd
spec:
  project: default
  source:
    repoURL: https://github.com/the-roganator/cv-software-factory.git
    targetRevision: main
    path: deploy/overlays/local
    # Every chart's values from this revision too: each Application but the website's, which is deployed from the
    # app's repository, reads them from its second source, `ref: values`. `make up REVISION=` writes both `main`s.
    kustomize:
      patches:
        - target:
            kind: Application
            labelSelector: software-factory/repository!=app
          patch: |
            - op: replace
              path: /spec/sources/1/targetRevision
              value: main
  destination:
    server: https://kubernetes.default.svc
    namespace: argocd
  # The flags in `flags` are Martin's, set from the console (deploy/base/flagd/flags.yaml): Argo CD makes the resource
  # from Git, with no flags, and neither reports its flags as drift nor puts them back, even when it syncs something
  # else. Its other fields are Git's. A change here reaches the cluster at the next `make up`, which applies this file.
  ignoreDifferences:
    - group: core.openfeature.dev
      kind: FeatureFlag
      namespace: flagd
      name: flags
      jsonPointers:
        - /spec/flagSpec/flags
  syncPolicy:
    automated:
      prune: true
      selfHeal: true
    syncOptions:
      - RespectIgnoreDifferences=true
