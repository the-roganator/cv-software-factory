# `factory-images`: the factory's namespaces. `factory` runs the workers, the console, Postgres and the migrations;
# `runners` the agents' steps, which the line starts from the runner image it is pinned to. The `try-the-line` skill
# switches this copy, and only this one, to Audit for a run on images built on the Mac, and Argo CD puts it back.
# `factory-refusal-key` holds the GitHub worker's public key to `make refusal-key`, and nothing switches it.
apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization
namePrefix: factory-
resources:
  - ../images
  - refusal-key.yaml
  - red-team-pods.yaml
patches:
  - target:
      kind: ImageValidatingPolicy
    patch: |
      - op: replace
        path: /spec/matchConstraints/namespaceSelector/matchExpressions/0/values
        value: [factory, runners]
      # The two images here that are not ours, and why. Nothing else from another registry runs in these namespaces.
      #
      # - Postgres, the event store (deploy/base/postgres), from Docker's official image on Docker Hub:
      #   Docker's own build, which no pipeline of ours could sign. `make samples` and `make real-store` run it too, as
      #   the artifacts copier (deploy/k3d/artifacts-copier.yaml), for its shell and tar. Its one pin is the
      #   StatefulSet's, which deploy/base/kustomization.yaml copies in here.
      # - The Postgres exporter (deploy/base/postgres-exporter), from the Prometheus community's own build on Quay,
      #   beside Postgres so that its password stays in this namespace. Its one pin is its Deployment's, copied in here
      #   the same way.
      - op: replace
        path: /spec/variables/0/expression
        value: >-
          [
            'the StatefulSet postgres image',
            'the Deployment postgres-exporter image'
          ]
      # The factory's images, which build.yml builds and the profile pins: the workers, the console and its
      # migrations, the probes' browser and the runner. None of the app's: it runs only in `website`.
      - op: replace
        path: /spec/variables/1/expression
        value: >-
          [
            'ghcr.io/the-roganator/cv-software-factory/factory',
            'ghcr.io/the-roganator/cv-software-factory/factory-browser',
            'ghcr.io/the-roganator/cv-software-factory/factory-runner',
            'ghcr.io/the-roganator/cv-software-factory/console'
          ]
