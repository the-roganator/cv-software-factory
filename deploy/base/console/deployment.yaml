apiVersion: apps/v1
kind: Deployment
metadata:
  name: console
  annotations:
    # After Postgres (wave 0) and the migrations (wave 1).
    argocd.argoproj.io/sync-wave: "2"
spec:
  replicas: 1
  template:
    spec:
      automountServiceAccountToken: false
      securityContext:
        runAsNonRoot: true
        seccompProfile:
          type: RuntimeDefault
      containers:
        - name: console
          # Each profile pins the image by digest (kustomize `images:`), so a deploy is always a commit.
          image: console
          ports:
            - name: http
              containerPort: 8080
          env:
            - name: OTEL_EXPORTER_OTLP_ENDPOINT
              value: http://otel-collector.telemetry:4318
            - name: OTEL_SERVICE_NAME
              value: console
            - name: OTEL_RESOURCE_ATTRIBUTES
              value: service.namespace=software-factory
            # Every 15s rather than the default minute, so rates settle quickly (and canary analysis, later, too).
            - name: OTEL_METRIC_EXPORT_INTERVAL
              value: "15000"
            # The event store, as the console's role: it can read public views and nothing else.
            - name: PGHOST
              value: postgres
            - name: PGDATABASE
              value: factory
            - name: PGUSER
              value: console_reader
            - name: PGPASSWORD
              valueFrom:
                secretKeyRef:
                  name: postgres-console
                  key: password
            - name: ARTIFACTS_DIR
              value: /var/lib/factory/artifacts
            # The GitHub worker's public key (`make refusal-key`), which each relayed refusal's record is checked with
            # before Guardrails counts it. Optional: without it, every relayed refusal reads as unverified.
            - name: REFUSAL_PUBLIC_KEY
              valueFrom:
                configMapKeyRef:
                  name: refusal-key
                  key: public-key
                  optional: true
            # The gateway's profile (gateway.yaml), written into the page for the settings' bounds and defaults. Set
            # ALL_LOCAL here too whenever the gateway has it, so the settings page says every agent is on the local model.
            - name: FACTORY_PROFILE
              value: local
            # The app's address as a browser reaches it, the local cluster's, which a flag's "Preview it" opens with
            # ?preview=. The server writes its origin alone into the page; unset, there is no eye.
            - name: APP_URL
              value: http://website.localhost:8080
          readinessProbe:
            httpGet:
              path: /health
              port: http
            periodSeconds: 5
          livenessProbe:
            httpGet:
              path: /health
              port: http
            periodSeconds: 10
          resources:
            requests:
              cpu: 50m
              memory: 96Mi
            limits:
              memory: 256Mi
          securityContext:
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            capabilities:
              drop: [ALL]
          volumeMounts:
            - name: artifacts
              mountPath: /var/lib/factory/artifacts
              readOnly: true
      volumes:
        - name: artifacts
          persistentVolumeClaim:
            claimName: artifacts
