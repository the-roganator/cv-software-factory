# Broken on purpose, on a throwaway pull request, to see the platform check fail. Never merged.
apiVersion: apps/v1
kind: Deployment
metadata:
  name: crashes-after-start
  labels:
    app.kubernetes.io/name: crashes-after-start
spec:
  replicas: 1
  selector:
    matchLabels:
      app.kubernetes.io/name: crashes-after-start
  template:
    metadata:
      labels:
        app.kubernetes.io/name: crashes-after-start
    spec:
      automountServiceAccountToken: false
      securityContext:
        runAsNonRoot: true
        runAsUser: 65532
        runAsGroup: 65532
        seccompProfile:
          type: RuntimeDefault
      containers:
        - name: broken
          image: factory
          args: [-e, "console.error('running 15 s, then exiting 1 on purpose'); setTimeout(() => process.exit(1), 15000)"]

          resources:
            requests: { cpu: 10m, memory: 32Mi }
            limits: { memory: 64Mi }
          securityContext:
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            capabilities:
              drop: [ALL]
