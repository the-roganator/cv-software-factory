# The model gateway: the only way from the factory to a model, and the only pod that holds a model provider's key (TypeSafe's
# and Anthropic's). In record mode it asks the provider and keeps a cassette of each answer on its own volume, where recordings
# of real reports and real work stay: no other pod mounts it, and nothing commits it. Without a key it replays that provider.
apiVersion: apps/v1
kind: Deployment
metadata:
  name: gateway
  labels: &labels
    app.kubernetes.io/name: gateway
    app.kubernetes.io/part-of: software-factory
    app.kubernetes.io/component: worker
  annotations:
    # After Postgres (wave 0) and the migrations (wave 1), with the console.
    argocd.argoproj.io/sync-wave: "2"
spec:
  replicas: 1
  strategy:
    type: Recreate # one at a time: the volumes are ReadWriteOnce, and two workers must not run the same loop
  selector:
    matchLabels:
      app.kubernetes.io/name: gateway
  template:
    metadata:
      labels: *labels
    spec:
      automountServiceAccountToken: false
      securityContext:
        runAsNonRoot: true
        runAsUser: 65532
        runAsGroup: 65532
        seccompProfile:
          type: RuntimeDefault
      containers:
        - name: gateway
          # Each profile pins the image by digest (kustomize `images:`), so a deploy is always a commit.
          image: factory
          args:
            - --import
            - ./src/telemetry.ts
            - src/cli.ts
            - gateway
          ports:
            - name: http
              containerPort: 8080
          env:
            - name: OTEL_EXPORTER_OTLP_ENDPOINT
              value: "http://otel-collector.telemetry:4318"
            - name: OTEL_SERVICE_NAME
              value: "gateway"
            - name: OTEL_RESOURCE_ATTRIBUTES
              value: "service.namespace=software-factory"
            - name: OTEL_METRIC_EXPORT_INTERVAL
              value: "15000"
            # The event store, as this worker's own role (policy/store-grants.ts): what it uses, and appending and reading events.
            - name: PGHOST
              value: postgres
            - name: PGDATABASE
              value: factory
            - name: PGUSER
              value: factory_gateway
            - name: PGPASSWORD
              valueFrom:
                secretKeyRef:
                  name: postgres-gateway
                  key: password
            - name: GATEWAY_MODE
              value: record
            - name: FACTORY_PROFILE
              value: local
            - name: CASSETTES_DIR
              value: /var/lib/factory/cassettes
            # The only pod that holds the key. `make up` creates the Secret from TYPESAFE_API_KEY or the Keychain; with none,
            # the gateway replays cassettes only.
            - name: TYPESAFE_API_KEY
              valueFrom:
                secretKeyRef:
                  name: typesafe
                  key: api-key
                  optional: true
            # Anthropic's key, for the agents' calls. `make up` creates the Secret from the Keychain; with none, agents' calls
            # to Claude replay only.
            - name: ANTHROPIC_API_KEY
              valueFrom:
                secretKeyRef:
                  name: anthropic
                  key: api-key
                  optional: true
            # Triage's caller token: a judgement without it is answered 401. `make judgements-token` (and so `make up`)
            # makes the Secret once, which only triage and the gateway name. Optional, so the runners' calls go on without
            # it: with none, the gateway answers every judgement 401, and the make target restarts it once it makes one.
            - name: JUDGEMENTS_TOKEN
              valueFrom:
                secretKeyRef:
                  name: judgements-token
                  key: token
                  optional: true
            # LM Studio on the Mac, through OrbStack's address for the host. Only the local profile's network policy lets
            # the gateway reach it (deploy/overlays/local/local-models.yaml).
            - name: LOCAL_MODELS_URL
              value: http://0.250.250.254:1234
          readinessProbe:
            httpGet:
              path: /health
              port: http
            periodSeconds: 5
          livenessProbe:
            httpGet:
              path: /health
              port: http
            periodSeconds: 10
          resources:
            requests:
              cpu: 20m
              memory: 96Mi
            limits:
              memory: 256Mi
          securityContext:
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            capabilities:
              drop: [ALL]
          volumeMounts:
            - name: cassettes
              mountPath: /var/lib/factory/cassettes
      volumes:
        - name: cassettes
          persistentVolumeClaim:
            claimName: cassettes
