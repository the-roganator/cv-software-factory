# The GitHub worker: the factory's identity in GitHub, and the only pod that holds the App's key. It commits, opens pull
# requests, reviews, reports check runs and opens issues as the App, for the other workers, and polls GitHub and GHCR.
# Without the key (`make up` creates the Secret from the Keychain) it reads and writes nothing. It signs each refusal it
# answers (its guard's, and GitHub's 403s) with the Secret refusal-signing-key, which `make refusal-key` makes once and no
# other pod reads, so the line can record it and not make one up (apps/factory/src/github/refusals.ts).
apiVersion: apps/v1
kind: Deployment
metadata:
  name: github
  labels: &labels
    app.kubernetes.io/name: github
    app.kubernetes.io/part-of: software-factory
    # Not `worker`: that would give the pod with the App's key and the internet a path to Postgres, which it never
    # uses. Its own policy gives it the collector (network-policies.yaml).
    app.kubernetes.io/component: github
  annotations:
    # With the other workers, after the artifacts volume it records dry runs to.
    argocd.argoproj.io/sync-wave: "2"
spec:
  replicas: 1
  strategy:
    type: Recreate # one at a time: two workers must not open the same pull request
  selector:
    matchLabels:
      app.kubernetes.io/name: github
  template:
    metadata:
      labels: *labels
    spec:
      automountServiceAccountToken: false
      securityContext:
        runAsNonRoot: true
        runAsUser: 65532
        runAsGroup: 65532
        seccompProfile:
          type: RuntimeDefault
      containers:
        - name: github
          # Each profile pins the image by digest (kustomize `images:`), so a deploy is always a commit.
          image: factory
          args:
            - --import
            - ./src/telemetry.ts
            - src/cli.ts
            - github
            - run
          ports:
            - name: http
              containerPort: 8080
            # The red-team harness's attack door, on a port of its own (apps/factory/src/github/attacks.ts).
            - name: attack
              containerPort: 8082
          env:
            # Other pods call it, so it listens beyond loopback; the network policy says which may.
            - name: HOST
              value: 0.0.0.0
            # Serve the red-team harness's attack door on its own port (github/attacks.ts); only the harness reaches it.
            - name: ATTACK_PORT
              value: "8082"
            - name: OTEL_EXPORTER_OTLP_ENDPOINT
              value: "http://otel-collector.telemetry:4318"
            - name: OTEL_SERVICE_NAME
              value: "github"
            - name: OTEL_RESOURCE_ATTRIBUTES
              value: "service.namespace=software-factory"
            - name: OTEL_METRIC_EXPORT_INTERVAL
              value: "15000"
            # Not a secret: GitHub accepts it as the issuer of the App's tokens, which only the key can sign.
            - name: GITHUB_APP_CLIENT_ID
              value: Iv23liE1Dj3iYkwWX59z
            - name: GITHUB_APP_PRIVATE_KEY
              valueFrom:
                secretKeyRef:
                  name: github-app
                  key: private-key
                  optional: true
            # Optional: a cluster made before the key has none, and the worker answers refusals unsigned, which no
            # worker records.
            - name: REFUSAL_SIGNING_KEY
              valueFrom:
                secretKeyRef:
                  name: refusal-signing-key
                  key: private-key
                  optional: true
            # true for the unattended passes: each action goes to the artifact store, and nothing to GitHub.
            - name: GITHUB_DRY_RUN
              value: "false"
            - name: ARTIFACTS_DIR
              value: /var/lib/factory/artifacts
            # Sigstore's trust root, fetched through TUF, to check the signatures of the images it proposes.
            - name: TUF_CACHE_DIR
              value: /var/cache/sigstore
          readinessProbe:
            httpGet:
              path: /health
              port: http
            periodSeconds: 5
          livenessProbe:
            httpGet:
              path: /health
              port: http
            periodSeconds: 10
          # More than the other workers: on top of its steady use, release-please runs each time main moves, and
          # checking a new build's signatures takes tens of megabytes more for a minute or so.
          resources:
            requests:
              cpu: 20m
              memory: 224Mi
            limits:
              memory: 384Mi
          securityContext:
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            capabilities:
              drop: [ALL]
          volumeMounts:
            - name: artifacts
              mountPath: /var/lib/factory/artifacts
            - name: sigstore
              mountPath: /var/cache/sigstore
            # TUF downloads each file into a directory of its own under /tmp, then copies it into the cache.
            - name: tmp
              mountPath: /tmp
      volumes:
        - name: artifacts
          persistentVolumeClaim:
            claimName: artifacts
        - name: sigstore
          emptyDir:
            sizeLimit: 16Mi
        - name: tmp
          emptyDir:
            sizeLimit: 16Mi
