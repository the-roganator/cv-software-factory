# The line (apps/factory/src/line): carries work items from triage's tickets through the agents, the gates and review
# to Martin's merge. LINE_MODE is `live` here: it acts in GitHub through the GitHub worker; `off`, its default, takes no
# tickets, and only the step API and the smoke run work. On a new store it takes nothing until Martin first starts the
# line. What it takes is Martin's to set in the console's Controls, or with `make take-the-line` (every ticket, the next
# few, or just one), which it reads each pass; with none set, it takes every ticket.
# It starts each step's Jobs in `runners` (apps/factory/src/runners), with its own service account, which may do that
# (deploy/base/runners/line-access.yaml) and read the app's Rollout and its AnalysisRuns, and list its pods, in
# `website` (deploy/base/analysis/line-reads-release.yaml), and list the Events admission's denials are in
# (deploy/base/line-reads-admission), and nothing else, and takes the agent pods' handbacks on
# :8081. Its step API on :8080 is reached only through a person's port-forward. Before it deletes a step's Jobs, it
# keeps each pod's log in the artifact store, which it mounts with the other workers that write there. The step API
# serves a work item's logs, read from the line's own process (a second Node process in this pod would pass its memory
# limit and restart the line):
#
#   kubectl -n factory port-forward svc/line 8092:8080 & curl localhost:8092/v1/work-items/<id>/logs
apiVersion: v1
kind: ServiceAccount
metadata:
  name: line
  annotations:
    argocd.argoproj.io/sync-wave: "2"
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: line
  labels: &labels
    app.kubernetes.io/name: line
    app.kubernetes.io/part-of: software-factory
    app.kubernetes.io/component: worker
  annotations:
    argocd.argoproj.io/sync-wave: "2"
spec:
  replicas: 1
  strategy:
    type: Recreate # one at a time: a handback goes to the pod whose step waits for it
  selector:
    matchLabels:
      app.kubernetes.io/name: line
  template:
    metadata:
      labels: *labels
    spec:
      serviceAccountName: line
      # The one worker that talks to the Kubernetes API, to start runners, read the app's release, read the flags, and
      # read admission's denials.
      automountServiceAccountToken: true
      securityContext:
        runAsNonRoot: true
        runAsUser: 65532
        runAsGroup: 65532
        seccompProfile:
          type: RuntimeDefault
      initContainers:
        # The runner image, pinned by the profile like the others: this checks it is pullable before the line starts,
        # and the profile copies its reference into RUNNER_IMAGE (deploy/overlays/local/factory-image).
        - name: runner-image
          image: factory-runner
          args: ["--version"]
          command: [node]
          resources:
            requests:
              cpu: 10m
              memory: 32Mi
            limits:
              memory: 64Mi
          securityContext:
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            capabilities:
              drop: [ALL]
      containers:
        - name: line
          image: factory
          args:
            - --import
            - ./src/telemetry.ts
            - src/cli.ts
            - line
            - serve
          ports:
            - name: http
              containerPort: 8080
            - name: handback
              containerPort: 8081
          env:
            - name: OTEL_EXPORTER_OTLP_ENDPOINT
              value: "http://otel-collector.telemetry:4318"
            - name: OTEL_SERVICE_NAME
              value: "line"
            - name: OTEL_RESOURCE_ATTRIBUTES
              value: "service.namespace=software-factory"
            - name: OTEL_METRIC_EXPORT_INTERVAL
              value: "15000"
            - name: PGHOST
              value: postgres
            - name: PGDATABASE
              value: factory
            - name: PGUSER
              value: factory_line
            - name: PGPASSWORD
              valueFrom:
                secretKeyRef:
                  name: postgres-line
                  key: password
            - name: RUNNER_IMAGE
              value: factory-runner
            - name: GITHUB_WORKER_URL
              value: http://github:8080
            - name: RUNNER_GATEWAY_URL
              value: http://gateway.factory.svc:8080
            - name: RUNNER_HANDBACK_URL
              value: http://line.factory.svc:8081/v1/handback
            # The gateway's profile (gateway.yaml), for the cap on a work item's spend that the line holds at, and for
            # where policy/models.ts sends each agent's calls. With ALL_LOCAL, set here as on the gateway, a step on
            # the local model is given longer.
            - name: FACTORY_PROFILE
              value: local
            # The line on Claude, over the senses' tickets, as Martin sets it to take them.
            - name: LINE_MODE
              value: live
            # After the merge: the read-only watch of the app's releases, with each version's figures from Prometheus,
            # and Verify, which asks the probes (their verify port), Prometheus, Loki and Tempo whether a ticket's signal
            # cleared. Tempo is for the log watcher's agreement check: without it, wrong metrics wait at Verify. The
            # three are read through the read-only proxy in `telemetry` (deploy/base/telemetry/query.yaml).
            - name: RELEASE_ROLLOUT
              value: website/website
            - name: PROMETHEUS_URL
              value: http://query.telemetry:9090
            - name: PROBES_URL
              value: http://probes:8081
            - name: LOKI_URL
              value: http://query.telemetry:3100
            - name: TEMPO_URL
              value: http://query.telemetry:3200
            # The FeatureFlag the admin service stages Martin's flags in, which the line reads, by name and nothing else
            # (deploy/base/flagd/line-reads-flags.yaml), to compare with his moves, as it compares the Rollout above
            # with his controls and the sessions with his sign-ins: a change no event names pages him.
            - name: FEATURE_FLAGS
              value: flagd/flags
            # The GitHub worker's public key, which `make refusal-key` writes from its signing key: the line verifies
            # each refusal the worker answers it with before it records it (apps/factory/src/line/refusals.ts).
            # Optional: without it, nothing the worker refuses is recorded.
            - name: REFUSAL_PUBLIC_KEY
              valueFrom:
                configMapKeyRef:
                  name: refusal-key
                  key: public-key
                  optional: true
            # Where each runner pod's log is kept, as the step ends.
            - name: ARTIFACTS_DIR
              value: /var/lib/factory/artifacts
          # The handback's port: the step API listens on loopback only, so the kubelet cannot reach it.
          readinessProbe:
            httpGet:
              path: /health
              port: handback
            periodSeconds: 5
          resources:
            requests:
              cpu: 20m
              memory: 96Mi
            limits:
              memory: 256Mi
          securityContext:
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            capabilities:
              drop: [ALL]
          volumeMounts:
            - name: artifacts
              mountPath: /var/lib/factory/artifacts
      volumes:
        - name: artifacts
          persistentVolumeClaim:
            claimName: artifacts
