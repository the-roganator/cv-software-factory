# The workers that others call. Alertmanager posts to `intake` (deploy/base/telemetry/values/prometheus.yaml); triage
# calls `gateway` and `probes`; the line will call `github`. The network policies say who may.
apiVersion: v1
kind: Service
metadata:
  name: gateway
  annotations:
    argocd.argoproj.io/sync-wave: "2"
spec:
  selector:
    app.kubernetes.io/name: gateway
  ports:
    - name: http
      port: 8080
      targetPort: http
---
apiVersion: v1
kind: Service
metadata:
  name: github
  annotations:
    argocd.argoproj.io/sync-wave: "2"
spec:
  selector:
    app.kubernetes.io/name: github
  ports:
    - name: http
      port: 8080
      targetPort: http
    # The red-team harness's attack door, on its own port (apps/factory/src/github/attacks.ts).
    - name: attack
      port: 8082
      targetPort: attack
---
apiVersion: v1
kind: Service
metadata:
  name: intake
  annotations:
    argocd.argoproj.io/sync-wave: "2"
spec:
  selector:
    app.kubernetes.io/name: intake
  ports:
    - name: http
      port: 8080
      targetPort: http
---
apiVersion: v1
kind: Service
metadata:
  name: probes
  annotations:
    argocd.argoproj.io/sync-wave: "2"
spec:
  selector:
    app.kubernetes.io/name: probes
  ports:
    - name: http
      port: 8080
      targetPort: http
    - name: verify
      port: 8081
      targetPort: verify
---
apiVersion: v1
kind: Service
metadata:
  name: line
  annotations:
    argocd.argoproj.io/sync-wave: "2"
spec:
  selector:
    app.kubernetes.io/name: line
  ports:
    - name: http
      port: 8080
      targetPort: http
    - name: handback
      port: 8081
      targetPort: handback
