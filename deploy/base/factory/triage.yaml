# Triage: takes each signal from the inbox once and turns it into a ticket. Reports go to Jev through the gateway; a report's
# page is read through the probes' page reader. Before it trusts a sense's new problem, it looks at what that sense reads
# besides the app: Prometheus (the disk too), Loki and Tempo.
apiVersion: apps/v1
kind: Deployment
metadata:
  name: triage
  labels: &labels
    app.kubernetes.io/name: triage
    app.kubernetes.io/part-of: software-factory
    app.kubernetes.io/component: worker
  annotations:
    # After Postgres (wave 0) and the migrations (wave 1), with the console.
    argocd.argoproj.io/sync-wave: "2"
spec:
  replicas: 1
  strategy:
    type: Recreate # one at a time: the volumes are ReadWriteOnce, and two workers must not run the same loop
  selector:
    matchLabels:
      app.kubernetes.io/name: triage
  template:
    metadata:
      labels: *labels
    spec:
      automountServiceAccountToken: false
      securityContext:
        runAsNonRoot: true
        runAsUser: 65532
        runAsGroup: 65532
        seccompProfile:
          type: RuntimeDefault
      containers:
        - name: triage
          # Each profile pins the image by digest (kustomize `images:`), so a deploy is always a commit.
          image: factory
          args:
            - --import
            - ./src/telemetry.ts
            - src/cli.ts
            - triage
          env:
            - name: OTEL_EXPORTER_OTLP_ENDPOINT
              value: "http://otel-collector.telemetry:4318"
            - name: OTEL_SERVICE_NAME
              value: "triage"
            - name: OTEL_RESOURCE_ATTRIBUTES
              value: "service.namespace=software-factory"
            - name: OTEL_METRIC_EXPORT_INTERVAL
              value: "15000"
            # The event store, as this worker's own role (policy/store-grants.ts): what it uses, and appending and reading events.
            - name: PGHOST
              value: postgres
            - name: PGDATABASE
              value: factory
            - name: PGUSER
              value: factory_triage
            - name: PGPASSWORD
              valueFrom:
                secretKeyRef:
                  name: postgres-triage
                  key: password
            - name: GATEWAY_URL
              value: http://gateway:8080
            # The caller token the gateway takes judgements with, from the Secret only triage and the gateway name
            # (`make judgements-token`). Required: with no Secret the pod does not start.
            - name: JUDGEMENTS_TOKEN
              valueFrom:
                secretKeyRef:
                  name: judgements-token
                  key: token
            - name: PAGES_URL
              value: http://probes:8080
            - name: PROMETHEUS_URL
              value: http://query.telemetry:9090
            - name: LOKI_URL
              value: http://query.telemetry:3100
            - name: TEMPO_URL
              value: http://query.telemetry:3200
            - name: ARTIFACTS_DIR
              value: /var/lib/factory/artifacts
          resources:
            requests:
              cpu: 20m
              memory: 96Mi
            limits:
              memory: 256Mi
          securityContext:
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            capabilities:
              drop: [ALL]
          volumeMounts:
            - name: artifacts
              mountPath: /var/lib/factory/artifacts
      volumes:
        - name: artifacts
          persistentVolumeClaim:
            claimName: artifacts
