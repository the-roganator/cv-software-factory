# Applies whatever migrations the store has not had, then sets the passwords of the console, the scoreboard, the
# Postgres exporter, each worker, the admin service and the proofs from their Secrets. A Sync hook in wave 1: after
# Postgres (wave 0) is healthy, before the console (wave 2) starts. It runs the console's image, which carries the
# migrations, so a new image brings its migrations with it.
apiVersion: batch/v1
kind: Job
metadata:
  name: migrate
  annotations:
    argocd.argoproj.io/hook: Sync
    argocd.argoproj.io/sync-wave: "1"
    argocd.argoproj.io/hook-delete-policy: BeforeHookCreation
spec:
  backoffLimit: 6
  template:
    spec:
      restartPolicy: Never
      automountServiceAccountToken: false
      securityContext:
        runAsNonRoot: true
        seccompProfile:
          type: RuntimeDefault
      containers:
        - name: migrate
          # Each profile pins the image by digest, as for the console.
          image: console
          args: [../../packages/store/src/migrate.ts]
          env:
            # As the database's owner: only it may change the schema and the roles.
            - name: PGHOST
              value: postgres
            - name: PGDATABASE
              value: factory
            - name: PGUSER
              value: factory
            - name: PGPASSWORD
              valueFrom:
                secretKeyRef:
                  name: postgres
                  key: password
            - name: CONSOLE_PASSWORD
              valueFrom:
                secretKeyRef:
                  name: postgres-console
                  key: password
            # The same password as the scoreboard's own Secret, in its namespace (`make up`). Optional, so a cluster
            # made before the scoreboard still migrates; its role then has no password, and cannot log in.
            - name: SCOREBOARD_PASSWORD
              valueFrom:
                secretKeyRef:
                  name: postgres-scoreboard
                  key: password
                  optional: true
            # The Postgres exporter's (deploy/base/postgres-exporter), made by `make up`. Optional for the same reason.
            - name: METRICS_PASSWORD
              valueFrom:
                secretKeyRef:
                  name: postgres-metrics
                  key: password
                  optional: true
            # Each worker's own (0022_worker-roles.sql), made by `make worker-secrets`. Optional, so a cluster made before
            # them still migrates; their roles then have no password, and cannot log in.
            - name: TRIAGE_PASSWORD
              valueFrom:
                secretKeyRef:
                  name: postgres-triage
                  key: password
                  optional: true
            - name: LINE_PASSWORD
              valueFrom:
                secretKeyRef:
                  name: postgres-line
                  key: password
                  optional: true
            - name: GATEWAY_PASSWORD
              valueFrom:
                secretKeyRef:
                  name: postgres-gateway
                  key: password
                  optional: true
            - name: PROBES_PASSWORD
              valueFrom:
                secretKeyRef:
                  name: postgres-probes
                  key: password
                  optional: true
            - name: CRAWLER_PASSWORD
              valueFrom:
                secretKeyRef:
                  name: postgres-crawler
                  key: password
                  optional: true
            - name: INTAKE_PASSWORD
              valueFrom:
                secretKeyRef:
                  name: postgres-intake
                  key: password
                  optional: true
            - name: LOGS_PASSWORD
              valueFrom:
                secretKeyRef:
                  name: postgres-logs
                  key: password
                  optional: true
            # The admin service's (0023_martins-commands.sql), made by `make up`. Optional for the same reason.
            - name: ADMIN_PASSWORD
              valueFrom:
                secretKeyRef:
                  name: postgres-admin
                  key: password
                  optional: true
            # The proofs', which `make guardrails` connects as from the Mac (0043_guardrail-proofs.sql), made by
            # `make up`. Optional for the same reason.
            - name: PROOFS_PASSWORD
              valueFrom:
                secretKeyRef:
                  name: postgres-proofs
                  key: password
                  optional: true
          resources:
            requests:
              cpu: 20m
              memory: 64Mi
            limits:
              memory: 128Mi
          securityContext:
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            capabilities:
              drop: [ALL]
