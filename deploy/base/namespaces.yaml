# Every workload but the pod log collector, which reads the node's files, meets the restricted Pod Security Standard:
# non-root, no privilege escalation, no capabilities.
apiVersion: v1
kind: Namespace
metadata:
  name: factory
  annotations:
    argocd.argoproj.io/sync-wave: "-1" # before the Applications that deploy into it
  labels:
    pod-security.kubernetes.io/enforce: restricted
---
apiVersion: v1
kind: Namespace
metadata:
  name: telemetry
  annotations:
    argocd.argoproj.io/sync-wave: "-1"
  labels:
    pod-security.kubernetes.io/enforce: restricted
---
# The World's Worst Website. Its own repository deploys into this namespace and nowhere else (website/project.yaml).
apiVersion: v1
kind: Namespace
metadata:
  name: website
  annotations:
    argocd.argoproj.io/sync-wave: "-1"
  labels:
    pod-security.kubernetes.io/enforce: restricted
---
# Argo Rollouts' controller, which runs the app's releases as canaries (rollouts/). Like telemetry, it runs only an
# upstream chart, so admission control does not guard it (deploy/base/admission).
apiVersion: v1
kind: Namespace
metadata:
  name: argo-rollouts
  annotations:
    argocd.argoproj.io/sync-wave: "-1"
  labels:
    pod-security.kubernetes.io/enforce: restricted
---
# The pod log collector (pod-logs/), one on each node, reading every container's log from the node's files: the one
# namespace of ours that does not enforce the restricted standard, since a host path is the only way to those files.
# The collector itself runs as root with every capability dropped, and mounts the logs read-only.
apiVersion: v1
kind: Namespace
metadata:
  name: pod-logs
  annotations:
    argocd.argoproj.io/sync-wave: "-1"
  labels:
    pod-security.kubernetes.io/enforce: privileged
---
# Runners: one Job per step of the factory's agents, each a disposable sandbox. The line creates them; nothing here is
# deployed but their fences (deploy/base/runners), which a profile brings in with the factory's workers.
apiVersion: v1
kind: Namespace
metadata:
  name: runners
  annotations:
    argocd.argoproj.io/sync-wave: "-1"
  labels:
    pod-security.kubernetes.io/enforce: restricted
---
# The red-team harness's egress and image attacks: each a pod made like an agent's, apart from the line's runners so
# that the harness's right to read and delete a pod here reaches none of them. Nothing is deployed here but their fences
# and the harness's Role (deploy/base/red-team), which a profile brings in with the factory's workers.
apiVersion: v1
kind: Namespace
metadata:
  name: red-team
  annotations:
    argocd.argoproj.io/sync-wave: "-1"
  labels:
    pod-security.kubernetes.io/enforce: restricted
---
# The scoreboard: the only reader of the answer key, alone in its namespace so that its Secret is no one else's. Like
# the runners, nothing is deployed here but with the factory's image (deploy/base/scoreboard).
apiVersion: v1
kind: Namespace
metadata:
  name: scoreboard
  annotations:
    argocd.argoproj.io/sync-wave: "-1"
  labels:
    pod-security.kubernetes.io/enforce: restricted
---
# flagd, which answers for the app's feature flags, and `flags`, the one FeatureFlag it reads (flagd/). Apart from the
# app, so that nothing the app's repository may write in `website` can touch flagd, its service account or its state.
apiVersion: v1
kind: Namespace
metadata:
  name: flagd
  annotations:
    argocd.argoproj.io/sync-wave: "-1"
  labels:
    pod-security.kubernetes.io/enforce: restricted
