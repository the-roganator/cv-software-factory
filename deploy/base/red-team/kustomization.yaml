# `red-team`: where the red-team harness makes the egress and image attacks' pods (apps/factory/src/red-team/pods.ts),
# apart from the line's runners, so that its right to read and delete a pod reaches no runner. The pods meet an agent's
# fence (../agent-fence), the image policy that guards the factory's namespaces and the red-team pod rule
# (../admission/factory), and the restricted Pod Security Standard (../namespaces.yaml). Brought in with the factory's
# workers (deploy/overlays/local/factory-image), as the harness is.
apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization
namespace: red-team
resources:
  - ../agent-fence
  - access.yaml
  - quota.yaml
