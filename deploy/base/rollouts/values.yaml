# One Argo Rollouts controller, for the app's canaries. Its Traefik traffic router is built in (it sets the weights of
# the app's TraefikService), so nothing is fetched when it starts. No dashboard: the console shows the canary.
createClusterAggregateRoles: false

controller:
  replicas: 1
  # Its own metrics, among them each Rollout's and AnalysisRun's phase, on 8090, for Prometheus to scrape; its fence
  # lets it in (network-policies.yaml).
  podAnnotations:
    prometheus.io/scrape: "true"
    prometheus.io/port: "8090"
  image:
    tag: v1.10.2@sha256:2a395642ea411ae7b09274a560c3934b16134dfe36f5ffaaa6054c8a21a2eecf
  resources:
    requests:
      cpu: 20m
      memory: 64Mi
    limits:
      memory: 256Mi

# Rights to the traffic routers the cluster has, which is Traefik only.
providerRBAC:
  providers:
    istio: false
    smi: false
    ambassador: false
    awsLoadBalancerController: false
    awsAppMesh: false
    traefik: true
    apisix: false
    contour: false
    glooPlatform: false
    gatewayAPI: false

# The restricted Pod Security Standard, which the argo-rollouts namespace enforces. The chart's container defaults
# already meet it.
podSecurityContext:
  runAsNonRoot: true
  seccompProfile:
    type: RuntimeDefault
