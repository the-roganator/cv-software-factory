# The fences around the factory's runners, and the line's right to start them. The Jobs themselves are the line's to
# create (apps/factory/src/runners/jobs.ts). Brought in with the factory's workers (deploy/overlays/local/factory-image).
apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization
namespace: runners
resources:
  - ../agent-fence
  - network-policies.yaml
  - line-access.yaml
  - red-team-access.yaml
  - quota.yaml
