apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: loki
  namespace: argocd
spec:
  project: software-factory
  destination:
    server: https://kubernetes.default.svc
    namespace: telemetry
  sources:
    - repoURL: https://grafana-community.github.io/helm-charts
      chart: loki
      targetRevision: 19.4.0
      helm:
        releaseName: loki
        valueFiles:
          - $values/deploy/base/telemetry/values/loki.yaml
    - repoURL: https://github.com/the-roganator/cv-software-factory.git
      targetRevision: main
      ref: values
  syncPolicy:
    automated:
      prune: true
      selfHeal: true
