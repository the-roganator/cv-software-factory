# Grafana, with the three stores wired together: from a log line to its trace, and from a trace to its logs.
# The admin password lives only in the cluster: `make up` creates this Secret, so nothing random is rendered
# (Argo CD would see a new password on every sync).
admin:
  existingSecret: grafana-admin

testFramework:
  enabled: false

grafana.ini:
  analytics:
    reporting_enabled: false
    check_for_updates: false
    check_for_plugin_updates: false
  news:
    news_feed_enabled: false
  # The overview is the home page: whether the factory is healthy, and each tile a way into the dashboard behind it.
  dashboards:
    default_home_dashboard_path: /tmp/dashboards/overview.json

# The dashboards' sidecar reads ConfigMaps and Secrets in this namespace, and no other: by default the chart lets it
# read them in every namespace, the scoreboard's answer key included.
rbac:
  namespaced: true

sidecar:
  # The chart's sidecar, 2.11.2, carries a Critical in its Python certifi (GHSA-6q48-6c7w-9gw2) that 2.14.3 fixes, and
  # no 13.x chart ships 2.14.3. This comes out when the chart moves to 14.3.1 or later, whose own sidecar is 2.14.3;
  # until then the scan reads it through the chart's rendering, and Dependabot does not move it. Pinned by digest, the
  # tag's index, with the tag kept beside it for the reader, as Kyverno's are.
  image:
    tag: 2.14.3@sha256:52d311dcedd587421a236c4d6c621f05614c40a51386e955e0699dca97ec0880
  dashboards:
    enabled: true
    label: grafana_dashboard
    searchNamespace: telemetry
    # Each watch of ConfigMaps and Secrets is closed after this many seconds and started again, and each start logs a
    # line: every minute, by default. Ten minutes; the client waits a minute longer, so the server closes it first. A
    # dashboard change arrives at once over the open watch; over a connection dropped without a word, which the client
    # notices only when it times out, it arrives within eleven minutes, not two.
    watchServerTimeout: 600
    watchClientTimeout: 660
    # Every dashboard in one folder, linked to the others by their shared tag.
    provider:
      folder: Software Factory
      folderUid: software-factory

datasources:
  datasources.yaml:
    apiVersion: 1
    datasources:
      - name: Prometheus
        uid: prometheus
        type: prometheus
        url: http://prometheus-server
        isDefault: true
        jsonData:
          # How often services push metrics; Grafana sizes $__rate_interval from it.
          timeInterval: 15s
      - name: Loki
        uid: loki
        type: loki
        url: http://loki:3100
        jsonData:
          derivedFields:
            - name: Trace
              matcherType: label
              matcherRegex: trace_id
              datasourceUid: tempo
              url: $${__value.raw}
      - name: Tempo
        uid: tempo
        type: tempo
        url: http://tempo:3200
        jsonData:
          # A record's trace id is structured metadata in Loki, not part of its text, so a line filter on it finds
          # nothing: the query filters on the field, in every service's streams, as a trace crosses services, but the
          # pod log collector's, whose records have no such field. `0*` still matches an id given without its leading
          # zeros.
          tracesToLogsV2:
            datasourceUid: loki
            customQuery: true
            query: '{service_name=~".+", service_name!="pod-logs"} | trace_id=~"0*$${__span.traceId}"'
            spanStartTimeShift: -5m
            spanEndTimeShift: 5m
          serviceMap:
            datasourceUid: prometheus

# It idles near 250Mi, and each page load's queries, assets and panels leave its heap growing until Go next collects:
# a few dashboards opened one after another in a fresh browser take it past 512Mi.
resources:
  requests:
    cpu: 50m
    memory: 256Mi
  limits:
    memory: 768Mi
# Go collects hard before the kernel kills: 90% of the limit above, in bytes, as Tempo and Prometheus set for themselves.
env:
  GOMEMLIMIT: "724775731"
