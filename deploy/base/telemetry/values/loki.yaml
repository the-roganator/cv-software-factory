# Loki as a single binary on the local filesystem, taking logs over OTLP.
deploymentMode: Monolithic

loki:
  auth_enabled: false
  commonConfig:
    replication_factor: 1
  storage:
    type: filesystem
  schemaConfig:
    configs:
      - from: "2026-01-01"
        store: tsdb
        object_store: filesystem
        schema: v13
        index:
          prefix: index_
          period: 24h
  limits_config:
    allow_structured_metadata: true
    retention_period: 168h
    # The store below would also open Loki's API for deleting logs on request, and the logs are what Verify judges a
    # fix by: only age deletes them.
    deletion_mode: disabled
  # The compactor applies the retention period, and deletes nothing unless its retention is on, which needs a store
  # for delete requests. Its working directory, holding the marks of chunks waiting to be deleted, defaults to
  # /var/loki/compactor, on the persistent volume.
  compactor:
    retention_enabled: true
    delete_request_store: filesystem
  analytics:
    reporting_enabled: false

# The rules' sidecar reads ConfigMaps and Secrets in this namespace, and no other: by default the chart lets it read
# them in every namespace, the scoreboard's answer key included.
rbac:
  namespaced: true

# The rules' sidecar, 2.11.2 in the chart, carries a Critical in its Python certifi (GHSA-6q48-6c7w-9gw2) that 2.14.3
# fixes, and no 18.x chart ships 2.14.3. This comes out when the chart moves to 20.2.2 or later, whose own sidecar is
# 2.14.3; until then the scan reads it through the chart's rendering, and Dependabot does not move it. Pinned by
# digest, the tag's index, with the tag kept beside it for the reader, as Kyverno's are.
sidecar:
  image:
    tag: 2.14.3@sha256:52d311dcedd587421a236c4d6c621f05614c40a51386e955e0699dca97ec0880

singleBinary:
  replicas: 1
  # Its own metrics, on its HTTP port, for Prometheus to scrape.
  podAnnotations:
    prometheus.io/scrape: "true"
    prometheus.io/port: "3100"
  persistence:
    size: 4Gi
  resources:
    requests:
      cpu: 100m
      memory: 256Mi
    limits:
      memory: 1Gi

# Only the single binary: no gateway, caches, canary or tests.
gateway:
  enabled: false
chunksCache:
  enabled: false
resultsCache:
  enabled: false
lokiCanary:
  enabled: false
test:
  enabled: false
backend:
  replicas: 0
read:
  replicas: 0
write:
  replicas: 0

# Broken on purpose: a throwaway that proves the platform check fails early on values that do not parse.
singleBinary: [
