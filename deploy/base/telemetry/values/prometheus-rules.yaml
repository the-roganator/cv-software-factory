# Generated from policy/objectives.ts, policy/stuck.ts, policy/triage.ts and policy/flags.ts by
# apps/factory/src/alerts/rules.ts. Do not edit it: change the policy, then run `node apps/factory/src/alerts/rules.ts`. `make check` fails when this
# file is out of date.
serverFiles:
  alerting_rules.yml:
    groups:
      - name: objectives
        rules:
          - alert: RouteErrorRatioAboveObjective
            expr: "(((sum by (http_route) (rate(http_server_request_duration_seconds_count{job=\"worlds-worst-website/website\", k8s_pod_label_rollouts_pod_template_hash!=\"\", http_route!=\"\", http_response_status_code=~\"5..\"}[15m])) or sum by (http_route) (rate(http_server_request_duration_seconds_count{job=\"worlds-worst-website/website\", k8s_pod_label_rollouts_pod_template_hash!=\"\", http_route!=\"\"}[15m])) * 0) / sum by (http_route) (rate(http_server_request_duration_seconds_count{job=\"worlds-worst-website/website\", k8s_pod_label_rollouts_pod_template_hash!=\"\", http_route!=\"\"}[15m]))) and on (http_route) (sum by (http_route) (increase(http_server_request_duration_seconds_count{job=\"worlds-worst-website/website\", k8s_pod_label_rollouts_pod_template_hash!=\"\", http_route!=\"\"}[15m])) >= 20)) > 0.05"
            for: 2m
            labels:
              route: "{{ $labels.http_route }}"
              symptom: "server-error"
              objective: "error-ratio"
            annotations:
              summary: "{{ $labels.http_route }}: more than 5% of requests answered with a 5xx status"
              description: "Over 15 minutes, with at least 20 requests."
              threshold: "0.05"
          - alert: RouteLatencyAboveObjective
            expr: "(histogram_quantile(0.95, sum by (le, http_route) (rate(http_server_request_duration_seconds_bucket{job=\"worlds-worst-website/website\", k8s_pod_label_rollouts_pod_template_hash!=\"\", http_route!=\"\"}[15m]))) and on (http_route) (sum by (http_route) (increase(http_server_request_duration_seconds_count{job=\"worlds-worst-website/website\", k8s_pod_label_rollouts_pod_template_hash!=\"\", http_route!=\"\"}[15m])) >= 20)) > 1"
            for: 2m
            labels:
              route: "{{ $labels.http_route }}"
              symptom: "slow-response"
              objective: "latency"
            annotations:
              summary: "{{ $labels.http_route }}: p95 latency above 1 s"
              description: "Over 15 minutes, with at least 20 requests."
              threshold: "1"
      - name: martin
        rules:
          - alert: SecurityEvent
            expr: "max(increase(line_security_events_total{kind=\"sign-in\", k8s_namespace_name=\"factory\", k8s_pod_label_app_kubernetes_io_name=\"line\"}[5m])) > 0"
            for: 0s
            labels:
              level: "inform"
              kind: "sign-in"
            annotations:
              summary: "Signed in as Martin"
              description: "A passkey signed in to the console."
          - alert: SecurityEvent
            expr: "max(increase(line_security_events_total{kind=\"passkey-enrolled\", k8s_namespace_name=\"factory\", k8s_pod_label_app_kubernetes_io_name=\"line\"}[5m])) > 0"
            for: 0s
            labels:
              level: "page"
              kind: "passkey-enrolled"
            annotations:
              summary: "A passkey was enrolled"
              description: "A new passkey can sign in as Martin."
          - alert: SecurityEvent
            expr: "max(increase(line_security_events_total{kind=\"passkey-revoked\", k8s_namespace_name=\"factory\", k8s_pod_label_app_kubernetes_io_name=\"line\"}[5m])) > 0"
            for: 0s
            labels:
              level: "page"
              kind: "passkey-revoked"
            annotations:
              summary: "A passkey was revoked"
              description: "A passkey can no longer sign in as Martin."
          - alert: SecurityEvent
            expr: "max(increase(line_security_events_total{kind=\"setting-changed\", k8s_namespace_name=\"factory\", k8s_pod_label_app_kubernetes_io_name=\"line\"}[5m])) > 0"
            for: 0s
            labels:
              level: "notify"
              kind: "setting-changed"
            annotations:
              summary: "A setting was changed"
              description: "An agent's model or effort, or a spend cap, was changed in the console."
          - alert: SecurityEvent
            expr: "max(increase(line_security_events_total{kind=\"release-control\", k8s_namespace_name=\"factory\", k8s_pod_label_app_kubernetes_io_name=\"line\"}[5m])) > 0"
            for: 0s
            labels:
              level: "notify"
              kind: "release-control"
            annotations:
              summary: "A release was promoted or retried"
              description: "The app's canary was promoted, or a stopped release retried, from the console."
          - alert: SecurityEvent
            expr: "max(increase(line_security_events_total{kind=\"guardrail-approved\", k8s_namespace_name=\"factory\", k8s_pod_label_app_kubernetes_io_name=\"line\"}[5m])) > 0"
            for: 0s
            labels:
              level: "page"
              kind: "guardrail-approved"
            annotations:
              summary: "A guardrail was overridden"
              description: "A hold whose cause is a guardrail was approved."
          - alert: SecurityEvent
            expr: "max(increase(line_security_events_total{kind=\"line-started\", k8s_namespace_name=\"factory\", k8s_pod_label_app_kubernetes_io_name=\"line\"}[5m])) > 0"
            for: 0s
            labels:
              level: "notify"
              kind: "line-started"
            annotations:
              summary: "The line was started"
              description: "The line takes work again."
          - alert: SecurityEvent
            expr: "max(increase(line_security_events_total{kind=\"line-stopped\", k8s_namespace_name=\"factory\", k8s_pod_label_app_kubernetes_io_name=\"line\"}[5m])) > 0"
            for: 0s
            labels:
              level: "inform"
              kind: "line-stopped"
            annotations:
              summary: "The line was stopped"
              description: "The line takes no work until it is started again."
          - alert: SecurityEvent
            expr: "max(increase(line_security_events_total{kind=\"autonomy-loosened\", k8s_namespace_name=\"factory\", k8s_pod_label_app_kubernetes_io_name=\"line\"}[5m])) > 0"
            for: 0s
            labels:
              level: "page"
              kind: "autonomy-loosened"
            annotations:
              summary: "Autonomy was loosened"
              description: "The line's autonomy level was made looser in the console."
          - alert: SecurityEvent
            expr: "max(increase(line_security_events_total{kind=\"autonomy-tightened\", k8s_namespace_name=\"factory\", k8s_pod_label_app_kubernetes_io_name=\"line\"}[5m])) > 0"
            for: 0s
            labels:
              level: "notify"
              kind: "autonomy-tightened"
            annotations:
              summary: "Autonomy was tightened"
              description: "The line's autonomy level was made stricter in the console."
          - alert: SecurityEvent
            expr: "max(increase(line_security_events_total{kind=\"new-work-on\", k8s_namespace_name=\"factory\", k8s_pod_label_app_kubernetes_io_name=\"line\"}[5m])) > 0"
            for: 0s
            labels:
              level: "notify"
              kind: "new-work-on"
            annotations:
              summary: "Agents take new work again"
              description: "Agents were let take new work in the console."
          - alert: SecurityEvent
            expr: "max(increase(line_security_events_total{kind=\"new-work-off\", k8s_namespace_name=\"factory\", k8s_pod_label_app_kubernetes_io_name=\"line\"}[5m])) > 0"
            for: 0s
            labels:
              level: "inform"
              kind: "new-work-off"
            annotations:
              summary: "Agents take no new work"
              description: "Agents were stopped taking new work in the console."
          - alert: SecurityEvent
            expr: "max(increase(line_security_events_total{kind=\"auto-merge-on\", k8s_namespace_name=\"factory\", k8s_pod_label_app_kubernetes_io_name=\"line\"}[5m])) > 0"
            for: 0s
            labels:
              level: "notify"
              kind: "auto-merge-on"
            annotations:
              summary: "Auto-merge was turned on"
              description: "Auto-merge of low-risk changes was turned on in the console."
          - alert: SecurityEvent
            expr: "max(increase(line_security_events_total{kind=\"auto-merge-off\", k8s_namespace_name=\"factory\", k8s_pod_label_app_kubernetes_io_name=\"line\"}[5m])) > 0"
            for: 0s
            labels:
              level: "inform"
              kind: "auto-merge-off"
            annotations:
              summary: "Auto-merge was turned off"
              description: "Auto-merge of low-risk changes was turned off in the console."
          - alert: SecurityEvent
            expr: "max(increase(line_security_events_total{kind=\"take-widened\", k8s_namespace_name=\"factory\", k8s_pod_label_app_kubernetes_io_name=\"line\"}[5m])) > 0"
            for: 0s
            labels:
              level: "notify"
              kind: "take-widened"
            annotations:
              summary: "The line takes more"
              description: "What the line takes was widened in the console."
          - alert: SecurityEvent
            expr: "max(increase(line_security_events_total{kind=\"take-narrowed\", k8s_namespace_name=\"factory\", k8s_pod_label_app_kubernetes_io_name=\"line\"}[5m])) > 0"
            for: 0s
            labels:
              level: "inform"
              kind: "take-narrowed"
            annotations:
              summary: "The line takes less"
              description: "What the line takes was narrowed in the console."
          - alert: SecurityEvent
            expr: "max(increase(line_security_events_total{kind=\"auto-rollback-off\", k8s_namespace_name=\"factory\", k8s_pod_label_app_kubernetes_io_name=\"line\"}[5m])) > 0"
            for: 0s
            labels:
              level: "page"
              kind: "auto-rollback-off"
            annotations:
              summary: "Auto-rollback was turned off"
              description: "Auto-rollback was turned off in the console: a canary whose errors or latency the analysis judges bad now pauses for you to promote or abort, rather than rolling back by itself. A failed journeys check still rolls it back, and Stop the line still aborts one."
          - alert: SecurityEvent
            expr: "max(increase(line_security_events_total{kind=\"auto-rollback-on\", k8s_namespace_name=\"factory\", k8s_pod_label_app_kubernetes_io_name=\"line\"}[5m])) > 0"
            for: 0s
            labels:
              level: "inform"
              kind: "auto-rollback-on"
            annotations:
              summary: "Auto-rollback was turned on"
              description: "Auto-rollback was turned on in the console: a canary the analysis judges bad rolls back by itself. One already paused for you stays paused until you promote or abort it."
          - alert: SecurityEvent
            expr: "max(increase(line_security_events_total{kind=\"flag-widened\", k8s_namespace_name=\"factory\", k8s_pod_label_app_kubernetes_io_name=\"line\"}[5m])) > 0"
            for: 0s
            labels:
              level: "notify"
              kind: "flag-widened"
            annotations:
              summary: "A feature flag was widened"
              description: "A feature flag's stage was widened in the console, or a flag turned back on for everyone."
          - alert: SecurityEvent
            expr: "max(increase(line_security_events_total{kind=\"flag-narrowed\", k8s_namespace_name=\"factory\", k8s_pod_label_app_kubernetes_io_name=\"line\"}[5m])) > 0"
            for: 0s
            labels:
              level: "inform"
              kind: "flag-narrowed"
            annotations:
              summary: "A feature flag was narrowed"
              description: "A feature flag's stage was narrowed in the console."
          - alert: SecurityEvent
            expr: "max(increase(line_security_events_total{kind=\"flag-off\", k8s_namespace_name=\"factory\", k8s_pod_label_app_kubernetes_io_name=\"line\"}[5m])) > 0"
            for: 0s
            labels:
              level: "inform"
              kind: "flag-off"
            annotations:
              summary: "A feature flag was turned off"
              description: "A feature flag was turned off for everyone in the console."
          - alert: SecurityEvent
            expr: "max(increase(line_security_events_total{kind=\"improvement-requested\", k8s_namespace_name=\"factory\", k8s_pod_label_app_kubernetes_io_name=\"line\"}[5m])) > 0"
            for: 0s
            labels:
              level: "notify"
              kind: "improvement-requested"
            annotations:
              summary: "An improvement was asked for"
              description: "An improvement was asked for in the console, with the passkey given again."
          - alert: SecurityEvent
            expr: "max(increase(line_security_events_total{kind=\"improvement-approved\", k8s_namespace_name=\"factory\", k8s_pod_label_app_kubernetes_io_name=\"line\"}[5m])) > 0"
            for: 0s
            labels:
              level: "notify"
              kind: "improvement-approved"
            annotations:
              summary: "An improvement's spec was approved"
              description: "An improvement's spec was approved in the console: the line will build it."
          - alert: SecurityEvent
            expr: "max(increase(line_security_events_total{kind=\"phone-on\", k8s_namespace_name=\"factory\", k8s_pod_label_app_kubernetes_io_name=\"line\"}[5m])) > 0"
            for: 0s
            labels:
              level: "inform"
              kind: "phone-on"
            annotations:
              summary: "Alerts reach your phone again"
              description: "Alerts to your phone were switched on in the console: every alert reaches it, at its level."
          - alert: SecurityEvent
            expr: "max(increase(line_security_events_total{kind=\"phone-off\", k8s_namespace_name=\"factory\", k8s_pod_label_app_kubernetes_io_name=\"line\"}[5m])) > 0"
            for: 0s
            labels:
              level: "page"
              kind: "phone-off"
            annotations:
              summary: "Alerts no longer reach your phone"
              description: "Alerts to your phone were switched off in the console: none reaches it until they are switched on again. Grafana's Alerts dashboard still shows every alert."
          - alert: SecurityEvent
            expr: "max(increase(line_security_events_total{kind=\"guardrail-not-held\", k8s_namespace_name=\"factory\", k8s_pod_label_app_kubernetes_io_name=\"line\"}[5m])) > 0"
            for: 0s
            labels:
              level: "page"
              kind: "guardrail-not-held"
            annotations:
              summary: "A guardrail did not hold"
              description: "A proof make guardrails took did not hold, so its guardrail may not be holding. make guardrails said which, and why, and the audit log records it."
          - alert: SecurityEventsUncounted
            expr: "(count(last_over_time(line_security_events_total{k8s_namespace_name=\"factory\", k8s_pod_label_app_kubernetes_io_name=\"line\"}[6h])) unless count(line_security_events_total{k8s_namespace_name=\"factory\", k8s_pod_label_app_kubernetes_io_name=\"line\"})) or max(line_security_events_counting{k8s_namespace_name=\"factory\", k8s_pod_label_app_kubernetes_io_name=\"line\"}) == 0"
            for: 5m
            labels:
              level: "page"
              worker: "line"
            annotations:
              summary: "Security events are not being counted"
              description: "The line has not counted sign-ins and the rest for some minutes, so none of them would reach you."
          - alert: AdminActionUncounted
            expr: "max by (action) (last_over_time(line_admin_actions_uncounted{action=\"flags\", k8s_namespace_name=\"factory\", k8s_pod_label_app_kubernetes_io_name=\"line\"}[1m])) == 1"
            for: 2m
            labels:
              level: "page"
            annotations:
              summary: "The flags changed with no record"
              description: "flagd's flags hold a stage or a revision that no move of yours recorded: they were changed outside the console, or the admin service changed them without recording it. Controls shows each flag's stage as it is: move each that differs there, which records it, and look in the admin service's log."
          - alert: AdminActionUncounted
            expr: "max by (action) (last_over_time(line_admin_actions_uncounted{action=\"rollout\", k8s_namespace_name=\"factory\", k8s_pod_label_app_kubernetes_io_name=\"line\"}[1m])) == 1"
            for: 2m
            labels:
              level: "page"
            annotations:
              summary: "The app's Rollout changed with no record"
              description: "The app's Rollout was paused, resumed or promoted fully with no control of yours recorded: outside the Canary panel, or by the admin service without recording it. The Canary panel shows it as it is: act there, which records it, and look in the admin service's log."
          - alert: AdminActionUncounted
            expr: "max by (action) (last_over_time(line_admin_actions_uncounted{action=\"sessions\", k8s_namespace_name=\"factory\", k8s_pod_label_app_kubernetes_io_name=\"line\"}[1m])) == 1"
            for: 2m
            labels:
              level: "page"
            annotations:
              summary: "A session started with no sign-in"
              description: "The store holds a session of the last hour that no sign-in recorded: someone made it outside the admin service’s sign-in, or the admin service did without recording it. End every session with make enrol REVOKE_OTHERS=1, then enrol your passkey again. This ends an hour after the session started."
          - alert: AdminActionUncounted
            expr: "max by (action) (last_over_time(line_admin_actions_compared{action=\"flags\", k8s_namespace_name=\"factory\", k8s_pod_label_app_kubernetes_io_name=\"line\"}[1m])) == 0"
            for: 10m
            labels:
              level: "page"
              worker: "line"
            annotations:
              summary: "The line is not comparing the flags' stages"
              description: "For ten minutes the line has not been able to compare the flags' stages with the events that record them, so a change none records would not reach you. The line’s log says why."
          - alert: AdminActionUncounted
            expr: "max by (action) (last_over_time(line_admin_actions_compared{action=\"rollout\", k8s_namespace_name=\"factory\", k8s_pod_label_app_kubernetes_io_name=\"line\"}[1m])) == 0"
            for: 10m
            labels:
              level: "page"
              worker: "line"
            annotations:
              summary: "The line is not comparing the app's Rollout's controls"
              description: "For ten minutes the line has not been able to compare the app's Rollout's controls with the events that record them, so a change none records would not reach you. The line’s log says why."
          - alert: AdminActionUncounted
            expr: "max by (action) (last_over_time(line_admin_actions_compared{action=\"sessions\", k8s_namespace_name=\"factory\", k8s_pod_label_app_kubernetes_io_name=\"line\"}[1m])) == 0"
            for: 10m
            labels:
              level: "page"
              worker: "line"
            annotations:
              summary: "The line is not comparing the sessions"
              description: "For ten minutes the line has not been able to compare the sessions with the events that record them, so a change none records would not reach you. The line’s log says why."
          - alert: AdminActionUncounted
            expr: "max(last_over_time(admin_auto_rollback{k8s_namespace_name=\"factory\", k8s_pod_label_app_kubernetes_io_name=\"admin\"}[1m])) != on () max(last_over_time(line_auto_rollback{k8s_namespace_name=\"factory\", k8s_pod_label_app_kubernetes_io_name=\"line\"}[1m]))"
            for: 2m
            labels:
              level: "page"
              action: "auto-rollback"
            annotations:
              summary: "Auto-rollback differs from your switch"
              description: "The admin service says auto-rollback is one way and your latest switch in the store says the other: it reports what you did not record, or cannot read the store. A canary is paused for you only while both say off. Controls shows the switch as recorded: switch it there, which records it, and look in the admin service's log."
          - alert: AlertmanagerSilenced
            expr: "max(alertmanager_silences{state=~\"active|pending\"}) > 0"
            for: 0s
            labels:
              level: "page"
            annotations:
              summary: "Alerts are silenced"
              description: "Alertmanager has a silence in place, which keeps the alerts it matches from your phone."
          - alert: PhoneOff
            expr: "max(last_over_time(admin_alerts_phone{k8s_namespace_name=\"factory\", k8s_pod_label_app_kubernetes_io_name=\"admin\"}[1m])) == 0 and on () max(last_over_time(line_alerts_phone{k8s_namespace_name=\"factory\", k8s_pod_label_app_kubernetes_io_name=\"line\"}[1m])) == 0"
            for: 0s
            labels: {}
            annotations:
              summary: "Alerts are not reaching your phone"
              description: "Alerts to your phone are switched off in the console's Controls, or have not been switched on on this profile: Alertmanager sends none of them, and Grafana's Alerts dashboard shows them all."
          - alert: HoldWaits
            expr: "((max by (work_item, cause, pull_request) (label_replace(line_hold_age_seconds{cause=\"suggestion\", work_item=~\"[1-9][0-9]*\", pull_request=~\"|[1-9][0-9]*\", k8s_namespace_name=\"factory\", k8s_pod_label_app_kubernetes_io_name=\"line\"}, \"pull_request\", \"\", \"pull_request\", \"[1-9][0-9]{9,}\")) > 0 < 1800) unless (max by (work_item, cause, pull_request) (label_replace(line_hold_age_seconds{cause=\"suggestion\", work_item=~\"[1-9][0-9]*\", pull_request=~\"|[1-9][0-9]*\", k8s_namespace_name=\"factory\", k8s_pod_label_app_kubernetes_io_name=\"line\"} offset 30m, \"pull_request\", \"\", \"pull_request\", \"[1-9][0-9]{9,}\")) == max by (work_item, cause, pull_request) (label_replace(line_hold_age_seconds{cause=\"suggestion\", work_item=~\"[1-9][0-9]*\", pull_request=~\"|[1-9][0-9]*\", k8s_namespace_name=\"factory\", k8s_pod_label_app_kubernetes_io_name=\"line\"}, \"pull_request\", \"\", \"pull_request\", \"[1-9][0-9]{9,}\")))) or (max by (work_item, cause, pull_request) (label_replace(line_hold_age_seconds{cause=\"suggestion\", work_item=~\"[1-9][0-9]*\", pull_request=~\"|[1-9][0-9]*\", k8s_namespace_name=\"factory\", k8s_pod_label_app_kubernetes_io_name=\"line\"}, \"pull_request\", \"\", \"pull_request\", \"[1-9][0-9]{9,}\")) > 0 unless max by (work_item, cause, pull_request) (label_replace(line_hold_age_seconds{cause=\"suggestion\", work_item=~\"[1-9][0-9]*\", pull_request=~\"|[1-9][0-9]*\", k8s_namespace_name=\"factory\", k8s_pod_label_app_kubernetes_io_name=\"line\"} offset 30m, \"pull_request\", \"\", \"pull_request\", \"[1-9][0-9]{9,}\")) > 0)"
            for: 0s
            labels:
              level: "notify"
            annotations:
              summary: "#{{ $labels.work_item }} waits for you: a suggestion"
              description: "Triage parked a suggestion: only you ask for improvements."
          - alert: HoldWaits
            expr: "((max by (work_item, cause, pull_request) (label_replace(line_hold_age_seconds{cause=\"finding\", work_item=~\"[1-9][0-9]*\", pull_request=~\"|[1-9][0-9]*\", k8s_namespace_name=\"factory\", k8s_pod_label_app_kubernetes_io_name=\"line\"}, \"pull_request\", \"\", \"pull_request\", \"[1-9][0-9]{9,}\")) > 0 < 1800) unless (max by (work_item, cause, pull_request) (label_replace(line_hold_age_seconds{cause=\"finding\", work_item=~\"[1-9][0-9]*\", pull_request=~\"|[1-9][0-9]*\", k8s_namespace_name=\"factory\", k8s_pod_label_app_kubernetes_io_name=\"line\"} offset 30m, \"pull_request\", \"\", \"pull_request\", \"[1-9][0-9]{9,}\")) == max by (work_item, cause, pull_request) (label_replace(line_hold_age_seconds{cause=\"finding\", work_item=~\"[1-9][0-9]*\", pull_request=~\"|[1-9][0-9]*\", k8s_namespace_name=\"factory\", k8s_pod_label_app_kubernetes_io_name=\"line\"}, \"pull_request\", \"\", \"pull_request\", \"[1-9][0-9]{9,}\")))) or (max by (work_item, cause, pull_request) (label_replace(line_hold_age_seconds{cause=\"finding\", work_item=~\"[1-9][0-9]*\", pull_request=~\"|[1-9][0-9]*\", k8s_namespace_name=\"factory\", k8s_pod_label_app_kubernetes_io_name=\"line\"}, \"pull_request\", \"\", \"pull_request\", \"[1-9][0-9]{9,}\")) > 0 unless max by (work_item, cause, pull_request) (label_replace(line_hold_age_seconds{cause=\"finding\", work_item=~\"[1-9][0-9]*\", pull_request=~\"|[1-9][0-9]*\", k8s_namespace_name=\"factory\", k8s_pod_label_app_kubernetes_io_name=\"line\"} offset 30m, \"pull_request\", \"\", \"pull_request\", \"[1-9][0-9]{9,}\")) > 0)"
            for: 0s
            labels:
              level: "notify"
            annotations:
              summary: "#{{ $labels.work_item }} waits for you: the planner found something"
