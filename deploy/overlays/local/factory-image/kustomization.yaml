# The factory images CI built last, pinned by digest, and with them the workers that run them (deploy/base/factory), the
# scoreboard (deploy/base/scoreboard) and the canary's analysis, whose journeys run on `factory-browser`
# (deploy/base/analysis), and the line's read of admission's denials (deploy/base/line-reads-admission), so the cluster
# never has any of them without an image to run. The factory's GitHub worker moves the three digests together, in a
# pull request, when CI has built all three from a newer commit.
apiVersion: kustomize.config.k8s.io/v1alpha1
kind: Component
resources:
- ../../../base/factory
- ../../../base/runners
- ../../../base/analysis
- ../../../base/scoreboard
- ../../../base/line-reads-admission
images:
- digest: sha256:7647a84b613e1549e45c9ee1f55b0286910539168431cfaae78d13712b02cda1
  name: factory
  newName: ghcr.io/the-roganator/cv-software-factory/factory
- digest: sha256:84c42d1172a9e7ae57dc6f2ed9bfc766e4b7af400ea4efe4d0dde583d936cde8
  name: factory-browser
  newName: ghcr.io/the-roganator/cv-software-factory/factory-browser
- digest: sha256:315ca726ee3c86db418a05eac28547a540852e21bda7c8716d7b76ddb41f1c3f
  name: factory-runner
  newName: ghcr.io/the-roganator/cv-software-factory/factory-runner
# The line starts runners with the runner image it is pinned to here, so its reference goes into the line's settings.
replacements:
- source:
    kind: Deployment
    name: line
    fieldPath: spec.template.spec.initContainers.[name=runner-image].image
  targets:
  - select:
      kind: Deployment
      name: line
    fieldPaths:
    - spec.template.spec.containers.[name=line].env.[name=RUNNER_IMAGE].value
