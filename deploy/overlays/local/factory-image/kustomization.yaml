# The factory images CI built last, pinned by digest, and with them the workers that run them (deploy/base/factory), the
# runners' and the red-team attacks' namespaces (deploy/base/runners, deploy/base/red-team), the scoreboard
# (deploy/base/scoreboard) and the canary's analysis, whose journeys run on `factory-browser`
# (deploy/base/analysis), the line's read of admission's denials (deploy/base/line-reads-admission) and the dependency
# sense's list of pods (deploy/base/patching-reads-pods), so the cluster
# never has any of them without an image to run. The factory's GitHub worker moves the three digests together, in a
# pull request, when CI has built all three from a newer commit.
apiVersion: kustomize.config.k8s.io/v1alpha1
kind: Component
resources:
- ../../../base/factory
- ../../../base/runners
- ../../../base/red-team
- ../../../base/analysis
- ../../../base/scoreboard
- ../../../base/line-reads-admission
- ../../../base/patching-reads-pods
images:
- digest: sha256:c1babb41e21727f66f26161d19244bafe1fb06bb6ced24a4edc75178bf0f65b2
  name: factory
  newName: ghcr.io/the-roganator/cv-software-factory/factory
- digest: sha256:2eff937c7703827f0a47bbccf985fa7b5c4666816631c572acb524a87859ce6c
  name: factory-browser
  newName: ghcr.io/the-roganator/cv-software-factory/factory-browser
- digest: sha256:2ff3f3d9f040f0f1940b49e52795130bcd0a4d0ebc73d02f22a5937f6420a82c
  name: factory-runner
  newName: ghcr.io/the-roganator/cv-software-factory/factory-runner
# The line starts runners with the runner image it is pinned to here, so its reference goes into the line's settings.
replacements:
- source:
    kind: Deployment
    name: line
    fieldPath: spec.template.spec.initContainers.[name=runner-image].image
  targets:
  - select:
      kind: Deployment
      name: line
    fieldPaths:
    - spec.template.spec.containers.[name=line].env.[name=RUNNER_IMAGE].value
# The red-team harness is pinned to the same runner image, read from its own initContainer into RUNNER_IMAGE, which
# the egress attack's pod runs (apps/factory/src/red-team/pods.ts).
- source:
    kind: Deployment
    name: red-team
    fieldPath: spec.template.spec.initContainers.[name=runner-image].image
  targets:
  - select:
      kind: Deployment
      name: red-team
    fieldPaths:
    - spec.template.spec.containers.[name=red-team].env.[name=RUNNER_IMAGE].value
