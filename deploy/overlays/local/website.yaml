# The World's Worst Website on the local cluster: Argo CD deploys the local overlay in the app's own repository,
# which pins the image its CI built (ADR 0005).
apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: website
  namespace: argocd
  labels:
    # Deployed from the app's repository, with no values from this one: root's patch, which points every other
    # Application's values at the revision root deploys, leaves it alone (deploy/argocd/root.yaml).
    software-factory/repository: app
  annotations:
    # Last of everything root deploys. Root's sync waits while a resource in an earlier wave is Suspended or
    # Progressing, and fails on a Degraded one; the website is Suspended through a canary and Degraded after a rollback,
    # so in an earlier wave it would hold back every change to the factory until its release ended or the next began.
    # In the last wave root applies it and is done, whatever its health. Root's own health still shows the website's,
    # so `make up` waits for everything else to be Healthy and for the website only to settle.
    argocd.argoproj.io/sync-wave: "3"
spec:
  project: website
  source:
    repoURL: https://github.com/the-roganator/cv-worlds-worst-website.git
    targetRevision: main
    path: deploy/overlays/local
  destination:
    server: https://kubernetes.default.svc
    namespace: website
  # Argo Rollouts sets the traffic split's weights at each step of a release, and Martin pauses a canary. They are
  # theirs to set: Argo CD neither reports them as drift nor puts them back, even when it syncs something else
  # mid-release.
  ignoreDifferences:
    - group: traefik.io
      kind: TraefikService
      jqPathExpressions:
        - .spec.weighted.services[].weight
    # Martin pauses a canary from the console (the admin service, deploy/base/analysis/admin-controls-release.yaml),
    # which sets the Rollout's `spec.paused`: it is his to set, and self-healing must not resume the canary.
    - group: argoproj.io
      kind: Rollout
      jsonPointers:
        - /spec/paused
  syncPolicy:
    automated:
      prune: true
      selfHeal: true
    syncOptions:
      - RespectIgnoreDifferences=true
      # What a change removes goes only once what replaces it is healthy, so the app keeps answering in between.
      - PruneLast=true
