<script>
(()=> {
const NS = 'http://www.w3.org/2000/svg';
const $ = (id) => document.getElementById(id);
const DOCS = '../COMPONENTS';

const NODES = {
  visitors: { x: 20, y: 40, t: 'Real visitors', s: 'people using the shop' },
  gen: { x: 20, y: 165, t: 'Traffic generator', s: 'fake visitors with ids' },
  preview: { x: 20, y: 290, t: 'A previewer', s: 'asking for a preview' },
  checks: { x: 20, y: 440, t: "The factory's checks", s: 'probes and journeys' },
  traefik: { x: 280, y: 40, w: 140, h: 320, t: 'Traefik', s: 'the front door' },
  argo: { x: 280, y: 382, w: 140, h: 56, t: 'Argo CD', s: 'deploys code' },
  stable: { x: 500, y: 90, t: 'The app', s: 'the current version' },
  canary: { x: 500, y: 230, t: 'The app, new', s: 'a canary', canary: true },
  verify: { x: 500, y: 440, t: 'Verify', s: 'judges what happened' },
  flagd: { x: 780, y: 150, t: 'flagd', s: 'reads the switchboard' },
  flags: { x: 780, y: 290, t: 'flags', s: 'the switchboard' },
  console: { x: 780, y: 440, t: 'The console', s: "Martin's controls" },
};
for (const n of Object.values(NODES)) { n.w ??= 200; n.h ??= 64; }

const EDGES = {
  vis: ['visitors', 'traefik'], gen: ['gen', 'traefik'], pre: ['preview', 'traefik'],
  ts: ['traefik', 'stable'], tc: ['traefik', 'canary'],
  cs: { d: 'M220,464 L460,464 Q475,464 475,449 L475,137 Q475,122 490,122 L500,122' },
  cv: { d: 'M220,494 L500,494' },
  argo: ['argo', 'canary'],
  fs: ['flagd', 'stable'], fc: ['flagd', 'canary'],
  ff: ['flags', 'flagd'], cf: ['console', 'flags'],
  sv: { d: 'M700,122 C 755,122 755,472 700,472' },
  canv: ['canary', 'verify'],
};
function anchors(a, b) {
  const A = NODES[a], B = NODES[b];
  if (B.x >= A.x + A.w) return [[A.x + A.w, A.y + A.h / 2], [B.x, B.y + B.h / 2]];
  if (B.x + B.w <= A.x) return [[A.x, A.y + A.h / 2], [B.x + B.w, B.y + B.h / 2]];
  if (B.y > A.y + A.h) return [[A.x + A.w / 2, A.y + A.h], [B.x + B.w / 2, B.y]];
  return [[A.x + A.w / 2, A.y], [B.x + B.w / 2, B.y + B.h]];
}
function pathFor(id) {
  const e = EDGES[id];
  if (e.d) return e.d;
  const [[x1, y1], [x2, y2]] = anchors(e[0], e[1]);
  if (Math.abs(x2 - x1) > Math.abs(y2 - y1)) { const m = (x1 + x2) / 2; return `M${x1},${y1} C ${m},${y1} ${m},${y2} ${x2},${y2}`; }
  const m = (y1 + y2) / 2; return `M${x1},${y1} C ${x1},${m} ${x2},${m} ${x2},${y2}`;
}

const SET = { cf: 'set', ff: 'set', fs: 'set' };
const STEPS = [
  {
    title: 'The parts',
    tab: 'Parts',
    nodes: Object.keys(NODES),
    edges: { vis: 'req', gen: 'req', pre: 'req', ts: 'req', tc: 'req', cs: 'req', fs: 'set', fc: 'set', ff: 'set', cf: 'set' },
    who: { visitors: 'unlit', preview: 'unlit', gen: 'unlit', checks: 'unlit' },
    body: `
<ul>
<li><b>Real visitors</b> use the shop.</li>
<li><b>The traffic generator</b> stands in for visitors, so there is always traffic to measure. Each of its 101 fake visitors has an id.</li>
<li><b>A previewer</b> is Martin, or anyone he sends a preview link to.</li>
<li><b>The factory's checks</b> are the probes: they click through the shop and take pictures, to see that it works.</li>
<li><b>Traefik</b> is the front door: visitors and the generator come in through it. The checks reach the app directly.</li>
<li><b>Argo CD</b> deploys new versions of the app's code.</li>
<li><b>The app</b> is usually one version. During a release there are briefly two, and the new one is the canary.</li>
<li><b><code>flags</code></b> is a switchboard: which features are on, and for whom. <b>flagd</b> watches it and keeps the app's copy up to date; the app decides each request from its copy, so no request waits on flagd.</li>
<li><b>The console</b> is where Martin moves the switches, a stage at a time: Off, Checks, Preview, Share, Everyone. <b>Verify</b> judges each stage before he can go past it.</li>
</ul>`,
  },
  {
    title: 'The code arrives, switched off',
    tab: 'Shipped',
    nodes: ['visitors', 'gen', 'checks', 'traefik', 'argo', 'stable', 'canary', 'verify', 'flagd', 'flags'],
    edges: { vis: 'unlit', gen: 'unlit', argo: 'req', ts: 'unlit', tc: 'unlit', cs: 'unlit', cv: 'req', canv: 'req', fs: 'set', fc: 'set', ff: 'set' },
    tags: { traefik: '75% · 25%', flags: 'dark-mode: off', canary: 'dark mode inside' },
    who: { visitors: 'unlit', preview: 'unlit', gen: 'unlit', checks: 'unlit' },
    body: `
<p>Martin asked for dark mode with the "+", and approved its spec, which names its flag, <code>dark-mode</code>, and the pages it changes. The coder writes dark mode behind the flag, with tests that pass with it on and with it off. Nothing defines the flag, so it is off. The pull request waits for Martin's merge, as every improvement's does, and is released like any other change.</p>
<div class="callout"><b>A canary is about which code runs.</b> A new version doesn't replace the old one at once: the front door sends it a quarter of the traffic, and the canary's analysis compares the two versions. If the new one has more errors or is slower, it is rolled back on its own; if not, it gets the rest.</div>
<div class="callout"><b>A flag is about which behaviour that code shows.</b> Dark mode is in the new version, switched off, so the canary only checks that it breaks nothing while off. Switching it on later needs no new version, no deploy and no canary.</div>
<p>Once the release is promoted, the line <b>hands it over</b> to its flag. With the flag still off, Verify has the checks picture each page the spec names, once with the browser preferring light and once dark: the <b>baseline</b>, the "off" side of the evidence later.</p>
<details><summary>In the docs</summary><p><a href="${DOCS}/FEATURE-FLAGS.md#an-improvement-end-to-end">An improvement, end to end</a>; <a href="${DOCS}/ORCHESTRATOR.md#an-improvement">the hand-over</a>; <a href="${DOCS}/RELEASE-AND-VERIFY.md#the-probes-checks">the baseline</a>.</p></details>`,
  },
  {
    title: "Checks: the factory's own checks",
    tab: 'Checks',
    nodes: ['visitors', 'checks', 'traefik', 'stable', 'verify', 'flagd', 'flags', 'console'],
    edges: { vis: 'denied', ts: 'unlit', cs: 'lit', cv: 'req', ...SET },
    tags: { flags: 'dark-mode: checks', traefik: 'strips the mark' },
    who: { visitors: 'unlit', preview: 'unlit', gen: 'unlit', checks: 'lit' },
    body: `
<p>Martin moves dark mode to Checks. Only the factory's own checks see it, so they can try it on the real shop while no visitor sees anything. It shows nobody else, so this one move needs no passkey.</p>
<p><b>How the app tells a check from a visitor.</b> The checks already label every request with <b>the mark</b> (the header <code>x-unmeasured</code>), and the app shows dark mode to a marked request. A visitor who adds the mark gets nowhere: the front door strips it. The checks don't come through the front door; they reach the app directly, and the network lets nothing else do so. So the mark can only come from the factory.</p>
<p><b>What Verify does.</b> The checks run their journeys with dark mode on, and the device check makes sure nothing new is left on the browser; a check that passed with the flag off and fails twice, or cannot finish, with it on fails the stage. Each page is pictured again, in light and in dark, and the card shows each beside its baseline, off and on, with where they differ. No check knows what dark mode should look like, so the pictures are Martin's to judge. He can go past Checks only once Verify's check there has passed.</p>
<details><summary>In the docs</summary><p><a href="${DOCS}/ADMISSION-CONTROL.md#the-mark">The mark</a>: kept by the network, not a key. An admission rule holds every route to the app to the one Middleware that strips it. <a href="${DOCS}/RELEASE-AND-VERIFY.md#the-probes-checks">The probes' checks</a>.</p></details>`,
  },
  {
    title: 'Preview: those who ask',
    tab: 'Preview',
    nodes: ['visitors', 'preview', 'checks', 'traefik', 'stable', 'verify', 'flagd', 'flags', 'console'],
    edges: { vis: 'unlit', pre: 'lit', ts: 'req', cs: 'lit', cv: 'req', ...SET },
    tags: { flags: 'dark-mode: preview', preview: '?preview=dark-mode' },
    who: { visitors: 'unlit', preview: 'lit', gen: 'unlit', checks: 'lit' },
    body: `
<p>At Preview, anyone who asks for a preview sees dark mode. The console's "Preview it" opens the shop with <code>?preview=dark-mode</code>, and the shop remembers it for a day in a cookie on that one browser. Every move past Checks, to Preview or to Share, needs Martin's passkey again.</p>
<p>It is harmless: they asked for it, they see a feature already deployed, and only in their own browser. Everyone else sees the old look. Each stage keeps the ones before it, so the checks still see it too.</p>
<p><b>What Verify does.</b> One check asks for the preview, as the console's link does, and the rest run with its cookie. The stage passes only if the device check finds the preview cookie, kept as its contract says, and nothing else the baseline did not keep.</p>
<p>The preview cookie is the only thing flags ever keep on a visitor's device, and only because they asked, which is why neither the shop nor the console needs a cookie banner. Preview is the one stage Martin may skip, from Checks straight to Share.</p>
<details><summary>In the docs</summary><p><a href="${DOCS}/FEATURE-FLAGS.md#the-preview-cookie">The preview cookie</a>, and how a probe asks for it.</p></details>`,
  },
  {
    title: 'Share: the comparison',
    tab: 'Share',
    nodes: ['visitors', 'gen', 'traefik', 'stable', 'verify', 'flagd', 'flags', 'console'],
    edges: { vis: 'unlit', gen: 'half', ts: 'half', ...SET },
    tags: { flags: 'dark-mode: share 50%', gen: 'signed ids' },
    who: { visitors: 'unlit', preview: 'lit', gen: 'half', checks: 'lit' },
    body: `
<p><b>A share is a percentage of the fake visitors:</b> 10, 25 or 50%. At "share 50%", about half of the traffic generator's fake visitors see dark mode and half don't, by flagd's own rule over each one's id. Real visitors still see the old look.</p>
<div class="ids"><span class="lit">traffic-001 signed</span><span>traffic-002 signed</span><span class="lit">traffic-003 signed</span><span>traffic-004 signed</span><span class="none">a visitor, unsigned: off</span></div>
<p><b>Why.</b> It is a fair test: two groups alike in everything but dark mode, each meeting every page as often. Verify compares them on errors and on the 99th percentile of their latency, with the canary's own thresholds, so a fault in the feature shows before any real person meets it.</p>
<p><b>Whose figures.</b> The generator's own: it times each request it sends, by id. The app never labels them, so the code being judged cannot mark its own work. Verify works out which side each id was on with the same library the app decides with, from Martin's move, and asks the app nothing.</p>
<p><b>How long.</b> From a minute after Martin's move, the time the app has to take it, for at least half an hour, one round of the generator's walk, and until each side has enough requests. Everyone waits for this comparison to pass.</p>
<p><b>Why only fake visitors.</b> Keeping a real person on one side would mean keeping an id on their device. The fake visitors send their id with every request.</p>
<p><b>Why signed.</b> If any id would do, anyone could send one and walk into the test. The generator signs each id, with the page and the time, using a key only it holds; the app holds only the key that checks a signature, which cannot make one, and accepts it for that page for a minute.</p>
<details><summary>In the docs</summary><p><a href="${DOCS}/FEATURE-FLAGS.md#the-shares-signed-ids">The share's signed ids</a>: Ed25519, the private key in the generator's Secret and the public one in <code>share-key</code>. <a href="${DOCS}/RELEASE-AND-VERIFY.md#share">Verify's comparison</a>. The app's flag context, which checks the signature, is code-owned, so an agent cannot quietly skip the check.</p></details>`,
  },
  {
    title: 'A canary and a share take turns',
    tab: 'Canary + share',
    nodes: ['gen', 'traefik', 'argo', 'stable', 'canary', 'verify', 'flagd', 'flags'],
    edges: { gen: 'half', argo: 'req', ts: 'half', tc: 'half', canv: 'req', fs: 'set', fc: 'set', ff: 'set' },
    tags: { traefik: 'split two ways', flags: 'dark-mode: share 50%', canary: 'another fix' },
    who: { visitors: 'unlit', preview: 'lit', gen: 'half', checks: 'lit' },
    body: `
<p>Suppose an unrelated fix is released while dark mode is at "share 50%". The fake visitors' traffic is now split two ways at once, by version and by flag, and each comparison can blame the wrong thing.</p>
<p>Say dark mode makes pages slow, and by bad luck more of the canary's requests have it on:</p>
<table>
<tr><th></th><th>dark mode off</th><th>dark mode on</th></tr>
<tr><th>current version, 75%</th><td>45 fast</td><td>30 slow</td></tr>
<tr><th>the canary, 25%</th><td>5 fast</td><td>20 slow</td></tr>
</table>
<div class="callout attn"><b>What goes wrong.</b> The canary sees 80% of its requests slow against 40% on the current version, decides the fix is slow, and rolls it back, though the fix is fine and dark mode is the cause. The other way round, Verify's comparison of dark mode mixes two versions.</div>
<p><b>So they take turns:</b></p>
<ul>
<li>A flag cannot move to Share while a canary is in flight; the console says why.</li>
<li>If a canary starts while a flag is at Share, Verify sets those minutes aside and carries on after. A release never waits for a flag.</li>
<li>The generator turns its ids independently of the front door's split, so both versions get the same mix of on and off.</li>
<li>Only one flag is at Share at a time, so a comparison has one difference to explain.</li>
</ul>`,
  },
  {
    title: 'Everyone',
    tab: 'Everyone',
    nodes: ['visitors', 'preview', 'gen', 'checks', 'traefik', 'stable', 'flagd', 'flags', 'console'],
    edges: { vis: 'lit', gen: 'lit', pre: 'lit', ts: 'lit', cs: 'lit', ...SET },
    tags: { flags: 'dark-mode: everyone' },
    who: { visitors: 'lit', preview: 'lit', gen: 'lit', checks: 'lit' },
    body: `
<p>Verify's comparison found the two sides alike, so Martin switches dark mode on for everyone, giving his passkey again. Real visitors see it from their next page. Dark mode follows the browser's own setting, with no switch of its own, since a switch would keep a choice on the visitor's device.</p>
<p>A minute later, once the app has had time to take the move, the line closes the work item as <b>verified</b>, and its issue as completed. The flag stays Martin's: turning it off is still one move in the console.</p>
<p>From here dark mode is part of the shop like any other: if something goes wrong with it later, the senses notice and triage opens a ticket.</p>
<details><summary>In the docs</summary><p><a href="${DOCS}/RELEASE-AND-VERIFY.md#everyone">Everyone</a>.</p></details>`,
  },
  {
    title: 'The kill switch',
    tab: 'Off',
    nodes: ['visitors', 'traefik', 'stable', 'flagd', 'flags', 'console'],
    edges: { vis: 'unlit', ts: 'unlit', ...SET },
    tags: { flags: 'dark-mode: off', console: 'off' },
    who: { visitors: 'unlit', preview: 'unlit', gen: 'unlit', checks: 'unlit' },
    body: `
<p>At any stage Martin can turn a flag off, with a reason and no passkey. The admin service changes the switchboard, flagd sees it within seconds and tells the app, and everyone, previewers included, is back on the old look: no new version, no deploy, no rollback. Then the admin service asks each of the app's pods which switchboard it holds, and Martin's phone hears if one has not taken the change within a minute.</p>
<p><b>If flagd itself fails,</b> the app carries on with its own copy of the switchboard. But then an "off" could not reach it, so once its copy has gone a minute without word from flagd (two, if the connection died silently), the app treats every flag as off.</p>
<p><b>What it closes.</b> Turned off below Everyone, the work item closes as <b>turned off</b>, and its issue as not planned, with Martin's reason; the flag stays off for it. Turned off from Everyone, the work item stays verified and nothing more closes, and Martin may switch it straight back on. Either way it is not a rollback: no code moved.</p>
<details><summary>In the docs</summary><p><a href="${DOCS}/RELEASE-AND-VERIFY.md#off">Off</a>; <a href="${DOCS}/FEATURE-FLAGS.md#failing-off">failing off</a>; <a href="${DOCS}/ADMIN-SERVICE.md#whether-the-app-holds-the-flags">whether the app holds the flags</a>.</p></details>`,
  },
  {
    title: 'Who may touch the switches',
    tab: 'Guards',
    nodes: ['console', 'flags', 'flagd', 'argo', 'stable', 'traefik'],
    edges: { ...SET },
    tags: { argo: 'leaves them alone', flagd: 'reads only' },
    who: { visitors: 'unlit', preview: 'unlit', gen: 'unlit', checks: 'unlit' },
    body: `
<p>The switches are production state kept outside Git, so each is guarded:</p>
<ul>
<li><b>Only the admin service writes <code>flags</code>,</b> and the cluster holds each of its writes to the five stages' fixed shapes, and refuses deleting <code>flags</code>. A flag set there by hand in any other shape is turned off at the admin service's next write.</li>
<li><b>flagd only reads it,</b> and lives in a namespace of its own, which nothing the app's repository deploys can reach.</li>
<li><b>Argo CD makes the switchboard empty and leaves its switches alone,</b> or every merge would turn every flag off.</li>
<li><b>Only Martin can stage a flag or ask for an improvement:</b> both are admin events, which no worker's role may append. Asking for an improvement and approving its spec take his passkey again and reach his phone.</li>
<li><b>Widening needs his passkey again,</b> but from Off to Checks, which shows nobody but the factory's checks; narrowing and off never do, so the safe way is always one click.</li>
<li><b>The app's code cannot cheat.</b> Agents write the app, so the part that decides who is a check, a previewer or in a share changes only with Martin's approval, and no other part of the app may ask flagd anything. Verify judges a share from what the traffic generator measured, not from what the app says about itself.</li>
</ul>
<p>Every switch is an event, so the audit log is each flag's history.</p>
<details><summary>In the docs</summary><p><a href="${DOCS}/FEATURE-FLAGS.md#the-stages">The stages</a>, and <a href="adr/0015-feature-flags.md">why flags are built this way</a> (ADR 0015).</p></details>`,
  },
];

const WHO = [['visitors', 'Real visitors'], ['preview', 'Previewers'], ['gen', 'Fake visitors'], ['checks', "The factory's checks"]];
const WORD = { lit: 'Dark mode', unlit: 'Old look', half: 'Half of them' };

// Still when the reader asks for less motion, or picks STILL in the footer.
let still = new URLSearchParams(location.search).get('motion') === 'off' || matchMedia('(prefers-reduced-motion: reduce)').matches;
let at = 0;
const el = (tag, attrs, parent) => { const e = document.createElementNS(NS, tag); for (const [k, v] of Object.entries(attrs)) e.setAttribute(k, v); parent.appendChild(e); return e; };

function paint() {
  const step = STEPS[at];
  for (const id of ['edges', 'nodes', 'dotsL', 'tags']) $(id).replaceChildren();
  for (const [id, kind] of Object.entries(step.edges)) {
    const flow = kind === 'denied' ? 'f-denied' : `f-${kind}`;
    const p = el('path', { d: pathFor(id), id: `p-${id}`, class: `edge on ${flow}` }, $('edges'));
    const len = p.getTotalLength();
    const count = kind === 'set' ? 2 : 3;
    const stop = kind === 'denied' ? 0.55 : 1;
    for (let i = 0; i < count; i++) {
      const dk = kind === 'half' ? (i % 2 ? 'unlit' : 'lit') : kind;
      const r = { lit: 5, unlit: 4.5, req: 4, set: 3, denied: 4.5 }[dk];
      const c = el('circle', { r, class: `dot-${dk}` }, $('dotsL'));
      if (still) { const pt = p.getPointAtLength(len * stop * (i + 1) / (count + 1)); c.setAttribute('cx', pt.x); c.setAttribute('cy', pt.y); continue; }
      const dur = 2.4, begin = `${(-i * dur) / count}s`;
      const m = el('animateMotion', { dur: `${dur}s`, repeatCount: 'indefinite', begin, keyPoints: `0;${stop}`, keyTimes: '0;1', calcMode: 'linear' }, c);
      el('mpath', { href: `#p-${id}` }, m);
      if (kind === 'denied') el('animate', { attributeName: 'opacity', values: '1;1;0', keyTimes: '0;0.8;1', dur: `${dur}s`, repeatCount: 'indefinite', begin }, c);
    }
  }
  for (const [id, n] of Object.entries(NODES)) {
    const on = step.nodes.includes(id);
    const g = el('g', { class: `node${on ? '' : ' dim'}${n.canary && on ? ' canary' : ''}` }, $('nodes'));
    el('rect', { class: 'box', x: n.x, y: n.y, width: n.w, height: n.h, rx: 6 }, g);
    el('text', { class: 'name', x: n.x + 14, y: n.y + n.h / 2 - 3 }, g).textContent = n.t;
    el('text', { class: 'sub', x: n.x + 14, y: n.y + n.h / 2 + 15 }, g).textContent = n.s;
    const tag = step.tags?.[id];
    if (tag) {
      const tg = el('g', { class: 'ntag' }, $('tags'));
      const t = el('text', { x: 0, y: 0 }, tg); t.textContent = tag.toUpperCase();
      // The box's width comes from the text as drawn, letter-spacing and all.
      const w = t.getBBox().width + 20, x = n.x + n.w - w + 8, y = n.y - 11;
      t.setAttribute('x', x + 10); t.setAttribute('y', y + 15);
      tg.insertBefore(el('rect', { x, y, width: w, height: 21, rx: 3 }, tg), t);
    }
  }
}

function show(i) {
  at = Math.max(0, Math.min(STEPS.length - 1, i));
  const s = STEPS[at];
  paint();
  $('count').textContent = `Step ${at + 1} of ${STEPS.length}`;
  $('title').textContent = s.title;
  $('body').innerHTML = s.body;
  $('who').innerHTML = WHO.map(([k, label]) => `<div class="${s.who[k]}">${label}<b>${WORD[s.who[k]]}</b></div>`).join('');
  $('prev').disabled = at === 0;
  $('next').disabled = at === STEPS.length - 1;
  [...$('steps').children].forEach((b, j) => b.setAttribute('aria-selected', String(j === at)));
  try { history.replaceState(null, '', `${location.search}#${at + 1}`); } catch {}
}

STEPS.forEach((s, i) => {
  const b = document.createElement('button');
  b.type = 'button'; b.setAttribute('role', 'tab');
  b.textContent = s.tab;
  b.title = s.title;
  b.onclick = () => show(i);
  $('steps').appendChild(b);
});
$('prev').onclick = () => show(at - 1);
$('next').onclick = () => show(at + 1);
addEventListener('keydown', (e) => {
  if (e.target.closest('input, textarea')) return;
  if (e.key === 'ArrowRight') show(at + 1);
  if (e.key === 'ArrowLeft') show(at - 1);
});
const fromHash = () => show((parseInt(location.hash.slice(1), 10) || 1) - 1);
addEventListener('hashchange', fromHash);

/* ---------- theme and motion ---------- */
// Paper always comes first; Ink and motion are choices made on the page, not remembered.
function setTheme(t) {
  document.documentElement.dataset.theme = t;
  document.querySelectorAll('[data-theme-set]').forEach((b) => b.setAttribute('aria-pressed', String(b.dataset.themeSet === t)));
}
function setMotion(on) {
  still = !on;
  document.querySelectorAll('[data-motion]').forEach((b) => b.setAttribute('aria-pressed', String((b.dataset.motion === 'on') === on)));
}
document.querySelectorAll('[data-theme-set]').forEach((b) => (b.onclick = () => setTheme(b.dataset.themeSet)));
document.querySelectorAll('[data-motion]').forEach((b) => (b.onclick = () => { setMotion(b.dataset.motion === 'on'); paint(); }));
setTheme(new URLSearchParams(location.search).get('theme') === 'ink' ? 'ink' : 'paper');
setMotion(!still);
fromHash();
})();
</script>
</body>
</html>
