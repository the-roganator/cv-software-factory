# The whole toolchain: `mise install` sets up a laptop, and CI and the dev container use the same file. Each tool names
# the releases it may move within, and mise.lock holds the exact version of each, with the checksum of its download for
# each platform below, so every install is the same until someone upgrades. To upgrade, `mise upgrade` (within these
# ranges; `--bump` past them) and a `chore(toolchain)` pull request with both files; Dependabot does not read mise.
[settings]
lockfile = true
# A Mac (Apple Silicon or Intel), CI's runners, and the dev container on either kind of host.
lockfile_platforms = ["macos-arm64", "macos-x64", "linux-x64", "linux-arm64"]
# `mise upgrade` takes a release only once it is three days old, as Dependabot's cooldown does.
minimum_release_age = "3d"

[tools]
# Exact: the images' Node, which scripts/image-pins.test.ts holds them to.
node = "24.22.2"
pnpm = "12"
# Patch releases only, within the version skew k3d's Kubernetes allows.
kubectl = "1.37"
k3d = "5"
helm = "4"
kustomize = "5"
# What the deploy pull requests' checks verify images with (check.yml), and `make admission-ready` too.
cosign = "3"
# The kubectl plugin for watching and promoting the website's canary (`kubectl argo rollouts`), at the version of the
# controller in deploy/base/rollouts: patch releases only.
argo-rollouts = "1.10"
# Argo CD's CLI, for what its automatic sync does not do (pausing an Application, ending a stuck operation, a selective
# sync), with `--core` through the kube context and no login, at the version of the server the Makefile's ARGOCD_CHART
# runs: patch releases only.
argocd = "3.6"
# The local certificate authority `make up` makes for https://console.localhost:8443, constrained to `localhost` names
# (mkcert cannot constrain one), and the tests that hold it to them.
step = "0"
# Prometheus's rule tester, at the version of the server the Prometheus chart runs, for the tests that run the alerts to
# Martin as Prometheus would (apps/factory/test/flag-alerts.test.ts): patch releases only.
promtool = "3.15"
# GitHub's CLI, for the skills' scripts (.claude/skills/*/bin) and some workflows' steps.
gh = "2"
# YAML read as JSON, by the vulnerability scan's scripts (apps/factory/src/vulnerabilities), which run with no
# dependencies from a sparse checkout, as on the runners, whose image carries yq 4.
yq = "4"
