# Source: opentelemetry-collector/templates/configmap.yaml
apiVersion: v1
kind: ConfigMap
metadata:
  name: otel-collector
  namespace: default
  labels:
    helm.sh/chart: opentelemetry-collector-0.178.3
    app.kubernetes.io/name: opentelemetry-collector
    app.kubernetes.io/instance: otel-collector
    app.kubernetes.io/version: "0.163.2"
    app.kubernetes.io/managed-by: Helm
    app.kubernetes.io/part-of: opentelemetry-collector
    app.kubernetes.io/component: standalone-collector
data:
  relay: |
    connectors:
      count/browsers:
        spans:
          http.server.browser.requests:
            attributes:
            - key: browser.name
            - key: os.name
            - key: device.type
            - key: traffic
            conditions:
            - span.kind == SPAN_KIND_SERVER and span.attributes["browser.name"] != nil
              and (resource.attributes["service.name"] == "website" or resource.attributes["service.name"]
              == "console")
            description: Requests to the app and the console from browsers, by browser
              family, operating system and device class.
    exporters:
      debug: {}
      otlp_http/loki:
        endpoint: http://loki:3100/otlp
      otlp_http/prometheus:
        endpoint: http://prometheus-server/api/v1/otlp
      otlp_http/tempo:
        endpoint: http://tempo:4318
    extensions:
      health_check:
        endpoint: ${env:MY_POD_IP}:13133
    processors:
      attributes/drop-pod-claims:
        actions:
        - action: delete
          pattern: ^k8s[^a-zA-Z0-9]+(pod|namespace)[^a-zA-Z0-9]
      batch: {}
      delta_to_cumulative:
        max_stale: 25h
      filter/scraped-names:
        error_mode: propagate
        metrics:
          metric:
          - IsMatch(name, "^(pg|kube|argocd)([^a-zA-Z0-9]|$)")
      k8s_attributes:
        extract:
          labels:
          - from: pod
            key: rollouts-pod-template-hash
            tag_name: k8s.pod.label.rollouts-pod-template-hash
          metadata:
          - k8s.pod.name
        filter:
          namespace: website
        pod_association:
        - sources:
          - from: connection
      k8s_attributes/factory:
        extract:
          labels:
          - from: pod
            key: app.kubernetes.io/name
            tag_name: k8s.pod.label.app.kubernetes.io/name
          metadata:
          - k8s.namespace.name
        filter:
          namespace: factory
        pod_association:
        - sources:
          - from: connection
      memory_limiter:
        check_interval: 5s
        limit_percentage: 80
        spike_limit_percentage: 25
      resource/drop-pod-claims:
        attributes:
        - action: delete
          pattern: ^k8s[^a-zA-Z0-9]+(pod|namespace)[^a-zA-Z0-9]
      transform/browser-count-now:
        metric_statements:
        - statements:
          - set(datapoint.start_time, Now())
          - set(datapoint.time, Now())
      transform/visitors:
        error_mode: ignore
        log_statements:
        - statements:
          - delete_matching_keys(log.attributes, "^(browser\\.(name|major)|os\\.name|device\\.type|traffic)$")
          - delete_matching_keys(log.attributes, "^(user_agent\\.original|http\\.user_agent)$")
          - delete_matching_keys(log.attributes, "^(client\\.(address|port)|network\\.peer\\.(address|port)|net\\.peer\\.(ip|port|name)|net\\.sock\\.peer\\.(addr|port)|http\\.client_ip|http\\.request\\.header\\..+)$")
        trace_statements:
        - statements:
          - delete_matching_keys(span.attributes, "^(browser\\.(name|major)|os\\.name|device\\.type|traffic)$")
          - set(span.cache["agent"], span.attributes["user_agent.original"]) where span.kind
            == SPAN_KIND_SERVER
          - set(span.cache["agent"], span.attributes["http.user_agent"]) where span.kind
            == SPAN_KIND_SERVER and span.cache["agent"] == nil
          - set(span.cache["ua"], UserAgent(span.cache["agent"])) where span.cache["agent"]
            != nil
          - set(span.attributes["browser.name"], "other") where span.cache["agent"] !=
            nil
          - set(span.attributes["browser.name"], "Edge") where IsMatch(span.cache["ua"]["user_agent.name"],
            "^Edge( Mobile)?$")
          - set(span.attributes["browser.name"], "Chrome") where IsMatch(span.cache["ua"]["user_agent.name"],
            "^(Chrome( Mobile( iOS| WebView)?)?|Chromium)$")
          - set(span.attributes["browser.name"], "Firefox") where IsMatch(span.cache["ua"]["user_agent.name"],
            "^Firefox( Mobile| iOS)?$")
          - set(span.attributes["browser.name"], "Safari") where IsMatch(span.cache["ua"]["user_agent.name"],
            "^(Mobile )?Safari$")
          - set(span.attributes["browser.major"], ExtractPatterns(span.cache["ua"]["user_agent.version"],
            "^(?P<major>[0-9]{1,4})")["major"]) where span.attributes["browser.name"]
            != nil and span.attributes["browser.name"] != "other"
          - set(span.attributes["os.name"], "other") where span.cache["agent"] != nil
          - set(span.attributes["os.name"], "macOS") where span.cache["ua"]["os.name"]
            == "Mac OS X"
          - set(span.attributes["os.name"], "iOS") where span.cache["ua"]["os.name"] ==
            "iOS"
          - set(span.attributes["os.name"], "Android") where span.cache["ua"]["os.name"]
            == "Android"
          - set(span.attributes["os.name"], "Windows") where span.cache["ua"]["os.name"]
            == "Windows"
          - set(span.attributes["os.name"], "ChromeOS") where span.cache["ua"]["os.name"]
            == "Chrome OS"
          - set(span.attributes["os.name"], "Linux") where IsMatch(span.cache["ua"]["os.name"],
            "^(Linux|Ubuntu|Debian|Fedora|Red Hat|SUSE|openSUSE|Mint|Arch Linux|Gentoo)$")
          - set(span.attributes["device.type"], "desktop") where span.cache["agent"] !=
            nil
          - set(span.attributes["device.type"], "mobile") where span.cache["agent"] !=
            nil and IsMatch(span.cache["agent"], "Mobi|Android|iPhone|iPad|iPod")
          - set(span.attributes["traffic"], "visitor") where span.cache["agent"] != nil
          - set(span.attributes["traffic"], "factory") where span.cache["agent"] == "software-factory-traffic"
          - delete_matching_keys(span.attributes, "^(user_agent\\.original|http\\.user_agent)$")
          - delete_matching_keys(span.attributes, "^(client\\.(address|port)|network\\.peer\\.(address|port)|net\\.peer\\.(ip|port|name)|net\\.sock\\.peer\\.(addr|port)|http\\.client_ip|http\\.request\\.header\\..+)$")
    receivers:
      otlp:
        protocols:
          grpc:
            endpoint: ${env:MY_POD_IP}:4317
          http:
            endpoint: ${env:MY_POD_IP}:4318
    service:
      extensions:
      - health_check
      pipelines:
        logs:
          exporters:
          - otlp_http/loki
          processors:
          - memory_limiter
          - resource/drop-pod-claims
          - attributes/drop-pod-claims
          - k8s_attributes
          - transform/visitors
          - batch
          receivers:
          - otlp
        metrics:
          exporters:
          - otlp_http/prometheus
          processors:
          - memory_limiter
          - filter/scraped-names
          - resource/drop-pod-claims
          - attributes/drop-pod-claims
          - k8s_attributes
          - k8s_attributes/factory
          - batch
          receivers:
          - otlp
        metrics/browsers:
          exporters:
          - otlp_http/prometheus
          processors:
          - memory_limiter
          - transform/browser-count-now
          - delta_to_cumulative
          - batch
          receivers:
          - count/browsers
        traces:
          exporters:
          - otlp_http/tempo
          - count/browsers
          processors:
          - memory_limiter
          - resource/drop-pod-claims
          - attributes/drop-pod-claims
          - k8s_attributes
          - transform/visitors
          - batch
          receivers:
          - otlp
      telemetry:
        metrics:
          readers:
          - pull:
              exporter:
                prometheus:
                  host: ${env:MY_POD_IP}
                  port: 8888
        resource:
          attributes:
          - name: host.name
            value: ${env:OTEL_K8S_NODE_NAME}
          - name: k8s.namespace.name
            value: ${env:OTEL_K8S_NAMESPACE}
          - name: k8s.node.ip
            value: ${env:OTEL_K8S_NODE_IP}
          - name: k8s.node.name
            value: ${env:OTEL_K8S_NODE_NAME}
          - name: k8s.pod.ip
            value: ${env:OTEL_K8S_POD_IP}
          - name: k8s.pod.name
            value: ${env:OTEL_K8S_POD_NAME}

