# Source: prometheus/templates/cm.yaml
apiVersion: v1
kind: ConfigMap
metadata:
  labels:
    app.kubernetes.io/component: server
    app.kubernetes.io/name: prometheus
    app.kubernetes.io/instance: prometheus
    app.kubernetes.io/version: v3.15.0
    helm.sh/chart: prometheus-29.35.0
    app.kubernetes.io/part-of: prometheus
  name: prometheus-server
  namespace: telemetry
data:
  allow-snippet-annotations: "false"
  alerting_rules.yml: |
    groups:
    - name: objectives
      rules:
      - alert: RouteErrorRatioAboveObjective
        annotations:
          description: Over 15 minutes, with at least 20 requests.
          summary: '{{ $labels.http_route }}: more than 5% of requests answered with a
            5xx status'
          threshold: "0.05"
        expr: (((sum by (http_route) (rate(http_server_request_duration_seconds_count{job="worlds-worst-website/website",
          k8s_pod_label_rollouts_pod_template_hash!="", http_route!="", http_response_status_code=~"5.."}[15m]))
          or sum by (http_route) (rate(http_server_request_duration_seconds_count{job="worlds-worst-website/website",
          k8s_pod_label_rollouts_pod_template_hash!="", http_route!=""}[15m])) * 0) /
          sum by (http_route) (rate(http_server_request_duration_seconds_count{job="worlds-worst-website/website",
          k8s_pod_label_rollouts_pod_template_hash!="", http_route!=""}[15m]))) and on
          (http_route) (sum by (http_route) (increase(http_server_request_duration_seconds_count{job="worlds-worst-website/website",
          k8s_pod_label_rollouts_pod_template_hash!="", http_route!=""}[15m])) >= 20))
          > 0.05
        for: 2m
        labels:
          objective: error-ratio
          route: '{{ $labels.http_route }}'
          symptom: server-error
      - alert: RouteLatencyAboveObjective
        annotations:
          description: Over 15 minutes, with at least 20 requests.
          summary: '{{ $labels.http_route }}: p95 latency above 1 s'
          threshold: "1"
        expr: (histogram_quantile(0.95, sum by (le, http_route) (rate(http_server_request_duration_seconds_bucket{job="worlds-worst-website/website",
          k8s_pod_label_rollouts_pod_template_hash!="", http_route!=""}[15m]))) and on
          (http_route) (sum by (http_route) (increase(http_server_request_duration_seconds_count{job="worlds-worst-website/website",
          k8s_pod_label_rollouts_pod_template_hash!="", http_route!=""}[15m])) >= 20))
          > 1
        for: 2m
        labels:
          objective: latency
          route: '{{ $labels.http_route }}'
          symptom: slow-response
    - name: martin
      rules:
      - alert: SecurityEvent
        annotations:
          description: A passkey signed in to the console.
          summary: Signed in as Martin
        expr: max(increase(line_security_events_total{kind="sign-in", k8s_namespace_name="factory",
          k8s_pod_label_app_kubernetes_io_name="line"}[5m])) > 0
        for: 0s
        labels:
          kind: sign-in
          level: inform
      - alert: SecurityEvent
        annotations:
          description: A new passkey can sign in as Martin.
          summary: A passkey was enrolled
        expr: max(increase(line_security_events_total{kind="passkey-enrolled", k8s_namespace_name="factory",
          k8s_pod_label_app_kubernetes_io_name="line"}[5m])) > 0
        for: 0s
        labels:
          kind: passkey-enrolled
          level: page
      - alert: SecurityEvent
        annotations:
          description: A passkey can no longer sign in as Martin.
          summary: A passkey was revoked
        expr: max(increase(line_security_events_total{kind="passkey-revoked", k8s_namespace_name="factory",
          k8s_pod_label_app_kubernetes_io_name="line"}[5m])) > 0
        for: 0s
        labels:
          kind: passkey-revoked
          level: page
      - alert: SecurityEvent
        annotations:
          description: An agent's model or effort, or a spend cap, was changed in the
            console.
          summary: A setting was changed
        expr: max(increase(line_security_events_total{kind="setting-changed", k8s_namespace_name="factory",
          k8s_pod_label_app_kubernetes_io_name="line"}[5m])) > 0
        for: 0s
        labels:
          kind: setting-changed
          level: notify
      - alert: SecurityEvent
        annotations:
          description: The app's canary was promoted, or a stopped release retried, from
            the console.
          summary: A release was promoted or retried
        expr: max(increase(line_security_events_total{kind="release-control", k8s_namespace_name="factory",
          k8s_pod_label_app_kubernetes_io_name="line"}[5m])) > 0
        for: 0s
        labels:
          kind: release-control
          level: notify
      - alert: SecurityEvent
        annotations:
          description: A hold whose cause is a guardrail was approved.
          summary: A guardrail was overridden
        expr: max(increase(line_security_events_total{kind="guardrail-approved", k8s_namespace_name="factory",
          k8s_pod_label_app_kubernetes_io_name="line"}[5m])) > 0
        for: 0s
        labels:
          kind: guardrail-approved
          level: page
      - alert: SecurityEvent
        annotations:
          description: The line takes work again.
          summary: The line was started
        expr: max(increase(line_security_events_total{kind="line-started", k8s_namespace_name="factory",
          k8s_pod_label_app_kubernetes_io_name="line"}[5m])) > 0
        for: 0s
        labels:
          kind: line-started
          level: notify
      - alert: SecurityEvent
        annotations:
          description: The line takes no work until it is started again.
          summary: The line was stopped
        expr: max(increase(line_security_events_total{kind="line-stopped", k8s_namespace_name="factory",
          k8s_pod_label_app_kubernetes_io_name="line"}[5m])) > 0
        for: 0s
        labels:
          kind: line-stopped
          level: inform
      - alert: SecurityEvent
        annotations:
          description: The line's autonomy level was made looser in the console.
          summary: Autonomy was loosened
        expr: max(increase(line_security_events_total{kind="autonomy-loosened", k8s_namespace_name="factory",
          k8s_pod_label_app_kubernetes_io_name="line"}[5m])) > 0
        for: 0s
        labels:
          kind: autonomy-loosened
          level: page
      - alert: SecurityEvent
        annotations:
          description: The line's autonomy level was made stricter in the console.
          summary: Autonomy was tightened
        expr: max(increase(line_security_events_total{kind="autonomy-tightened", k8s_namespace_name="factory",
          k8s_pod_label_app_kubernetes_io_name="line"}[5m])) > 0
        for: 0s
        labels:
          kind: autonomy-tightened
          level: notify
      - alert: SecurityEvent
        annotations:
          description: Agents were let take new work in the console.
          summary: Agents take new work again
        expr: max(increase(line_security_events_total{kind="new-work-on", k8s_namespace_name="factory",
          k8s_pod_label_app_kubernetes_io_name="line"}[5m])) > 0
        for: 0s
        labels:
          kind: new-work-on
          level: notify
      - alert: SecurityEvent
        annotations:
          description: Agents were stopped taking new work in the console.
          summary: Agents take no new work
        expr: max(increase(line_security_events_total{kind="new-work-off", k8s_namespace_name="factory",
          k8s_pod_label_app_kubernetes_io_name="line"}[5m])) > 0
        for: 0s
        labels:
          kind: new-work-off
          level: inform
      - alert: SecurityEvent
        annotations:
          description: Auto-merge of low-risk changes was turned on in the console.
          summary: Auto-merge was turned on
        expr: max(increase(line_security_events_total{kind="auto-merge-on", k8s_namespace_name="factory",
          k8s_pod_label_app_kubernetes_io_name="line"}[5m])) > 0
        for: 0s
        labels:
          kind: auto-merge-on
          level: notify
      - alert: SecurityEvent
        annotations:
          description: Auto-merge of low-risk changes was turned off in the console.
          summary: Auto-merge was turned off
        expr: max(increase(line_security_events_total{kind="auto-merge-off", k8s_namespace_name="factory",
          k8s_pod_label_app_kubernetes_io_name="line"}[5m])) > 0
        for: 0s
        labels:
          kind: auto-merge-off
          level: inform
      - alert: SecurityEvent
        annotations:
          description: What the line takes was widened in the console.
          summary: The line takes more
        expr: max(increase(line_security_events_total{kind="take-widened", k8s_namespace_name="factory",
          k8s_pod_label_app_kubernetes_io_name="line"}[5m])) > 0
        for: 0s
        labels:
          kind: take-widened
          level: notify
      - alert: SecurityEvent
        annotations:
          description: What the line takes was narrowed in the console.
          summary: The line takes less
        expr: max(increase(line_security_events_total{kind="take-narrowed", k8s_namespace_name="factory",
          k8s_pod_label_app_kubernetes_io_name="line"}[5m])) > 0
        for: 0s
        labels:
          kind: take-narrowed
          level: inform
      - alert: SecurityEvent
        annotations:
          description: 'Auto-rollback was turned off in the console: a canary whose errors
            or latency the analysis judges bad now pauses for you to promote or abort,
            rather than rolling back by itself. A failed journeys check still rolls it
            back, and Stop the line still aborts one.'
          summary: Auto-rollback was turned off
        expr: max(increase(line_security_events_total{kind="auto-rollback-off", k8s_namespace_name="factory",
          k8s_pod_label_app_kubernetes_io_name="line"}[5m])) > 0
        for: 0s
        labels:
          kind: auto-rollback-off
          level: page
      - alert: SecurityEvent
        annotations:
          description: 'Auto-rollback was turned on in the console: a canary the analysis
            judges bad rolls back by itself. One already paused for you stays paused until
            you promote or abort it.'
          summary: Auto-rollback was turned on
        expr: max(increase(line_security_events_total{kind="auto-rollback-on", k8s_namespace_name="factory",
          k8s_pod_label_app_kubernetes_io_name="line"}[5m])) > 0
        for: 0s
        labels:
          kind: auto-rollback-on
          level: inform
      - alert: SecurityEvent
        annotations:
          description: A feature flag's stage was widened in the console, or a flag turned
            back on for everyone.
          summary: A feature flag was widened
        expr: max(increase(line_security_events_total{kind="flag-widened", k8s_namespace_name="factory",
          k8s_pod_label_app_kubernetes_io_name="line"}[5m])) > 0
        for: 0s
        labels:
          kind: flag-widened
          level: notify
      - alert: SecurityEvent
        annotations:
          description: A feature flag's stage was narrowed in the console.
          summary: A feature flag was narrowed
        expr: max(increase(line_security_events_total{kind="flag-narrowed", k8s_namespace_name="factory",
          k8s_pod_label_app_kubernetes_io_name="line"}[5m])) > 0
        for: 0s
        labels:
          kind: flag-narrowed
          level: inform
      - alert: SecurityEvent
        annotations:
          description: A feature flag was turned off for everyone in the console.
          summary: A feature flag was turned off
        expr: max(increase(line_security_events_total{kind="flag-off", k8s_namespace_name="factory",
          k8s_pod_label_app_kubernetes_io_name="line"}[5m])) > 0
        for: 0s
        labels:
          kind: flag-off
          level: inform
      - alert: SecurityEvent
        annotations:
          description: An improvement was asked for in the console, with the passkey given
            again.
          summary: An improvement was asked for
        expr: max(increase(line_security_events_total{kind="improvement-requested", k8s_namespace_name="factory",
          k8s_pod_label_app_kubernetes_io_name="line"}[5m])) > 0
        for: 0s
        labels:
          kind: improvement-requested
          level: notify
      - alert: SecurityEvent
        annotations:
          description: 'An improvement''s spec was approved in the console: the line will
            build it.'
          summary: An improvement's spec was approved
        expr: max(increase(line_security_events_total{kind="improvement-approved", k8s_namespace_name="factory",
          k8s_pod_label_app_kubernetes_io_name="line"}[5m])) > 0
        for: 0s
        labels:
          kind: improvement-approved
          level: notify
      - alert: SecurityEvent
        annotations:
          description: 'Your answer to a hold on a work item a visitor''s report opened
            was shared in the console, with the passkey given again: the agents read it,
            and it is public.'
          summary: Your words on a visitor's report were shared
        expr: max(increase(line_security_events_total{kind="words-shared", k8s_namespace_name="factory",
          k8s_pod_label_app_kubernetes_io_name="line"}[5m])) > 0
        for: 0s
        labels:
          kind: words-shared
          level: notify
      - alert: SecurityEvent
        annotations:
          description: 'Alerts to your phone were switched on in the console: every alert
            reaches it, at its level.'
          summary: Alerts reach your phone again
        expr: max(increase(line_security_events_total{kind="phone-on", k8s_namespace_name="factory",
          k8s_pod_label_app_kubernetes_io_name="line"}[5m])) > 0
        for: 0s
        labels:
          kind: phone-on
          level: inform
      - alert: SecurityEvent
        annotations:
          description: 'Alerts to your phone were switched off in the console: none reaches
            it until they are switched on again. Grafana''s Alerts dashboard still shows
            every alert.'
          summary: Alerts no longer reach your phone
        expr: max(increase(line_security_events_total{kind="phone-off", k8s_namespace_name="factory",
          k8s_pod_label_app_kubernetes_io_name="line"}[5m])) > 0
        for: 0s
        labels:
          kind: phone-off
          level: page
      - alert: SecurityEvent
        annotations:
          description: A proof make guardrails took did not hold, so its guardrail may
            not be holding. make guardrails said which, and why, and the audit log records
            it.
          summary: A guardrail did not hold
        expr: max(increase(line_security_events_total{kind="guardrail-not-held", k8s_namespace_name="factory",
          k8s_pod_label_app_kubernetes_io_name="line"}[5m])) > 0
        for: 0s
        labels:
          kind: guardrail-not-held
          level: page
      - alert: SecurityEvent
        annotations:
          description: 'An attack you launched from the console got through: an attempt
            it made was not refused, so its guardrail did not hold. Its card shows each
            attempt and what came back, and the line’s log says which.'
          summary: A red-team attack was not refused
        expr: max(increase(line_security_events_total{kind="attack-not-refused", k8s_namespace_name="factory",
          k8s_pod_label_app_kubernetes_io_name="line"}[5m])) > 0
        for: 0s
        labels:
          kind: attack-not-refused
          level: page
      - alert: SecurityEvent
        annotations:
          description: An attack you launched from the console was not seen to its end
            within its limit, so it proves nothing. The red-team harness’s log says why;
            you can launch it again.
          summary: A red-team attack did not finish
        expr: max(increase(line_security_events_total{kind="attack-unfinished", k8s_namespace_name="factory",
          k8s_pod_label_app_kubernetes_io_name="line"}[5m])) > 0
        for: 0s
        labels:
          kind: attack-unfinished
          level: page
      - alert: SecurityEvent
        annotations:
          description: 'The harness says an attack you launched was refused, but the line,
            reading the refusals it cites again, cannot agree: one is missing, by another
            mechanism, from a role that may not record it, unverified, or about something
            else. The line’s log says why.'
          summary: A red-team attack was not refused as it should be
        expr: max(increase(line_security_events_total{kind="attack-wrong-mechanism", k8s_namespace_name="factory",
          k8s_pod_label_app_kubernetes_io_name="line"}[5m])) > 0
        for: 0s
        labels:
          kind: attack-wrong-mechanism
          level: page
      - alert: SecurityEventsUncounted
        annotations:
          description: The line has not counted sign-ins and the rest for some minutes,
            so none of them would reach you.
          summary: Security events are not being counted
        expr: (count(last_over_time(line_security_events_total{k8s_namespace_name="factory",
          k8s_pod_label_app_kubernetes_io_name="line"}[6h])) unless count(line_security_events_total{k8s_namespace_name="factory",
          k8s_pod_label_app_kubernetes_io_name="line"})) or max(line_security_events_counting{k8s_namespace_name="factory",
          k8s_pod_label_app_kubernetes_io_name="line"}) == 0
        for: 5m
        labels:
          level: page
          worker: line
      - alert: AdminActionUncounted
        annotations:
          description: 'flagd''s flags hold a stage or a revision that no move of yours
            recorded: they were changed outside the console, or the admin service changed
            them without recording it. The console''s Flags panel shows each flag''s stage
            as it is: move each that differs there, which records it, and look in the
            admin service''s log.'
          summary: The flags changed with no record
        expr: max by (action) (last_over_time(line_admin_actions_uncounted{action="flags",
          k8s_namespace_name="factory", k8s_pod_label_app_kubernetes_io_name="line"}[1m]))
          == 1
        for: 2m
        labels:
          level: page
      - alert: AdminActionUncounted
        annotations:
          description: 'The app''s Rollout was paused, resumed or promoted fully with
            no control of yours recorded: outside the Canary panel, or by the admin service
            without recording it. The Canary panel shows it as it is: act there, which
            records it, and look in the admin service''s log.'
          summary: The app's Rollout changed with no record
        expr: max by (action) (last_over_time(line_admin_actions_uncounted{action="rollout",
          k8s_namespace_name="factory", k8s_pod_label_app_kubernetes_io_name="line"}[1m]))
          == 1
        for: 2m
        labels:
          level: page
      - alert: AdminActionUncounted
        annotations:
          description: 'The store holds a session of the last hour that no sign-in recorded:
            someone made it outside the admin service’s sign-in, or the admin service
            did without recording it. End every session with make enrol REVOKE_OTHERS=1,
            then enrol your passkey again. This ends an hour after the session started.'
          summary: A session started with no sign-in
        expr: max by (action) (last_over_time(line_admin_actions_uncounted{action="sessions",
          k8s_namespace_name="factory", k8s_pod_label_app_kubernetes_io_name="line"}[1m]))
          == 1
        for: 2m
        labels:
          level: page
      - alert: AdminActionUncounted
        annotations:
          description: For ten minutes the line has not been able to compare the flags'
            stages with the events that record them, so a change none records would not
            reach you. The line’s log says why.
          summary: The line is not comparing the flags' stages
        expr: max by (action) (last_over_time(line_admin_actions_compared{action="flags",
          k8s_namespace_name="factory", k8s_pod_label_app_kubernetes_io_name="line"}[1m]))
          == 0
        for: 10m
        labels:
          level: page
          worker: line
      - alert: AdminActionUncounted
        annotations:
          description: For ten minutes the line has not been able to compare the app's
