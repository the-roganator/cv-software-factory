# Source: prometheus/charts/alertmanager/templates/configmap.yaml
apiVersion: v1
kind: ConfigMap
metadata:
  name: prometheus-alertmanager
  labels:
    helm.sh/chart: alertmanager-2.0.1
    app.kubernetes.io/name: alertmanager
    app.kubernetes.io/instance: prometheus
    app.kubernetes.io/version: "v0.34.1"
    app.kubernetes.io/managed-by: Helm
  namespace: telemetry
data:
  alertmanager.yml: |
    global: {}
    inhibit_rules:
    - source_matchers:
      - alertname="StoreDown"
      target_matchers:
      - alertname=~"LineStuck|LeaseOverrun|WorkerCrashLooping|SecurityEventsUncounted|AdminActionUncounted"
    - source_matchers:
      - alertname="StoreDown"
      target_matchers:
      - alertname="ArgoCDDegraded"
      - name="root"
    - source_matchers:
      - alertname="SpendCapReached"
      target_matchers:
      - alertname="LineStuck"
    - equal:
      - worker
      source_matchers:
      - alertname="WorkerCrashLooping"
      target_matchers:
      - alertname!="WorkerCrashLooping"
      - worker=~".+"
    - source_matchers:
      - alertname="WorkerCrashLooping"
      target_matchers:
      - alertname="ArgoCDDegraded"
      - name="root"
    - source_matchers:
      - alertname="PhoneOff"
      target_matchers:
      - level=~"page|notify|inform"
      - kind!~"phone-off|phone-on"
    receivers:
    - name: dashboard
    - name: intake
      webhook_configs:
      - send_resolved: false
        url: http://intake.factory.svc:8080/v1/alerts
    - name: page
      pushover_configs:
      - html: true
        message: '{{ template "martin.message" . }}'
        priority: "1"
        send_resolved: false
        title: '{{ or .CommonAnnotations.summary .CommonLabels.alertname }}'
        token_file: /etc/pushover/app-token
        url: ""
        user_key_file: /etc/pushover/user-key
    - name: notify
      pushover_configs:
      - html: true
        message: '{{ template "martin.message" . }}'
        priority: "0"
        send_resolved: false
        title: '{{ or .CommonAnnotations.summary .CommonLabels.alertname }}'
        token_file: /etc/pushover/app-token
        url: ""
        user_key_file: /etc/pushover/user-key
    - name: inform
      pushover_configs:
      - html: true
        message: '{{ template "martin.message" . }}'
        priority: "-1"
        send_resolved: false
        title: '{{ or .CommonAnnotations.summary .CommonLabels.alertname }}'
        token_file: /etc/pushover/app-token
        url: ""
        user_key_file: /etc/pushover/user-key
    route:
      group_interval: 1m
      group_wait: 10s
      receiver: dashboard
      repeat_interval: 4h
      routes:
      - group_by:
        - route
        - objective
        matchers:
        - objective=~".+"
        - level=""
        receiver: intake
        repeat_interval: 1h
      - group_by:
        - '...'
        matchers:
        - level="page"
        receiver: page
      - group_by:
        - '...'
        matchers:
        - level="notify"
        receiver: notify
      - group_by:
        - '...'
        matchers:
        - level="inform"
        receiver: inform
    templates:
    - /etc/alertmanager/*.tmpl
  martin.tmpl: |-
    {{ define "martin.message" }}{{ range .Alerts.Firing }}{{ or .Annotations.description .Annotations.summary .Labels.alertname }}
    Firing since {{ .StartsAt.UTC.Format "15:04 UTC, 2 January" }}.{{ with .Labels.work_item }}{{ if match "^[1-9][0-9]*$" . }}
    <a href="{{ template "console.origin" }}/?item={{ . }}&sheet">#{{ . }} in the console</a>{{ end }}{{ end }}{{ $deploy := eq .Labels.cause "deploy" }}{{ with .Labels.pull_request }}{{ if match "^[1-9][0-9]*$" . }} · <a href="https://github.com/the-roganator/cv-worlds-worst-website/pull/{{ . }}">{{ if $deploy }}Deploy{{ else }}Pull request{{ end }} #{{ . }}</a>{{ end }}{{ end }}{{ end }}{{ end }}
  profile.tmpl: |-
    {{ define "console.origin" }}https://console.localhost:8443{{ end }}

