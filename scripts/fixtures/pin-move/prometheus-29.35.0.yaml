          description: 'Its container logs on the node may hold a visitor''s report, and
            they go only with the pod. Release the shop (merge a pending update, or its
            deploy pull request), so a new pod replaces it before a report in its logs
            is 30 days old. With none pending, restart its Rollout: with one replica,
            the shop is down until the new pod is ready.'
          summary: The shop's pod is 25 days old
        expr: max by (pod) (time() - kube_pod_start_time{namespace="website"}) > 2160000
          and on (pod) (max by (pod) (kube_pod_owner{namespace="website", owner_kind="ReplicaSet"})
          and on (pod) max by (pod) (kube_pod_status_phase{namespace="website", phase="Running"}
          == 1))
        for: 1h
        labels:
          level: notify
    - name: flags
      rules:
      - alert: FlagsNotTaken
        annotations:
          description: 'A minute after you narrowed a flag or turned one off, the admin
            service has not seen every pod of the app hold the flags as you set them,
            or could not ask them: the app may still show the feature to those you took
            it from. Restart flagd, which reads them again as it starts.'
          summary: The app has not been seen to take a flag you narrowed
        expr: max(admin_flags_narrowing_seconds{k8s_namespace_name="factory", k8s_pod_label_app_kubernetes_io_name="admin"})
          > 60
        for: 0s
        labels:
          level: page
      - alert: FlagsDiffer
        annotations:
          description: 'For more than 5 minutes a pod of the app has held other flags
            than the ones set: flagd may have stopped watching them. Restart flagd, which
            reads them again as it starts.'
          summary: The app does not hold the flags as set
        expr: max(admin_flags_differing_seconds{k8s_namespace_name="factory", k8s_pod_label_app_kubernetes_io_name="admin"})
          > 300 and on () max(max_over_time(admin_flags_checked{k8s_namespace_name="factory",
          k8s_pod_label_app_kubernetes_io_name="admin"}[5m])) == 1
        for: 0s
        labels:
          level: notify
      - alert: FlagsUnchecked
        annotations:
          description: For more than 5 minutes the admin service has not been able to
            ask every pod of the app which flags it holds, so a change of a flag that
            did not reach the app would not be told.
          summary: The flags the app holds are not being checked
        expr: max(admin_flags_differing_seconds{k8s_namespace_name="factory", k8s_pod_label_app_kubernetes_io_name="admin"})
          > 300 and on () max(max_over_time(admin_flags_checked{k8s_namespace_name="factory",
          k8s_pod_label_app_kubernetes_io_name="admin"}[5m])) == 0
        for: 0s
        labels:
          level: notify
          worker: admin
      - alert: FlagsUnchecked
        annotations:
          description: For more than 5 minutes the admin service has not been able to
            ask every pod of the app which flags it holds, so a change of a flag that
            did not reach the app would not be told.
          summary: The flags the app holds are not being checked
        expr: max(last_over_time(admin_flags_set{k8s_namespace_name="factory", k8s_pod_label_app_kubernetes_io_name="admin"}[6h]))
          == 1 unless on () count(admin_flags_set{k8s_namespace_name="factory", k8s_pod_label_app_kubernetes_io_name="admin"})
        for: 0s
        labels:
          level: notify
          worker: admin
    - name: factory
      rules:
      - alert: ConsoleDown
        annotations:
          description: 'For two minutes the probes have had no answer from the console
            at {{ $labels.address }}: you cannot see or steer the factory there.'
          summary: The console is not answering
        expr: max by (address) (increase(probes_checks_total{target="console", outcome="answered",
          k8s_namespace_name="factory", k8s_pod_label_app_kubernetes_io_name="probes"}[2m]))
          == 0 and on (address) max by (address) (increase(probes_checks_total{target="console",
          outcome="failed", k8s_namespace_name="factory", k8s_pod_label_app_kubernetes_io_name="probes"}[2m]))
          > 0 and on (address) max by (address) (count_over_time(probes_checks_total{target="console",
          k8s_namespace_name="factory", k8s_pod_label_app_kubernetes_io_name="probes"}[1m]))
          > 0
        for: 1m
        keep_firing_for: 10m
        labels:
          level: page
          worker: console
      - alert: AppDown
        annotations:
          description: 'For two minutes the probes have had no answer from the app at
            {{ $labels.address }}: visitors see nothing.'
          summary: The app is not answering
        expr: max by (address) (increase(probes_checks_total{target="app", outcome="answered",
          k8s_namespace_name="factory", k8s_pod_label_app_kubernetes_io_name="probes"}[2m]))
          == 0 and on (address) max by (address) (increase(probes_checks_total{target="app",
          outcome="failed", k8s_namespace_name="factory", k8s_pod_label_app_kubernetes_io_name="probes"}[2m]))
          > 0 and on (address) max by (address) (count_over_time(probes_checks_total{target="app",
          k8s_namespace_name="factory", k8s_pod_label_app_kubernetes_io_name="probes"}[1m]))
          > 0
        for: 1m
        keep_firing_for: 10m
        labels:
          level: page
      - alert: ProbesDown
        annotations:
          description: The probes have said nothing for some minutes of whether the console
            and the app answer, so neither going down would reach you.
          summary: The probes have stopped checking
        expr: sum(increase(probes_checks_total{k8s_namespace_name="factory", k8s_pod_label_app_kubernetes_io_name="probes"}[5m]))
          == 0 or absent(probes_checks_total{k8s_namespace_name="factory", k8s_pod_label_app_kubernetes_io_name="probes"})
        for: 2m
        keep_firing_for: 10m
        labels:
          level: page
          worker: probes
      - alert: LineStuck
        annotations:
          description: 'A work item the line is carrying has stood at {{ $labels.stage
            }} longer than its limit: a step, a release or a look that should have ended
            has not. The line''s dashboard shows which.'
          summary: The line is stuck at {{ $labels.stage }}
        expr: max by (stage) (line_taken_oldest_seconds{k8s_namespace_name="factory",
          k8s_pod_label_app_kubernetes_io_name="line"}) > on (stage) max by (stage) (line_taken_limit_seconds{k8s_namespace_name="factory",
          k8s_pod_label_app_kubernetes_io_name="line"})
        for: 0s
        keep_firing_for: 10m
        labels:
          level: page
          worker: line
      - alert: LeaseOverrun
        annotations:
          description: 'A work item has been held for more than five minutes past its
            lease: the worker that took it neither finished nor let it go, and no line
            has taken it back.'
          summary: A lease on the line has run out unreleased
        expr: max(line_lease_overrun_seconds{k8s_namespace_name="factory", k8s_pod_label_app_kubernetes_io_name="line"})
          > 300
        for: 0s
        keep_firing_for: 10m
        labels:
          level: page
          worker: line
      - alert: StoreDown
        annotations:
          description: 'Postgres has not answered its exporter for a minute: the line,
            triage and the console cannot read or record anything.'
          summary: The store is not answering
        expr: min(pg_up) == 0
        for: 1m
        keep_firing_for: 10m
        labels:
          level: page
      - alert: StoreUnwatched
        annotations:
          description: Postgres's exporter has reported nothing for some minutes, so the
            store going down would not be told.
          summary: Nothing says whether the store answers
        expr: absent(pg_up)
        for: 5m
        keep_firing_for: 10m
        labels:
          level: page
      - alert: WorkerCrashLooping
        annotations:
          description: '{{ $labels.pod }} in factory has restarted three times in five
            minutes, and Kubernetes waits longer each time to start it again.'
          summary: A worker is crash-looping
        expr: max by (pod, worker) (label_replace((max_over_time(kube_pod_container_status_restarts_total{namespace="factory"}[5m])
          - min_over_time(kube_pod_container_status_restarts_total{namespace="factory"}[5m]))
          and on (namespace, pod) group by (namespace, pod) (kube_pod_owner{namespace="factory",
          owner_kind="ReplicaSet"}), "worker", "$1", "pod", "(.+)-[a-z0-9]{5,10}-[a-z0-9]{5}")
          or ((max_over_time(kube_pod_container_status_restarts_total{namespace="factory"}[5m])
          - min_over_time(kube_pod_container_status_restarts_total{namespace="factory"}[5m]))
          unless on (namespace, pod) group by (namespace, pod) (kube_pod_owner{namespace="factory",
          owner_kind="ReplicaSet"}))) >= 3
        for: 0s
        keep_firing_for: 10m
        labels:
          level: page
      - alert: SpendCapReached
        annotations:
          description: The gateway refuses every model call until the cap clears, when
            its window ends or you raise it in the console, and the line starts no step
            meanwhile.
          summary: The {{ $labels.cap }}'s spend cap is reached
        expr: max by (cap, profile) (gateway_cap_spent_usd{cap=~"day|month", k8s_namespace_name="factory",
          k8s_pod_label_app_kubernetes_io_name="gateway"}) >= on (cap, profile) (min by
          (cap, profile) (gateway_cap_limit_usd{cap=~"day|month", k8s_namespace_name="factory",
          k8s_pod_label_app_kubernetes_io_name="gateway"}) >= 0)
        for: 0s
        labels:
          level: page
      - alert: JudgementsUnauthorized
        annotations:
          description: 'The gateway answered a judgement 401. If triage''s log says the
            gateway refused its token, triage judges no report until it has the gateway''s:
            run make judgements-token. If not, something else in the cluster asked Jev,
            which only triage may.'
          summary: A judgement came without triage's token
        expr: max(increase(gateway_judgements_unauthorized_total{k8s_namespace_name="factory",
          k8s_pod_label_app_kubernetes_io_name="gateway"}[5m])) > 0
        for: 0s
        keep_firing_for: 10m
        labels:
          level: page
      - alert: ReleaseRolledBack
        annotations:
          description: The canary's analysis failed it, or judged it bad and you aborted
            it, and the stable version serves every visitor again. Its work items wait
            for the next deploy, or your retry.
          summary: A release rolled back
        expr: max by (outcome) (increase(line_releases_total{outcome=~"rolled-back", dry_run="false",
          k8s_namespace_name="factory", k8s_pod_label_app_kubernetes_io_name="line"}[5m]))
          > 0
        for: 0s
        labels:
          level: notify
      - alert: ReleaseRolledBack
        annotations:
          description: Its canary was stopped, by Stop the line or by hand, and the stable
            version serves every visitor again. Its work items wait for your retry.
          summary: A release was aborted
        expr: max by (outcome) (increase(line_releases_total{outcome=~"aborted", dry_run="false",
          k8s_namespace_name="factory", k8s_pod_label_app_kubernetes_io_name="line"}[5m]))
          > 0
        for: 0s
        labels:
          level: notify
      - alert: ReleaseErrored
        annotations:
          description: 'The canary''s analysis could not judge it, so it was stopped:
            the stable version still serves every visitor, and its work items wait for
            your retry.'
          summary: A release ended in error
        expr: max by (outcome) (increase(line_releases_total{outcome=~"errored", dry_run="false",
          k8s_namespace_name="factory", k8s_pod_label_app_kubernetes_io_name="line"}[5m]))
          > 0
        for: 0s
        labels:
          level: notify
      - alert: ArgoCDDegraded
        annotations:
          description: 'It has been Degraded for 30 minutes: something it deploys is not
            healthy.'
          summary: 'Argo CD: {{ $labels.name }} is degraded'
        expr: max by (name) (argocd_app_info{health_status="Degraded"}) == 1
        for: 30m
        keep_firing_for: 10m
        labels:
          level: notify
      - alert: ArgoCDOutOfSync
        annotations:
          description: For 30 minutes what runs has not been what main says.
          summary: 'Argo CD: {{ $labels.name }} is out of sync'
        expr: max by (name) (argocd_app_info{sync_status="OutOfSync"}) == 1
        for: 30m
        keep_firing_for: 10m
        labels:
          level: notify
