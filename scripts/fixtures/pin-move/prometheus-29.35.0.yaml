          or sum by (http_route) (rate(http_server_request_duration_seconds_count{job="worlds-worst-website/website",
          k8s_pod_label_rollouts_pod_template_hash!="", http_route!=""}[15m])) * 0) /
          sum by (http_route) (rate(http_server_request_duration_seconds_count{job="worlds-worst-website/website",
          k8s_pod_label_rollouts_pod_template_hash!="", http_route!=""}[15m]))) and on
          (http_route) (sum by (http_route) (increase(http_server_request_duration_seconds_count{job="worlds-worst-website/website",
          k8s_pod_label_rollouts_pod_template_hash!="", http_route!=""}[15m])) >= 20)
        record: website:route_errors:ratio_rate15m
      - expr: histogram_quantile(0.95, sum by (le, http_route) (rate(http_server_request_duration_seconds_bucket{job="worlds-worst-website/website",
          k8s_pod_label_rollouts_pod_template_hash!="", http_route!=""}[15m]))) and on
          (http_route) (sum by (http_route) (increase(http_server_request_duration_seconds_count{job="worlds-worst-website/website",
          k8s_pod_label_rollouts_pod_template_hash!="", http_route!=""}[15m])) >= 20)
        record: website:route_latency_seconds:p95_rate15m
    - interval: 5m
      name: error-budget-rates
      rules:
      - expr: sum(rate(http_server_request_duration_seconds_count{job="worlds-worst-website/website",
          k8s_pod_label_rollouts_pod_template_hash!="", http_route!=""}[5m]))
        record: website:requests:rate5m
      - expr: sum(rate(http_server_request_duration_seconds_count{job="worlds-worst-website/website",
          k8s_pod_label_rollouts_pod_template_hash!="", http_route!="", http_response_status_code=~"5.."}[5m]))
          or vector(0)
        labels:
          objective: error-ratio
        record: website:requests_bad:rate5m
      - expr: sum(rate(http_server_request_duration_seconds_count{job="worlds-worst-website/website",
          k8s_pod_label_rollouts_pod_template_hash!="", http_route!=""}[5m])) - sum(rate(http_server_request_duration_seconds_bucket{job="worlds-worst-website/website",
          k8s_pod_label_rollouts_pod_template_hash!="", http_route!="", le="1"}[5m]))
        labels:
          objective: latency
        record: website:requests_bad:rate5m
    - name: error-budget
      rules:
      - expr: vector(0.05)
        labels:
          objective: error-ratio
        record: website:error_budget:ratio
      - expr: vector(0.05)
        labels:
          objective: latency
        record: website:error_budget:ratio
      - expr: sum_over_time(website:requests_bad:rate5m[1h]) / ignoring (objective) group_left
          () (sum_over_time(website:requests:rate5m[1h]) > 0)
        record: website:requests_bad:ratio_rate1h
      - expr: website:requests_bad:ratio_rate1h / on (objective) website:error_budget:ratio
        record: website:error_budget_burn:rate1h
      - expr: sum_over_time(website:requests_bad:rate5m[6h]) / ignoring (objective) group_left
          () (sum_over_time(website:requests:rate5m[6h]) > 0)
        record: website:requests_bad:ratio_rate6h
      - expr: website:requests_bad:ratio_rate6h / on (objective) website:error_budget:ratio
        record: website:error_budget_burn:rate6h
      - expr: sum_over_time(website:requests_bad:rate5m[7d]) / ignoring (objective) group_left
          () (sum_over_time(website:requests:rate5m[7d]) > 0)
        record: website:requests_bad:ratio_rate7d
      - expr: 1 - website:requests_bad:ratio_rate7d / on (objective) website:error_budget:ratio
        record: website:error_budget_remaining:ratio7d
    - name: line
      rules:
      - expr: vector(5400)
        labels:
          stage: plan
        record: line:stage_limit_seconds
      - expr: vector(7200)
        labels:
          stage: build
        record: line:stage_limit_seconds
      - expr: vector(3600)
        labels:
          stage: gates
        record: line:stage_limit_seconds
      - expr: vector(7200)
        labels:
          stage: review
        record: line:stage_limit_seconds
      - expr: vector(3600)
        labels:
          stage: release
        record: line:stage_limit_seconds
      - expr: vector(90000)
        labels:
          stage: verify
        record: line:stage_limit_seconds
      - expr: max by (stage) (line_work_items)
        record: line:work_items:max
      - expr: max by (stage) (line_stage_oldest_seconds)
        record: line:stage_oldest_seconds:max
      - expr: line:stage_oldest_seconds:max / on (stage) line:stage_limit_seconds
        record: line:stage_oldest:ratio_to_limit
      - expr: timestamp(sum(increase(line_steps_total[5m])) > 0)
        record: line:steps:last_timestamp_seconds
  rules: |
    {}
