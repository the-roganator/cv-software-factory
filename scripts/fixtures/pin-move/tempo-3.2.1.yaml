automountServiceAccountToken: true

---
# Source: tempo/templates/configmap-tempo.yaml
apiVersion: v1
kind: ConfigMap
metadata:
  name: tempo
  namespace: telemetry
  labels:
    helm.sh/chart: tempo-3.2.1
    app.kubernetes.io/name: tempo
    app.kubernetes.io/instance: tempo
    app.kubernetes.io/version: "3.1.1"
    app.kubernetes.io/managed-by: Helm
data:
  overrides.yaml: |
    overrides:
      {}
  tempo.yaml: |
    stream_over_http_enabled: false
    memberlist:
      cluster_label: "tempo.telemetry"
    multitenancy_enabled: false
    usage_report:
      reporting_enabled: false
    backend_scheduler:
          provider:
            compaction:
              compaction:
                block_retention: 72h
    backend_worker:
          backoff:
            max_period: 5m
          compaction:
            block_retention: 72h
    distributor:
      receivers:
            jaeger:
              protocols:
                grpc:
                  endpoint: 0.0.0.0:14250
                thrift_binary:
                  endpoint: 0.0.0.0:6832
                thrift_compact:
                  endpoint: 0.0.0.0:6831
                thrift_http:
                  endpoint: 0.0.0.0:14268
            otlp:
              protocols:
                grpc:
                  endpoint: 0.0.0.0:4317
                http:
                  endpoint: 0.0.0.0:4318
    server:
          http_listen_port: 3200
    storage:
          trace:
            backend: local
            local:
              path: /var/tempo/traces
            wal:
              path: /var/tempo/wal
    querier:
          max_concurrent_queries: 8
    query_frontend:
          max_batch_size: 1
          metrics:
            max_duration: 24h
          search:
            max_duration: 24h
            max_result_limit: 1000
    overrides:
          defaults:
            metrics_generator:
              processors:
              - service-graphs
          per_tenant_override_config: /conf/overrides.yaml
    metrics_generator:
      processor:
            service_graphs:
              database_name_attributes:
              - db.system
              peer_attributes:
              - server.address
      registry:
            collection_interval: 1m
      storage:
        path: "/var/tempo/generator/wal"
        remote_write:
              - url: http://prometheus-server.telemetry/api/v1/write
                write_relabel_configs:
                - action: keep
                  regex: traces_service_graph_.+
                  source_labels:
                  - __name__
    

